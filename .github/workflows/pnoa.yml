name: Vistas aéreas PNOA
on:
  push:
    paths: ["tools/pnoa/in.json", "tools/pnoa/pnoa.py", ".github/workflows/pnoa.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tools/pnoa }
      - run: python3 tools/pnoa/pnoa.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/pnoa/out && git commit -m "Vistas aéreas PNOA" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep 6; done
