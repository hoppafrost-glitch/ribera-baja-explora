name: Audio de clientes
on:
  push:
    paths: ["tools/clientes/texts/**", "tools/clientes/tts.py", ".github/workflows/clientes-tts.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: clientes-tts
  cancel-in-progress: true
jobs:
  tts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [es, en, fr, de, pt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q "piper-tts>=1.3"
      - run: python tools/clientes/tts.py ${{ matrix.lang }}
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/clientes/audio
          git commit -m "Audio clientes (${{ matrix.lang }})" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push && break; sleep $((RANDOM % 10 + 5)); done
