name: App Android e iOS
on:
  push:
    paths: ["app/**", ".github/workflows/app-build.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            img
            audio
            index.html
            accesibilidad.html
            privacidad.html
            manifest.webmanifest
            icon-192.png
            icon-512.png
            apple-touch-icon.png
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Preparar
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          python3 prepare_www.py ..
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#17646C' --splashBackgroundColor '#17646C'
          python3 patch_android.py
          npx cap sync android
      - name: Compilar
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/RiberaBajaExplora-instalable.apk
          cp app/build/outputs/bundle/release/app-release.aab ../out/RiberaBajaExplora-sin-firmar.aab
          ls -la ../out
      - name: Publicar en Releases
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          T=app-android-${{ github.run_number }}
          gh release create "$T" app/out/* --title "App Android ${{ github.run_number }}" --notes "APK instalable (pruebas) y AAB para Google Play (firmar antes de subir)." --prerelease
  ios:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            img
            audio
            index.html
            accesibilidad.html
            privacidad.html
            manifest.webmanifest
            icon-192.png
            icon-512.png
            apple-touch-icon.png
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Preparar
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          python3 prepare_www.py ..
          npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#17646C' --splashBackgroundColor '#17646C'
          python3 patch_ios.py
          npx cap sync ios
      - name: Compilar (simulador, comprueba que el proyecto está bien)
        working-directory: app/ios/App
        run: |
          set -o pipefail
          ls
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Empaquetar proyecto Xcode
        working-directory: app
        run: |
          rm -rf ios/App/build
          zip -qr RiberaBajaExplora-proyecto-iOS.zip ios package.json package-lock.json capacitor.config.json
          ls -la RiberaBajaExplora-proyecto-iOS.zip
      - name: Publicar en Releases
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          T=app-ios-${{ github.run_number }}
          gh release create "$T" app/RiberaBajaExplora-proyecto-iOS.zip --title "Proyecto iOS ${{ github.run_number }}" --notes "Proyecto Xcode listo para firmar y subir a App Store Connect." --prerelease
