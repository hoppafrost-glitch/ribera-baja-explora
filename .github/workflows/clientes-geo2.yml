name: Coordenadas finas
on:
  push:
    paths: ["tools/clientes/geo2_in.json", "tools/clientes/geo2.py", ".github/workflows/clientes-geo2.yml"]
permissions:
  contents: write
jobs:
  g:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/clientes/geo2.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/clientes/out/geo2.json && git commit -m "Coordenadas finas" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push && break; sleep 7; done
