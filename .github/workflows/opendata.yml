name: Datos abiertos
on:
  push:
    paths: ["tools/opendata.py", ".github/workflows/opendata.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/opendata.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/opendata && git commit -m "Registro de turismo (datos abiertos)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
