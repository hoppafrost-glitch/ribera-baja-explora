name: Preparar clientes
on:
  push:
    paths: ["tools/clientes/in.json", "tools/clientes/prep.py", ".github/workflows/clientes.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: clientes-prep
  cancel-in-progress: true
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        slug: [campo-de-belchite, andorra-sierra-de-arcos, campo-de-daroca, cinco-villas, bajo-cinca]
    steps:
      - uses: actions/checkout@v4
      - run: pip install shapely
      - run: python3 tools/clientes/prep.py ${{ matrix.slug }}
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/clientes/out && git commit -m "Datos de clientes (${{ matrix.slug }})" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push && break; sleep 7; done
