name: Preparar clientes
on:
  push:
    paths: ["tools/clientes/in.json", "tools/clientes/prep.py", ".github/workflows/clientes.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: pip install shapely
      - run: python3 tools/clientes/prep.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/clientes/out && git commit -m "Datos de clientes" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 7; done
