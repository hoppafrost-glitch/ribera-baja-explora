name: Revisar voces
on:
  push:
    paths: ["tools/clientes/qa.txt", "tools/clientes/qa_audio.py", ".github/workflows/clientes-qa.yml"]
permissions:
  contents: write
jobs:
  q:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q faster-whisper
      - run: python tools/clientes/qa_audio.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/clientes/out/qa-audio.json && git commit -m "Revisión de voces" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push && break; sleep 7; done
