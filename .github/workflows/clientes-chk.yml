name: Revisar fotos
on:
  push:
    paths: ["tools/clientes/chk_in.json", "tools/clientes/chk.py", ".github/workflows/clientes-chk.yml"]
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/clientes/chk.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/clientes/chk_out.json && git commit -m "Metadatos de fotos" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push && break; sleep 7; done
