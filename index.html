/* Layout: one-screen app. Map is the stage; a reading panel sits beside it (stacked under it on phones).

:root{
  --bg:#ECEFEA; --panel:#FAFBF8; --panel-2:#F2F4EF; --ink:#18221E; --muted:#56635D; --faint:#7D8984;

  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}

  --bg:#0E1412; --panel:#141C19; --panel-2:#19231F; --ink:#E5ECE8; --muted:#9FADA7; --faint:#7E8C86;

  --c-pat:#E08A63; --c-gue:#A9B872; --c-mus:#C08BC5; --c-hid:#6FA9DA; --c-nat:#7CC48D; --c-arq:#D6AE68; --c-cam:#E5BD45;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:1001}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand svg{flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1.28rem;line-height:1.1;letter-spacing:.01em}
.brand-sub{font-size:.74rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel-2)}
.langs button{border:0;background:transparent;padding:5px 10px;font-size:.78rem;font-weight:600;letter-spacing:.05em;cursor:pointer;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.demo-tag{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:2px 6px}

main{display:grid;grid-template-columns:minmax(330px,410px) 1fr;min-height:0}
#panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#mapwrap{position:relative;min-height:0;min-width:0}
#map{position:absolute;inset:0;background:var(--bg)}
@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(260px,46%) 1fr}
  #mapwrap{order:-1}
  #panel{border-right:0;border-top:1px solid var(--line)}
  .brand-sub{display:none}
}

nav.tabs{display:flex;gap:2px;padding:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:9px 9px 10px;font-weight:600;font-size:.85rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.view{flex:1;overflow-y:auto;min-height:0;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

ña: quince cuerpos que se momificaron de forma natural entre los siglos XVIII y XIX, hallados en 2011 entre más de mil enterramientos.","en":"The old Church of the Assumption, built in Mudéjar brick, crowns Quinto from the Corona hill; work began in the early 15th century and it is a fine example of Aragonese Mudéjar. It was damaged in the 1937 battle. Since 2018 it has housed Spain's first mummy museum: fifteen bodies naturally mummified in the 18th and 19th centuries, found in 2011 among more than a thousand burials.","fr":"L'ancienne église de l'Assomption, en brique mudéjare, domine Quinto depuis la colline de la Corona ; commencée au début du XVe siècle, elle est un bel exemple de l'art mudéjar aragonais. Elle fut endommagée lors de la bataille de 1937. Depuis 2018, elle abrite le premier musée des momies d'Espagne : quinze corps momifiés naturellement aux XVIIIe et XIXe siècles, retrouvés en 2011 parmi plus de mille sépultures.","de":"Die alte Mariä-Himmelfahrt-Kirche aus Mudéjar-Backstein thront auf dem Corona-Hügel über Quinto; begonnen Anfang des 15. Jahrhunderts, ist sie ein herausragendes Beispiel des aragonesischen Mudéjar. In der Schlacht von 1937 wurde sie beschädigt. Seit 2018 beherbergt sie Spaniens erstes Mumienmuseum: fünfzehn im 18. und 19. Jahrhundert natürlich mumifizierte Leichname, 2011 unter über tausend Bestattungen gefunden.","pt":"A antiga igreja da Assunção, em tijolo mudéjar, domina Quinto a partir da colina da Corona; foi iniciada no início do século XV e é um destacado exemplo do mudéjar aragonês. Ficou danificada na batalha de 1937. Desde 2018 acolhe o primeiro museu de múmias de Espanha: quinze corpos mumificados naturalmente entre os séculos XVIII e XIX, encontrados em 2011 entre mais de mil enterramentos."},"visit":{"es":"Solo con visita guiada. Reservas en momiasdequinto.es.","en":"Guided visits only. Book at momiasdequinto.es.","fr":"Uniquement en visite guidée. Réservation sur momiasdequinto.es.","de":"Nur mit Führung. Buchung über momiasdequinto.es.","pt":"Apenas com visita guiada. Reservas em momiasdequinto.es."}},{"id":"portal-sanroque","town":"Quinto","cat":"patrimonio","lat":41.42203,"lon":-0.49614,"src":"https://www.campaners.com/php/torrepdf.php?numer=9416","name":{"es":"Portal de San Roque","en":"San Roque gate","fr":"Porte de San Roque","de":"Stadttor San Roque","pt":"Portal de San Roque"},"when":{"es":"Origen medieval · aspecto actual de los siglos XVII–XVIII","en":"Medieval origin · present form 17th–18th century","fr":"Origine médiévale · aspect actuel des XVIIe–XVIIIe siècles","de":"Mittelalterlicher Ursprung · heutige Form 17.–18. Jh.","pt":"Origem medieval · aspeto atual dos séculos XVII–XVIII"},"desc":{"es":"Uno de los tres portales que cerraban Quinto, junto a los de San Antón y San Miguel. Era la salida hacia Alcañiz y sobre el paso tiene una capilla octogonal con linterna y un reloj de sol. Se restauró en 2010.","en":"One of the three gateways into old Quinto, along with those of San Antón and San Miguel. It was the way out towards Alcañiz, and above the passage sits an octagonal chapel with a lantern and a sundial. It was restored in 2010.","fr":"L'une des trois portes qui fermaient Quinto, avec celles de San Antón et de San Miguel. C'était la sortie vers Alcañiz ; au-dessus du passage se trouve une chapelle octogonale à lanterne avec un cadran solaire. Restaurée en 2010.","de":"Eines der drei Tore, die Quinto abschlossen, neben San Antón und San Miguel. Hier ging es nach Alcañiz; über dem Durchgang sitzt eine achteckige Kapelle mit Laterne und Sonnenuhr. 2010 restauriert.","pt":"Um dos três portais que fechavam Quinto, juntamente com os de San Antón e San Miguel. Era a saída para Alcañiz e sobre a passagem tem uma capela octogonal com lanternim e um relógio de sol. Foi restaurado em 2010."}},{"id":"quinto-camino","town":"Quinto","cat":"camino","lat":41.42496,"lon":-0.4958,"src":"https://www.gronze.com/etapa/escatron/quinto","name":{"es":"Quinto, final de etapa del Camino Jacobeo","en":"Quinto, stage end on the Way of St James","fr":"Quinto, fin d'étape du Chemin de Saint-Jacques","de":"Quinto, Etappenziel am Jakobsweg","pt":"Quinto, fim de etapa do Caminho de Santiago"},"when":{"es":"Plaza de España · etapa Escatrón–Quinto","en":"Plaza de España · Escatrón–Quinto stage","fr":"Plaza de España · étape Escatrón–Quinto","de":"Plaza de España · Etappe Escatrón–Quinto","pt":"Plaza de España · etapa Escatrón–Quinto"},"desc":{"es":"Quinto cierra la etapa que llega desde Escatrón pasando por el Monasterio de Rueda y Gelsa, y abre la siguiente hacia Fuentes de Ebro y Zaragoza. La iglesia parroquial de la plaza la levantó después de la guerra la Dirección General de Regiones Devastadas, con proyecto de 1943.","en":"Quinto ends the stage that arrives from Escatrón via the Monastery of Rueda and Gelsa, and starts the next one towards Fuentes de Ebro and Zaragoza. The parish church on the square was built after the war by the post-war reconstruction agency (Regiones Devastadas), to a 1943 design.","fr":"Quinto clôt l'étape qui arrive d'Escatrón par le monastère de Rueda et Gelsa, et ouvre la suivante vers Fuentes de Ebro et Saragosse. L'église paroissiale de la place a été construite après la guerre par le service de reconstruction Regiones Devastadas, sur un projet de 1943.","de":"Quinto ist Ziel der Etappe von Escatrón über das Kloster Rueda und Gelsa und Ausgangspunkt der nächsten Richtung Fuentes de Ebro und Zaragoza. Die Pfarrkirche am Platz wurde nach dem Krieg vom Wiederaufbauamt Regiones Devastadas nach einem Entwurf von 1943 gebaut.","pt":"Quinto fecha a etapa que chega de Escatrón pelo Mosteiro de Rueda e Gelsa, e abre a seguinte em direção a Fuentes de Ebro e Saragoça. A igreja paroquial da praça foi construída depois da guerra pelo organismo de reconstrução Regiones Devastadas, com projeto de 1943."}},{"id":"purburel","town":"Quinto","cat":"memoria","lat":41.41049,"lon":-0.48898,"src":"https://quinto.es/tu-municipio/trincheras","name":{"es":"Trincheras del Purburel","en":"Purburel trenches","fr":"Tranchées du Purburel","de":"Schützengräben am Purburel","pt":"Trincheiras do Purburel"},"when":{"es":"Batalla de Quinto · 24–26 de agosto de 1937","en":"Battle of Quinto · 24–26 August 1937","fr":"Bataille de Quinto · 24–26 août 1937","de":"Schlacht von Quinto · 24.–26. August 1937","pt":"Batalha de Quinto · 24–26 de agosto de 1937"},"desc":{"es":"Era la posición más fortificada del bando sublevado en Quinto: alambradas, nidos de ametralladora y unos 250 metros de trinchera. Entre el 24 y el 26 de agosto de 1937 la atacaron las Brigadas Internacionales XI y XV, y el Batallón Británico asaltó el cerro el día 25. Hoy el recorrido está señalizado y tiene paneles.","en":"This was the most heavily fortified Nationalist position at Quinto: barbed wire, machine-gun nests and some 250 metres of trench. Between 24 and 26 August 1937 it was attacked by the XI and XV International Brigades, and the British Battalion stormed the hill on the 25th. Today the site is signposted with information panels.","fr":"C'était la position la plus fortifiée du camp nationaliste à Quinto : barbelés, nids de mitrailleuses et quelque 250 mètres de tranchée. Du 24 au 26 août 1937, les XIe et XVe Brigades internationales l'attaquèrent, et le bataillon britannique prit d'assaut la colline le 25. Le site est aujourd'hui balisé et doté de panneaux.","de":"Die am stärksten befestigte Stellung der Aufständischen in Quinto: Stacheldraht, MG-Nester und rund 250 Meter Schützengraben. Vom 24. bis 26. August 1937 griffen die XI. und XV. Internationalen Brigaden an, am 25. stürmte das Britische Bataillon den Hügel. Heute ist der Ort ausgeschildert und mit Tafeln versehen.","pt":"Era a posição mais fortificada do lado sublevado em Quinto: arame farpado, ninhos de metralhadora e cerca de 250 metros de trincheira. Entre 24 e 26 de agosto de 1937 foi atacada pelas Brigadas Internacionais XI e XV, e o Batalhão Britânico assaltou a colina no dia 25. Hoje o percurso está sinalizado e tem painéis."},"visit":{"es":"Acceso libre. Visitas guiadas con reserva en momiasdequinto.es.","en":"Open access. Guided visits bookable at momiasdequinto.es.","fr":"Accès libre. Visites guidées sur réservation via momiasdequinto.es.","de":"Frei zugänglich. Führungen buchbar über momiasdequinto.es.","pt":"Acesso livre. Visitas guiadas com reserva em momiasdequinto.es."}},{"id":"cabezo-nariz","town":"Quinto","cat":"memoria","lat":41.41394,"lon":-0.49224,"src":"https://quintodeebro.com/guerra/guia_visita.pdf","name":{"es":"Cabezo de la Nariz","en":"Cabezo de la Nariz hill","fr":"Colline Cabezo de la Nariz","de":"Hügel Cabezo de la Nariz","pt":"Cabezo de la Nariz"},"when":{"es":"26 de agosto de 1937, 18:30","en":"26 August 1937, 6.30 pm","fr":"26 août 1937, 18 h 30","de":"26. August 1937, 18:30 Uhr","pt":"26 de agosto de 1937, 18h30"},"desc":{"es":"Último punto que resistió en la batalla de Quinto. Tras las primeras rendiciones de la tarde, las tropas republicanas lo tomaron hacia las seis y media del 26 de agosto de 1937, y con él terminó la lucha por el pueblo.","en":"The last point to hold out in the Battle of Quinto. After the first surrenders that afternoon, Republican troops took it at around half past six on 26 August 1937, ending the fight for the village.","fr":"Dernier point à résister lors de la bataille de Quinto. Après les premières redditions de l'après-midi, les troupes républicaines le prirent vers 18 h 30 le 26 août 1937, mettant fin aux combats pour le village.","de":"Der letzte Punkt, der in der Schlacht von Quinto standhielt. Nach den ersten Kapitulationen am Nachmittag nahmen republikanische Truppen ihn am 26. August 1937 gegen 18:30 Uhr ein; damit endete der Kampf um den Ort.","pt":"O último ponto a resistir na batalha de Quinto. Depois das primeiras rendições da tarde, as tropas republicanas tomaram-no por volta das seis e meia de 26 de agosto de 1937, pondo fim à luta pela vila."}},{"id":"bonastre","town":"Quinto","cat":"patrimonio","lat":41.46836,"lon":-0.55181,"src":"https://www.quintodeebro.com/web/docs/quinto-ermitas.pdf","name":{"es":"Ermita de Nuestra Señora de Bonastre","en":"Chapel of Our Lady of Bonastre","fr":"Chapelle Notre-Dame de Bonastre","de":"Kapelle Nuestra Señora de Bonastre","pt":"Ermida de Nossa Senhora de Bonastre"},"when":{"es":"Reconstruida en 1847 · romería el Lunes de Pascua","en":"Rebuilt 1847 · pilgrimage on Easter Monday","fr":"Reconstruit en 1847 · pèlerinage le lundi de Pâques","de":"1847 wiederaufgebaut · Wallfahrt am Ostermontag","pt":"Reconstruída em 1847 · romaria na Segunda-feira de Páscoa"},"desc":{"es":"Ermita junto a la N-232, a unos 7 km de Quinto hacia Zaragoza. Una inscripción recuerda su reconstrucción en 1847. En 1937 fue una de las posiciones defensivas y tras la Guerra Civil volvió a reconstruirse. Cada Lunes de Pascua el pueblo sube en romería.","en":"A chapel beside the N-232, about 7 km from Quinto towards Zaragoza. An inscription records its rebuilding in 1847, In 1937 it was one of the defensive positions, and it was rebuilt again after the Civil War. Every Easter Monday the village walks here on pilgrimage.","fr":"Chapelle au bord de la N-232, à environ 7 km de Quinto vers Saragosse. Une inscription rappelle sa reconstruction de 1847 ; en 1937, elle servit de position défensive et fut de nouveau relevée après la guerre civile. Chaque lundi de Pâques, le village y monte en pèlerinage.","de":"Kapelle an der N-232, etwa 7 km von Quinto Richtung Zaragoza. Eine Inschrift erinnert an den Wiederaufbau 1847; nach dem Bürgerkrieg, in dem sie 1937 eine Verteidigungsstellung war, wurde sie erneut aufgebaut. Jeden Ostermontag pilgert der Ort hierher.","pt":"Ermida junto à N-232, a cerca de 7 km de Quinto em direção a Saragoça. Uma inscrição recorda a reconstrução de 1847, Em 1937 foi uma das posições defensivas e voltou a ser reconstruída depois da Guerra Civil. Todas as Segundas-feiras de Páscoa a vila sobe em romaria."}},{"id":"pina-convento","town":"Pina de Ebro","cat":"patrimonio","lat":41.48732,"lon":-0.53108,"src":"https://campaners.com/php/torrepdf.php?numer=4348","name":{"es":"Antiguo convento franciscano de Pina","en":"Former Franciscan friary of Pina","fr":"Ancien couvent franciscain de Pina","de":"Ehemaliges Franziskanerkloster von Pina","pt":"Antigo convento franciscano de Pina"},"when":{"es":"1530–1539 · claustro gótico y renacentista","en":"1530–1539 · Gothic and Renaissance cloister","fr":"1530–1539 · cloître gothique et Renaissance","de":"1530–1539 · Kreuzgang aus Gotik und Renaissance","pt":"1530–1539 · claustro gótico e renascentista"},"desc":{"es":"Convento construido entre 1530 y 1539 bajo el patrocinio de los condes de Sástago, sobre un templo mudéjar anterior que se reformó en estilo barroco en el siglo XVIII. Su claustro mezcla el gótico levantino con el renacimiento aragonés. Es la parroquia de Pina desde 1939, porque la de Santa María quedó arruinada en la guerra.","en":"A friary built between 1530 and 1539 under the patronage of the Counts of Sástago, over an earlier Mudéjar church remodelled in Baroque style in the 18th century. Its cloister blends Valencian-style Gothic with Aragonese Renaissance. It has been Pina's parish church since 1939, after the church of Santa María was left in ruins in the war.","fr":"Couvent fondé entre 1530 et 1539 sous le patronage des comtes de Sástago, sur une église mudéjare antérieure remaniée en style baroque au XVIIIe siècle. Son cloître mêle gothique levantin et Renaissance aragonaise. C'est l'église paroissiale de Pina depuis 1939, celle de Santa María ayant été ruinée pendant la guerre.","de":"Zwischen 1530 und 1539 unter dem Patronat der Grafen von Sástago gegründet, über einer älteren Mudéjar-Kirche, die im 18. Jahrhundert barock umgestaltet wurde. Der Kreuzgang verbindet levantinische Gotik mit aragonesischer Renaissance. Seit 1939 Pfarrkirche von Pina, da Santa María im Krieg zerstört wurde.","pt":"Convento fundado entre 1530 e 1539 sob o patrocínio dos condes de Sástago, sobre um templo mudéjar anterior reformado em estilo barroco no século XVIII. O claustro mistura o gótico levantino com o renascimento aragonês. É a igreja matriz de Pina desde 1939, porque a de Santa María ficou em ruínas na guerra."}},{"id":"pina-durruti","town":"Pina de Ebro","cat":"memoria","lat":41.48896,"lon":-0.52602,"src":"https://es.hispanopedia.com/wiki/Pina_de_Ebro","name":{"es":"Pina en el frente de 1936","en":"Pina on the 1936 front line","fr":"Pina sur le front de 1936","de":"Pina an der Front von 1936","pt":"Pina na frente de 1936"},"when":{"es":"Verano de 1936 · Columna Durruti","en":"Summer 1936 · Durruti Column","fr":"Été 1936 · colonne Durruti","de":"Sommer 1936 · Kolonne Durruti","pt":"Verão de 1936 · Coluna Durruti"},"desc":{"es":"La columna anarquista de Buenaventura Durruti salió de Barcelona el 24 de julio de 1936 y avanzó por Lérida y los Monegros hacia Zaragoza hasta quedar atrincherada en Pina, con su cuartel general en Bujaraloz. De la vieja parroquia de Santa María, destruida en la guerra, solo queda la Torre Vieja, hoy símbolo del pueblo.","en":"Buenaventura Durruti's anarchist column left Barcelona on 24 July 1936 and advanced through Lleida and the Monegros towards Zaragoza until it dug in at Pina, with its headquarters at Bujaraloz. Of the old parish church of Santa María, destroyed in the war, only the Torre Vieja (Old Tower) remains, now the village's emblem.","fr":"La colonne anarchiste de Buenaventura Durruti quitta Barcelone le 24 juillet 1936 et avança par Lérida et les Monegros vers Saragosse jusqu'à se retrancher à Pina, avec son quartier général à Bujaraloz. De l'ancienne église Santa María, détruite pendant la guerre, il ne reste que la Torre Vieja, aujourd'hui emblème du village.","de":"Die anarchistische Kolonne von Buenaventura Durruti verließ Barcelona am 24. Juli 1936 und zog über Lleida und die Monegros Richtung Zaragoza, bis sie sich in Pina eingrub; ihr Hauptquartier lag in Bujaraloz. Von der im Krieg zerstörten alten Pfarrkirche Santa María blieb nur die Torre Vieja (Alter Turm), heute Wahrzeichen des Ortes.","pt":"A coluna anarquista de Buenaventura Durruti saiu de Barcelona a 24 de julho de 1936 e avançou por Lérida e pelos Monegros em direção a Saragoça até ficar entrincheirada em Pina, com o quartel-general em Bujaraloz. Da antiga igreja matriz de Santa María, destruída na guerra, só resta a Torre Vieja, hoje símbolo da vila."}},{"id":"pina-sangregorio","town":"Pina de Ebro","cat":"patrimonio","lat":41.50013,"lon":-0.49235,"src":"https://www.komoot.com/highlight/8155275","name":{"es":"Ermita de San Gregorio","en":"Chapel of St Gregory","fr":"Chapelle Saint-Grégoire","de":"Kapelle San Gregorio","pt":"Ermida de São Gregório"},"when":{"es":"Siglo XVII · romería el 9 de mayo","en":"17th century · pilgrimage on 9 May","fr":"XVIIe siècle · pèlerinage le 9 mai","de":"17. Jh. · Wallfahrt am 9. Mai","pt":"Século XVII · romaria a 9 de maio"},"desc":{"es":"Ermita de una nave del siglo XVII en un alto a unos 3 km de Pina, camino de Monegros. Desde allí se ve el valle del Ebro a un lado y la estepa de Monegros al otro. La romería se celebra el 9 de mayo.","en":"A single-nave 17th-century chapel on a rise about 3 km from Pina, on the road to Monegros. From up here you see the Ebro valley on one side and the Monegros steppe on the other. The pilgrimage takes place on 9 May.","fr":"Chapelle à nef unique du XVIIe siècle, sur une hauteur à environ 3 km de Pina, en direction des Monegros. On y voit d'un côté la vallée de l'Èbre, de l'autre la steppe des Monegros. Le pèlerinage a lieu le 9 mai.","de":"Einschiffige Kapelle aus dem 17. Jahrhundert auf einer Anhöhe rund 3 km von Pina Richtung Monegros. Auf der einen Seite das Ebrotal, auf der anderen die Steppe der Monegros. Die Wallfahrt findet am 9. Mai statt.","pt":"Ermida de nave única do século XVII num alto a cerca de 3 km de Pina, a caminho de Monegros. Dali vê-se o vale do Ebro de um lado e a estepe de Monegros do outro. A romaria celebra-se a 9 de maio."}},{"id":"pina-sotos","town":"Pina de Ebro","cat":"naturaleza","lat":41.46439,"lon":-0.49761,"src":"https://www.mapa.gob.es/en/desarrollo-rural/temas/caminos-naturales/caminos-naturales/sector-noreste/ebro/etapa27/default.aspx","name":{"es":"Sotos y azud de Pina","en":"Pina riverside woods and weir","fr":"Bois riverains et barrage de Pina","de":"Auwälder und Wehr von Pina","pt":"Matas ribeirinhas e açude de Pina"},"when":{"es":"Camino Natural del Ebro (GR 99) · azud de 1910","en":"Ebro Nature Trail (GR 99) · weir of 1910","fr":"Chemin naturel de l'Èbre (GR 99) · barrage de 1910","de":"Ebro-Naturweg (GR 99) · Wehr von 1910","pt":"Caminho Natural do Ebro (GR 99) · açude de 1910"},"desc":{"es":"El Camino Natural del Ebro recorre aquí los sotos de ribera y pasa junto al azud de Pina, de 1910, que riega más de 4.000 hectáreas. En la isla de Pina anida una gran colonia de avión zapador, y aguas abajo el sendero sigue por la Mejana de los Nidos y el meandro de Belloque.","en":"Here the Ebro Nature Trail runs through the riverside woods and passes the Pina weir, built in 1910, which irrigates more than 4,000 hectares. A large colony of sand martins nests on the island of Pina, and downstream the path continues past the Mejana de los Nidos and the Belloque meander.","fr":"Le Chemin naturel de l'Èbre traverse ici les bois riverains et longe le barrage de Pina, de 1910, qui irrigue plus de 4 000 hectares. Une grande colonie d'hirondelles de rivage niche sur l'île de Pina, et en aval le sentier continue par la Mejana de los Nidos et le méandre de Belloque.","de":"Der Ebro-Naturweg führt hier durch die Auwälder und am Wehr von Pina aus dem Jahr 1910 vorbei, das mehr als 4.000 Hektar bewässert. Auf der Insel von Pina brütet eine große Uferschwalbenkolonie; flussabwärts geht es weiter zur Mejana de los Nidos und zur Belloque-Schleife.","pt":"O Caminho Natural do Ebro percorre aqui as matas ribeirinhas e passa junto ao açude de Pina, de 1910, que rega mais de 4.000 hectares. Na ilha de Pina nidifica uma grande colónia de andorinhas-das-barreiras, e a jusante o trilho segue pela Mejana de los Nidos e o meandro de Belloque."}},{"id":"gelsa-sanpedro","town":"Gelsa","cat":"patrimonio","lat":41.40673,"lon":-0.46212,"src":"https://www.campaners.com/php/torrepdf.php?numer=9494","name":{"es":"Iglesia de San Pedro Apóstol","en":"Church of St Peter the Apostle","fr":"Église Saint-Pierre-Apôtre","de":"Kirche San Pedro Apóstol","pt":"Igreja de São Pedro Apóstolo"},"when":{"es":"Último tercio del siglo XVII · torre de 1826","en":"Late 17th century · tower of 1826","fr":"Fin du XVIIe siècle · clocher de 1826","de":"Spätes 17. Jh. · Turm von 1826","pt":"Último terço do século XVII · torre de 1826"},"desc":{"es":"Se levantó a finales del siglo XVII aprovechando los muros de una antigua mezquita y se reformó en 1863. Tiene tres naves, crucero con cúpula y una torre de 1826, y está considerada la iglesia barroca más monumental de la Ribera Baja. Guarda el relicario de la Santa Espina.","en":"Built in the late 17th century on the walls of a former mosque and remodelled in 1863. It has a nave and two aisles, a domed crossing and a tower of 1826, and is considered the most monumental Baroque church in the Ribera Baja. It keeps the reliquary of the Holy Thorn.","fr":"Élevée à la fin du XVIIe siècle sur les murs d'une ancienne mosquée et remaniée en 1863. Elle compte trois nefs, une croisée à coupole et un clocher de 1826, et passe pour l'église baroque la plus monumentale de la Ribera Baja. Elle conserve le reliquaire de la Sainte Épine.","de":"Im späten 17. Jahrhundert auf den Mauern einer ehemaligen Moschee errichtet und 1863 umgebaut. Drei Schiffe, Vierung mit Kuppel und ein Turm von 1826; sie gilt als monumentalste Barockkirche der Ribera Baja. Hier wird das Reliquiar des Heiligen Dorns verwahrt.","pt":"Construída no final do século XVII aproveitando os muros de uma antiga mesquita e reformada em 1863. Tem três naves, cruzeiro com cúpula e uma torre de 1826, e é considerada a igreja barroca mais monumental da Ribera Baja. Guarda o relicário da Santa Espinha."}},{"id":"gelsa-cubiertos","town":"Gelsa","cat":"patrimonio","lat":41.40709,"lon":-0.46143,"src":"https://riberabaja.es/municipios/gelsa","name":{"es":"Barrio morisco y calle de los Cubiertos","en":"Morisco quarter and Calle de los Cubiertos","fr":"Quartier morisque et Calle de los Cubiertos","de":"Moriskenviertel und Calle de los Cubiertos","pt":"Bairro mourisco e Calle de los Cubiertos"},"when":{"es":"Trazado medieval de origen andalusí","en":"Medieval layout of Andalusi origin","fr":"Tracé médiéval d'époque andalusí","de":"Mittelalterlicher Grundriss maurischen Ursprungs","pt":"Traçado medieval de origem andalusina"},"desc":{"es":"Barrio de trazado ovalado y origen andalusí, conocido por sus pasos cubiertos, los «cubiertos», de los que quedan nueve. Es un buen ejemplo de arquitectura popular de tapial y yeso, y se recorre en un paseo corto desde la iglesia.","en":"An oval-shaped quarter of Andalusi origin, known for its covered passages, the “cubiertos”, nine of which survive. It is a fine example of vernacular rammed-earth and gypsum building, and can be explored on a short walk from the church.","fr":"Quartier au tracé ovale d'époque andalusí, connu pour ses passages couverts, les « cubiertos », dont neuf subsistent. C'est un bel exemple d'architecture populaire en pisé et en plâtre, à parcourir en une courte promenade depuis l'église.","de":"Ein ovales Viertel maurischen Ursprungs, bekannt für seine überdachten Durchgänge, die „cubiertos“, von denen neun erhalten sind. Ein schönes Beispiel volkstümlicher Bauweise aus Stampflehm und Gips, ein kurzer Spaziergang von der Kirche aus führt hindurch.","pt":"Bairro de traçado oval e origem andalusina, conhecido pelas suas passagens cobertas, os «cubiertos», das quais restam nove. É um bom exemplo de arquitetura popular de taipa e gesso, e percorre-se num passeio curto a partir da igreja."}},{"id":"gelsa-buensuceso","town":"Gelsa","cat":"patrimonio","lat":41.4112,"lon":-0.4557,"src":"https://www.campaners.com/php/torrepdf.php?numer=9501","name":{"es":"Ermita del Buen Suceso","en":"Chapel of Buen Suceso","fr":"Chapelle du Buen Suceso","de":"Kapelle Buen Suceso","pt":"Ermida do Buen Suceso"},"when":{"es":"Siglo XVIII · reconstruida por los vecinos","en":"18th century · rebuilt by the villagers","fr":"XVIIIe siècle · reconstruit par les habitants","de":"18. Jh. · von den Bewohnern wiederaufgebaut","pt":"Século XVIII · reconstruída pelos moradores"},"desc":{"es":"Ermita del siglo XVIII de ladrillo y tapial, con ábside semicircular y pórtico de tres arcos. Ardió en 1936 y se reconstruyó con donativos de los vecinos. La Virgen del Buen Suceso es la patrona de Gelsa.","en":"An 18th-century chapel of brick and rammed earth, with a semicircular apse and a three-arched porch. It burned in 1936 and was rebuilt with donations from the villagers. Our Lady of Buen Suceso is the patron saint of Gelsa.","fr":"Chapelle du XVIIIe siècle en brique et pisé, avec abside semi-circulaire et porche à trois arcs. Incendiée en 1936, elle a été reconstruite grâce aux dons des habitants. La Vierge du Buen Suceso est la patronne de Gelsa.","de":"Kapelle des 18. Jahrhunderts aus Ziegel und Stampflehm, mit halbrunder Apsis und dreibogiger Vorhalle. Sie brannte 1936 aus und wurde mit Spenden der Bewohner wieder aufgebaut. Die Virgen del Buen Suceso ist die Schutzpatronin von Gelsa.","pt":"Ermida do século XVIII de tijolo e taipa, com abside semicircular e pórtico de três arcos. Ardeu em 1936 e foi reconstruída com donativos dos moradores. A Virgem do Buen Suceso é a padroeira de Gelsa."}},{"id":"gelsa-hidraulico","town":"Gelsa","cat":"hidraulico","lat":41.41904,"lon":-0.4667,"src":"https://www.sipca.es/censo/11-INM-ZAR-018-119-4/Conjunto/hidr%C3%A1ulico.html","name":{"es":"Complejo hidráulico de Gelsa","en":"Gelsa water-mill complex","fr":"Ensemble hydraulique de Gelsa","de":"Wasserbauensemble von Gelsa","pt":"Complexo hidráulico de Gelsa"},"when":{"es":"Documentado en 1381 · azud de 1775–1778","en":"Recorded 1381 · weir of 1775–1778","fr":"Attesté en 1381 · barrage de 1775–1778","de":"Erwähnt 1381 · Wehr von 1775–1778","pt":"Documentado em 1381 · açude de 1775–1778"},"desc":{"es":"Se cita por primera vez en 1381. El azud, reconstruido entre 1775 y 1778 por Agustín Sanz, aprovecha dos mejanas para partir el río. Conserva la caja de tres norias anterior a 1628, la más monumental de la comarca, y una turbina de principios del siglo XX. La harinera cerró en 1989 y desde 1993 funciona una minicentral.","en":"First recorded in 1381. The weir, rebuilt between 1775 and 1778 by Agustín Sanz, uses two river islands to split the Ebro. It keeps a housing for three waterwheels dating from before 1628, the most monumental in the district, and an early 20th-century turbine. The flour mill closed in 1989 and a small hydro plant has run since 1993.","fr":"Mentionné pour la première fois en 1381. Le barrage, reconstruit entre 1775 et 1778 par Agustín Sanz, s'appuie sur deux îles pour partager le fleuve. Il conserve le bâti de trois norias antérieure à 1628, la plus monumentale de la comarque, et une turbine du début du XXe siècle. La minoterie a fermé en 1989 ; une petite centrale fonctionne depuis 1993.","de":"Erstmals 1381 erwähnt. Das Wehr, 1775 bis 1778 von Agustín Sanz neu gebaut, nutzt zwei Flussinseln, um den Ebro zu teilen. Erhalten sind das Gehäuse für drei Wasserräder aus der Zeit vor 1628, das monumentalste der Comarca, und eine Turbine vom Anfang des 20. Jahrhunderts. Die Getreidemühle schloss 1989; seit 1993 läuft ein kleines Wasserkraftwerk.","pt":"Citado pela primeira vez em 1381. O açude, reconstruído entre 1775 e 1778 por Agustín Sanz, aproveita duas ilhas fluviais para dividir o rio. Conserva a caixa de três noras anterior a 1628, a mais monumental da comarca, e uma turbina do início do século XX. A moagem fechou em 1989 e desde 1993 funciona uma minicentral."}},{"id":"gelsa-barca","town":"Gelsa","cat":"naturaleza","lat":41.4272,"lon":-0.46543,"src":"https://riberabaja.es/municipios/gelsa","name":{"es":"Paso de barca y mejanas","en":"Ferry crossing and river islands","fr":"Bac et îles fluviales","de":"Fährstelle und Flussinseln","pt":"Passagem de barca e ilhas fluviais"},"when":{"es":"Barca tradicional del Ebro","en":"Traditional Ebro ferry","fr":"Bac traditionnel de l'Èbre","de":"Traditionelle Ebro-Fähre","pt":"Barca tradicional do Ebro"},"desc":{"es":"Una barca tradicional cruza a las mejanas, las islas que forma el Ebro, donde hay huertas, aves y pequeños mamíferos. Antes de ir, conviene confirmar con el ayuntamiento si está en servicio.","en":"A traditional ferry crosses to the “mejanas”, the islands formed by the Ebro, with market gardens, birds and small mammals. Check with the town hall that it is running before you go.","fr":"Un bac traditionnel traverse vers les « mejanas », les îles formées par l'Èbre, avec potagers, oiseaux et petits mammifères. Avant d'y aller, vérifiez auprès de la mairie qu'il fonctionne.","de":"Eine traditionelle Fähre bringt Besucher zu den „mejanas“, den Inseln im Ebro mit Gärten, Vögeln und kleinen Säugetieren. Ob sie gerade fährt, erfährt man im Rathaus.","pt":"Uma barca tradicional atravessa até às «mejanas», as ilhas que o Ebro forma, com hortas, aves e pequenos mamíferos. Antes de ir, confirme com a câmara municipal se está a funcionar."}},{"id":"celsa","town":"Velilla de Ebro","cat":"arqueologia","lat":41.37234,"lon":-0.43395,"src":"https://pleiades.stoa.org/places/246321","name":{"es":"Colonia Lépida Celsa","en":"Roman colony of Lepida Celsa","fr":"Colonie romaine de Lepida Celsa","de":"Römische Kolonie Lepida Celsa","pt":"Colónia romana de Lepida Celsa"},"when":{"es":"Hacia el 44 a. C. · Bien de Interés Cultural","en":"c. 44 BC · Site of Cultural Interest","fr":"Vers 44 av. J.-C. · Bien d'intérêt culturel","de":"Um 44 v. Chr. · Kulturgut (BIC)","pt":"Cerca de 44 a. C. · Bem de Interesse Cultural"},"desc":{"es":"Primera colonia romana del valle del Ebro, fundada hacia el 44 a. C. por Marco Emilio Lépido sobre la ciudad ibera de Kelse. Tras la caída de Lépido pasó a llamarse Colonia Victrix Iulia Celsa y se abandonó hacia el año 70, cuando creció Caesaraugusta. Se recorren sus calles, el cardo y el decumano, y casas como la de los Delfines. Sus ruinas están protegidas desde 1931.","en":"The first Roman colony in the Ebro valley, founded around 44 BC by Marcus Aemilius Lepidus on the site of the Iberian town of Kelse. After Lepidus fell it was renamed Colonia Victrix Iulia Celsa, and it was abandoned around AD 70 as Caesaraugusta grew. You can walk its streets, the cardo and decumanus, and houses such as the House of the Dolphins. The ruins have been protected since 1931.","fr":"Première colonie romaine de la vallée de l'Èbre, fondée vers 44 av. J.-C. par Lépide (Marcus Aemilius Lepidus) sur le site de la ville ibère de Kelse. Après la chute de Lépide, elle devint Colonia Victrix Iulia Celsa, puis fut abandonnée vers l'an 70, à mesure que Caesaraugusta grandissait. On parcourt ses rues, le cardo et le decumanus, et des maisons comme celle des Dauphins. Les ruines sont protégées depuis 1931.","de":"Die erste römische Kolonie im Ebrotal, um 44 v. Chr. von Marcus Aemilius Lepidus an der Stelle der iberischen Stadt Kelse gegründet. Nach dem Sturz des Lepidus hieß sie Colonia Victrix Iulia Celsa und wurde um 70 n. Chr. aufgegeben, als Caesaraugusta wuchs. Man geht durch ihre Straßen, Cardo und Decumanus, und an Häusern wie dem Haus der Delfine vorbei. Die Ruinen stehen seit 1931 unter Schutz.","pt":"A primeira colónia romana do vale do Ebro, fundada por volta de 44 a. C. por Marco Emílio Lépido sobre a cidade ibera de Kelse. Após a queda de Lépido passou a chamar-se Colonia Victrix Iulia Celsa e foi abandonada por volta do ano 70, quando Caesaraugusta cresceu. Percorrem-se as suas ruas, o cardo e o decúmano, e casas como a dos Golfinhos. As ruínas estão protegidas desde 1931."}},{"id":"celsa-museo","town":"Velilla de Ebro","cat":"museo","lat":41.3733,"lon":-0.4347,"src":"https://www.spain.info/es/lugares-interes/centro-monografico-colonia-celsa/","name":{"es":"Centro Monográfico de Celsa","en":"Celsa Museum Centre","fr":"Centre monographique de Celsa","de":"Museumszentrum Celsa","pt":"Centro Monográfico de Celsa"},"when":{"es":"Abierto en 1997 · Museo de Zaragoza","en":"Opened 1997 · Museum of Zaragoza","fr":"Ouvert en 1997 · musée de Saragosse","de":"Eröffnet 1997 · Museum Zaragoza","pt":"Aberto em 1997 · Museu de Saragoça"},"desc":{"es":"Sección del Museo de Zaragoza abierta en 1997 junto al yacimiento. Expone lo que han sacado a la luz las excavaciones de Celsa y ayuda a imaginar la vida diaria de la colonia antes de salir a recorrer sus calles.","en":"A branch of the Museum of Zaragoza, opened in 1997 next to the site. It shows what the excavations at Celsa have uncovered and helps you picture daily life in the colony before walking its streets.","fr":"Antenne du musée de Saragosse ouverte en 1997 à côté du site. Elle présente les découvertes des fouilles de Celsa et aide à imaginer la vie quotidienne de la colonie avant d'en parcourir les rues.","de":"Eine Außenstelle des Museums Zaragoza, 1997 neben der Ausgrabungsstätte eröffnet. Sie zeigt die Funde aus Celsa und vermittelt ein Bild vom Alltag der Kolonie, bevor man durch ihre Straßen geht.","pt":"Secção do Museu de Saragoça aberta em 1997 junto ao sítio arqueológico. Mostra o que as escavações de Celsa revelaram e ajuda a imaginar a vida quotidiana da colónia antes de percorrer as suas ruas."}},{"id":"velilla-sannicolas","town":"Velilla de Ebro","cat":"patrimonio","lat":41.37426,"lon":-0.43658,"src":"https://www.campaners.com/php/torrepdf.php?numer=681","name":{"es":"Ermita de San Nicolás de Bari","en":"Chapel of St Nicholas of Bari","fr":"Chapelle Saint-Nicolas-de-Bari","de":"Kapelle San Nicolás de Bari","pt":"Ermida de São Nicolau de Bari"},"when":{"es":"Siglo XIII · románico y barroco","en":"13th century · Romanesque and Baroque","fr":"XIIIe siècle · roman et baroque","de":"13. Jh. · Romanik und Barock","pt":"Século XIII · românico e barroco"},"desc":{"es":"Conserva el ábside y la cripta de una iglesia románica del siglo XIII; la nave se rehízo en estilo barroco entre 1679 y 1713. Su campana de las horas es gótica, de 1497. Desde la ermita se dominan el valle y el yacimiento de Celsa.","en":"It keeps the apse and crypt of a 13th-century Romanesque church; the nave was rebuilt in Baroque style between 1679 and 1713. Its clock bell is Gothic, cast in 1497. From the chapel you look over the valley and the site of Celsa.","fr":"Elle conserve l'abside et la crypte d'une église romane du XIIIe siècle ; la nef a été refaite en style baroque entre 1679 et 1713. Sa cloche des heures est gothique, datée de 1497. Depuis la chapelle, on domine la vallée et le site de Celsa.","de":"Erhalten sind Apsis und Krypta einer romanischen Kirche des 13. Jahrhunderts; das Schiff wurde 1679 bis 1713 barock neu errichtet. Die Stundenglocke ist gotisch und stammt von 1497. Von hier überblickt man das Tal und die Ausgrabung von Celsa.","pt":"Conserva a abside e a cripta de uma igreja românica do século XIII; a nave foi refeita em estilo barroco entre 1679 e 1713. O sino das horas é gótico, de 1497. Da ermida avistam-se o vale e o sítio de Celsa."}},{"id":"velilla-asuncion","town":"Velilla de Ebro","cat":"patrimonio","lat":41.3737,"lon":-0.43733,"src":"https://campaners.com/php/torrepdf.php?numer=9450","name":{"es":"Iglesia de la Asunción de Velilla","en":"Church of the Assumption, Velilla","fr":"Église de l'Assomption de Velilla","de":"Mariä-Himmelfahrt-Kirche, Velilla","pt":"Igreja da Assunção de Velilla"},"when":{"es":"Siglo XVI · renacentista y mudéjar","en":"16th century · Renaissance and Mudéjar","fr":"XVIe siècle · Renaissance et mudéjar","de":"16. Jh. · Renaissance und Mudéjar","pt":"Século XVI · renascentista e mudéjar"},"desc":{"es":"Templo del siglo XVI de ladrillo sobre zócalo de sillar, que mezcla rasgos renacentistas y mudéjares. Tiene bóvedas estrelladas; el cuerpo octogonal y el chapitel de la torre son de 1679. Está catalogado como Monumento de Interés Local.","en":"A 16th-century brick church on an ashlar base, mixing Renaissance and Mudéjar features. It has star vaults; the octagonal stage and spire of the tower date from 1679. It is listed as a Monument of Local Interest.","fr":"Église du XVIe siècle en brique sur un soubassement en pierre de taille, mêlant traits Renaissance et mudéjars. Elle a des voûtes étoilées ; le corps octogonal et la flèche du clocher datent de 1679. Elle est classée monument d'intérêt local.","de":"Backsteinkirche des 16. Jahrhunderts auf Quadersockel, mit Zügen von Renaissance und Mudéjar. Sie hat Sterngewölbe; das achteckige Geschoss und der Turmhelm stammen von 1679. Sie ist als Denkmal von lokalem Interesse eingetragen.","pt":"Igreja do século XVI em tijolo sobre embasamento de cantaria, que mistura traços renascentistas e mudéjares. Tem abóbadas estreladas; o corpo octogonal e o coruchéu da torre são de 1679. Está classificada como Monumento de Interesse Local."}},{"id":"zaida-sanjose","town":"La Zaida","cat":"patrimonio","lat":41.32878,"lon":-0.42757,"src":"https://campaners.com/php/torrepdf.php?numer=802","name":{"es":"Iglesia de San José","en":"Church of St Joseph","fr":"Église Saint-Joseph","de":"Kirche San José","pt":"Igreja de São José"},"when":{"es":"Siglo XVII · torre reconstruida en 1997–1999","en":"17th century · tower rebuilt 1997–1999","fr":"XVIIe siècle · clocher reconstruit en 1997–1999","de":"17. Jh. · Turm 1997–1999 wiederaufgebaut","pt":"Século XVII · torre reconstruída em 1997–1999"},"desc":{"es":"Iglesia de una nave, probablemente de la segunda mitad del siglo XVII. Junto a la portada luce un escudo atribuido a los duques de Villahermosa. El segundo cuerpo de la torre se perdió en la Guerra Civil y se reconstruyó entre 1997 y 1999.","en":"A single-nave church, probably from the second half of the 17th century. Beside the doorway is a coat of arms attributed to the Dukes of Villahermosa. The tower's upper stage was lost in the Civil War and rebuilt between 1997 and 1999.","fr":"Église à nef unique, probablement de la seconde moitié du XVIIe siècle. À côté du portail, un blason attribué aux ducs de Villahermosa. L'étage supérieur du clocher, détruit pendant la guerre civile, a été reconstruit entre 1997 et 1999.","de":"Einschiffige Kirche, vermutlich aus der zweiten Hälfte des 17. Jahrhunderts. Neben dem Portal ein Wappen, das den Herzögen von Villahermosa zugeschrieben wird. Das obere Turmgeschoss ging im Bürgerkrieg verloren und wurde 1997 bis 1999 wieder aufgebaut.","pt":"Igreja de nave única, provavelmente da segunda metade do século XVII. Junto ao portal tem um brasão atribuído aos duques de Villahermosa. O corpo superior da torre perdeu-se na Guerra Civil e foi reconstruído entre 1997 e 1999."}},{"id":"alforque-sanpedro","town":"Alforque","cat":"patrimonio","lat":41.32802,"lon":-0.38583,"src":"https://www.campaners.com/php/torrepdf.php?numer=9526","name":{"es":"Iglesia de San Pedro Apóstol","en":"Church of St Peter the Apostle","fr":"Église Saint-Pierre-Apôtre","de":"Kirche San Pedro Apóstol","pt":"Igreja de São Pedro Apóstolo"},"when":{"es":"Bóvedas estrelladas · inscripciones de 1658, 1694 y 1891","en":"Star vaults · inscriptions of 1658, 1694 and 1891","fr":"Voûtes étoilées · inscriptions de 1658, 1694 et 1891","de":"Sterngewölbe · Inschriften von 1658, 1694 und 1891","pt":"Abóbadas estreladas · inscrições de 1658, 1694 e 1891"},"desc":{"es":"Iglesia de una nave con bóvedas estrelladas y ábside poligonal, hermana de la de Velilla. La curiosidad está en su portada: las dovelas guardan inscripciones que registran los años en que el Ebro se heló, en 1658, 1694 y 1891.","en":"A single-nave church with star vaults and a polygonal apse, a sister to the one in Velilla. The curiosity is its doorway: the voussoirs carry inscriptions recording the years the Ebro froze over, in 1658, 1694 and 1891.","fr":"Église à nef unique avec voûtes étoilées et abside polygonale, sœur de celle de Velilla. Sa curiosité est le portail : les claveaux portent des inscriptions qui rappellent les années où l'Èbre a gelé, en 1658, 1694 et 1891.","de":"Einschiffige Kirche mit Sterngewölben und polygonaler Apsis, eine Schwester der Kirche von Velilla. Besonders ist ihr Portal: Die Keilsteine tragen Inschriften über die Jahre, in denen der Ebro zufror, 1658, 1694 und 1891.","pt":"Igreja de nave única com abóbadas estreladas e abside poligonal, irmã da de Velilla. A curiosidade está no portal: as aduelas guardam inscrições que registam os anos em que o Ebro gelou, em 1658, 1694 e 1891."}},{"id":"cincoolivas-santiago","town":"Cinco Olivas","cat":"patrimonio","lat":41.34051,"lon":-0.37204,"src":"https://www.campaners.com/php/torrepdf.php?numer=9646","name":{"es":"Iglesia de Santiago","en":"Church of St James","fr":"Église Saint-Jacques","de":"Kirche Santiago","pt":"Igreja de Santiago"},"when":{"es":"Siglo XVII · remate de la torre del XVIII","en":"17th century · 18th-century tower top","fr":"XVIIe siècle · couronnement du clocher du XVIIIe","de":"17. Jh. · Turmabschluss 18. Jh.","pt":"Século XVII · remate da torre do XVIII"},"desc":{"es":"Iglesia de cruz latina con capillas laterales, probablemente de la segunda mitad del siglo XVII. Está hecha de mampostería con verdugadas de ladrillo, y el remate de la torre se añadió hacia mediados del XVIII.","en":"A Latin-cross church with side chapels, probably from the second half of the 17th century. It is built of rubble stone with courses of brick, and the top of the tower was added around the mid-18th century.","fr":"Église en croix latine avec chapelles latérales, probablement de la seconde moitié du XVIIe siècle. Elle est bâtie en moellons avec des assises de brique, et le couronnement du clocher a été ajouté vers le milieu du XVIIIe siècle.","de":"Kirche über lateinischem Kreuz mit Seitenkapellen, vermutlich aus der zweiten Hälfte des 17. Jahrhunderts. Gebaut aus Bruchstein mit Ziegelbändern; der Turmabschluss kam um die Mitte des 18. Jahrhunderts hinzu.","pt":"Igreja em cruz latina com capelas laterais, provavelmente da segunda metade do século XVII. É de alvenaria com fiadas de tijolo, e o remate da torre foi acrescentado por meados do século XVIII."}},{"id":"sastago-fortin","town":"Sástago","cat":"patrimonio","lat":41.32626,"lon":-0.37332,"src":"https://www.mapa.gob.es/en/desarrollo-rural/temas/caminos-naturales/caminos-naturales/sector-noreste/ebro/etapa29/default.aspx","name":{"es":"Fortín de Sástago y azud de Cinco Olivas","en":"Sástago fort and Cinco Olivas weir","fr":"Fortin de Sástago et barrage de Cinco Olivas","de":"Fort von Sástago und Wehr von Cinco Olivas","pt":"Fortim de Sástago e açude de Cinco Olivas"},"when":{"es":"Siglo XIX · Tercera Guerra Carlista","en":"19th century · Third Carlist War","fr":"XIXe siècle · troisième guerre carliste","de":"19. Jh. · Dritter Karlistenkrieg","pt":"Século XIX · Terceira Guerra Carlista"},"desc":{"es":"Recinto pentagonal con foso y torre de telegrafía óptica levantado durante la Tercera Guerra Carlista. Formaba parte de la línea de torres que comunicaba Zaragoza con Amposta. Se asoma al azud de Cinco Olivas, que hoy alimenta una pequeña central eléctrica.","en":"A pentagonal enclosure with a moat and an optical telegraph tower, built during the Third Carlist War. It was part of the chain of towers linking Zaragoza with Amposta. It overlooks the Cinco Olivas weir, which now feeds a small hydroelectric plant.","fr":"Enceinte pentagonale avec fossé et tour de télégraphe optique, construite pendant la troisième guerre carliste. Elle faisait partie de la ligne de tours reliant Saragosse à Amposta. Elle surplombe le barrage de Cinco Olivas, qui alimente aujourd'hui une petite centrale électrique.","de":"Fünfeckige Anlage mit Graben und optischem Telegrafenturm, errichtet im Dritten Karlistenkrieg. Sie gehörte zur Turmkette zwischen Zaragoza und Amposta. Sie liegt über dem Wehr von Cinco Olivas, das heute ein kleines Wasserkraftwerk speist.","pt":"Recinto pentagonal com fosso e torre de telegrafia ótica, construído durante a Terceira Guerra Carlista. Fazia parte da linha de torres que ligava Saragoça a Amposta. Debruça-se sobre o açude de Cinco Olivas, que hoje alimenta uma pequena central elétrica."}},{"id":"alborge-sanlorenzo","town":"Alborge","cat":"patrimonio","lat":41.33487,"lon":-0.35858,"src":"https://campaners.com/php/torrepdf.php?numer=9513","name":{"es":"Iglesia de San Lorenzo Mártir","en":"Church of St Lawrence","fr":"Église Saint-Laurent","de":"Kirche San Lorenzo","pt":"Igreja de São Lourenço"},"when":{"es":"Cúpula con yeserías de influencia del XVIII zaragozano","en":"Dome with stucco work in 18th-century Zaragoza style","fr":"Coupole aux stucs d'influence saragossaine du XVIIIe","de":"Kuppel mit Stuck im Zaragozaner Stil des 18. Jh.","pt":"Cúpula com estuques de influência saragoçana do século XVIII"},"desc":{"es":"Iglesia de cruz latina y una sola nave. Lo que más llama la atención está arriba: la cúpula octogonal tiene relieves de yeso de los cuatro evangelistas, con la influencia del barroco zaragozano del siglo XVIII.","en":"A single-nave church on a Latin-cross plan. The thing to look up at is the octagonal dome, with plaster reliefs of the four Evangelists showing the influence of 18th-century Zaragoza Baroque.","fr":"Église à nef unique en croix latine. Il faut lever les yeux vers la coupole octogonale, ornée de reliefs en plâtre des quatre évangélistes, sous l'influence du baroque saragossain du XVIIIe siècle.","de":"Einschiffige Kirche über lateinischem Kreuz. Der Blick geht nach oben zur achteckigen Kuppel mit Gipsreliefs der vier Evangelisten im Stil des Zaragozaner Barocks des 18. Jahrhunderts.","pt":"Igreja de nave única em cruz latina. O que mais chama a atenção está no alto: a cúpula octogonal tem relevos em gesso dos quatro evangelistas, com influência do barroco saragoçano do século XVIII."}},{"id":"montler","town":"Sástago","cat":"camino","lat":41.3424,"lon":-0.33059,"src":"https://campaners.com/php/torrepdf.php?numer=9733","name":{"es":"Ermita de Nuestra Señora de Montler","en":"Chapel of Our Lady of Montler","fr":"Chapelle Notre-Dame de Montler","de":"Kapelle Nuestra Señora de Montler","pt":"Ermida de Nossa Senhora de Montler"},"when":{"es":"Origen medieval · edificio del siglo XVIII","en":"Medieval origin · 18th-century building","fr":"Origine médiévale · édifice du XVIIIe siècle","de":"Mittelalterlicher Ursprung · Bau des 18. Jh.","pt":"Origem medieval · edifício do século XVIII"},"desc":{"es":"La ermita se donó en 1292 al Monasterio de Rueda, que la tuvo hasta 1836; el edificio actual es del siglo XVIII. Desde su cornisa se ven los meandros del Ebro y por su lado pasa el Camino Jacobeo del Ebro, entre Alborge y Sástago.","en":"In 1292 it was given to the Monastery of Rueda, which held it until 1836; the present building is 18th-century. From its ridge you can see the meanders of the Ebro, and the Ebro Way of St James passes alongside, between Alborge and Sástago.","fr":"Donnée en 1292 au monastère de Rueda, qui la garda jusqu'en 1836 ; l'édifice actuel date du XVIIIe siècle. De sa crête, on voit les méandres de l'Èbre, et le Chemin de Saint-Jacques de l'Èbre passe à côté, entre Alborge et Sástago.","de":"1292 dem Kloster Rueda geschenkt, das sie bis 1836 besaß; das heutige Gebäude stammt aus dem 18. Jahrhundert. Vom Kamm aus sieht man die Ebroschleifen, und der Jakobsweg am Ebro führt hier zwischen Alborge und Sástago vorbei.","pt":"Doada em 1292 ao Mosteiro de Rueda, que a teve até 1836; o edifício atual é do século XVIII. Do alto da escarpa veem-se os meandros do Ebro, e por ali passa o Caminho de Santiago do Ebro, entre Alborge e Sástago."}},{"id":"sastago-meandros","town":"Sástago","cat":"naturaleza","lat":41.3201,"lon":-0.33317,"src":"https://sastago.es/municipio/turismo/","name":{"es":"Mirador de los meandros","en":"Meanders viewpoint","fr":"Belvédère des méandres","de":"Aussichtspunkt über die Ebroschleifen","pt":"Miradouro dos meandros"},"when":{"es":"Paisaje del Ebro y la estepa","en":"Ebro and steppe landscape","fr":"Paysage de l'Èbre et de la steppe","de":"Landschaft aus Ebro und Steppe","pt":"Paisagem do Ebro e da estepe"},"desc":{"es":"Vista de las curvas que dibuja el Ebro junto a Sástago. Es uno de los contrastes más fuertes de la comarca: a pocos metros de la vega verde del río empieza la estepa.","en":"A view of the curves the Ebro draws beside Sástago. It is one of the starkest contrasts in the district: a few metres from the river's green floodplain, the steppe begins.","fr":"Vue sur les courbes que dessine l'Èbre près de Sástago. C'est l'un des contrastes les plus forts de la comarque : à quelques mètres de la plaine verte du fleuve commence la steppe.","de":"Blick auf die Schleifen, die der Ebro bei Sástago zieht. Einer der stärksten Kontraste der Comarca: Wenige Meter hinter der grünen Flussaue beginnt die Steppe.","pt":"Vista das curvas que o Ebro desenha junto a Sástago. É um dos contrastes mais fortes da comarca: a poucos metros da várzea verde do rio começa a estepe."}},{"id":"sastago-tambor","town":"Sástago","cat":"patrimonio","lat":41.31861,"lon":-0.34009,"src":"https://sastago.es/municipio/turismo/","name":{"es":"Torre del Tambor","en":"Torre del Tambor watchtower","fr":"Torre del Tambor","de":"Wachturm Torre del Tambor","pt":"Torre del Tambor"},"when":{"es":"Siglo XIX · restaurada en 1998","en":"19th century · restored 1998","fr":"XIXe siècle · restaurée en 1998","de":"19. Jh. · 1998 restauriert","pt":"Século XIX · restaurada em 1998"},"desc":{"es":"Torre vigía circular del siglo XIX, de dos plantas y 18 aspilleras, encaramada a un escarpe rocoso de la orilla derecha junto al puente. Vigilaba el paso del río y se restauró en 1998.","en":"A round 19th-century watchtower with two floors and 18 loopholes, perched on a rocky scarp on the right bank by the bridge. It guarded the river crossing and was restored in 1998.","fr":"Tour de guet circulaire du XIXe siècle, à deux niveaux et 18 meurtrières, perchée sur un escarpement rocheux de la rive droite près du pont. Elle surveillait le passage du fleuve et a été restaurée en 1998.","de":"Runder Wachturm aus dem 19. Jahrhundert mit zwei Geschossen und 18 Schießscharten, auf einem Felsabsatz am rechten Ufer neben der Brücke. Er bewachte den Flussübergang und wurde 1998 restauriert.","pt":"Torre de vigia circular do século XIX, com dois pisos e 18 seteiras, empoleirada numa escarpa rochosa da margem direita junto à ponte. Vigiava a passagem do rio e foi restaurada em 1998."}},{"id":"sastago-pilar","town":"Sástago","cat":"patrimonio","lat":41.3234,"lon":-0.3456,"src":"https://sastago.es/municipio/turismo/","name":{"es":"Iglesia de Nuestra Señora del Pilar","en":"Church of Our Lady of the Pillar","fr":"Église Notre-Dame-du-Pilar","de":"Kirche Nuestra Señora del Pilar","pt":"Igreja de Nossa Senhora do Pilar"},"when":{"es":"Barroca · terminada en 1689","en":"Baroque · completed 1689","fr":"Baroque · achevée en 1689","de":"Barock · 1689 vollendet","pt":"Barroca · concluída em 1689"},"desc":{"es":"Iglesia barroca del siglo XVII levantada sobre un templo anterior y terminada en 1689. Tiene una nave de tres tramos y torre de tres cuerpos, y sufrió daños importantes en la Guerra Civil.","en":"A 17th-century Baroque church built over an earlier one and completed in 1689. It has a three-bay nave and a three-stage tower, and was badly damaged in the Civil War.","fr":"Église baroque du XVIIe siècle élevée sur une église antérieure et achevée en 1689. Elle a une nef à trois travées et un clocher à trois niveaux, et a subi d'importants dégâts pendant la guerre civile.","de":"Barockkirche des 17. Jahrhunderts über einem Vorgängerbau, 1689 vollendet. Dreijochiges Schiff und dreigeschossiger Turm; im Bürgerkrieg schwer beschädigt.","pt":"Igreja barroca do século XVII erguida sobre um templo anterior e concluída em 1689. Tem uma nave de três tramos e torre de três corpos, e sofreu danos importantes na Guerra Civil."}},{"id":"rueda","town":"Sástago","cat":"patrimonio","lat":41.29737,"lon":-0.314,"src":"https://www.turismodearagon.com/ficha/real-monasterio-de-nuestra-senora-de-rueda-sastago/","name":{"es":"Real Monasterio de Nuestra Señora de Rueda","en":"Royal Monastery of Our Lady of Rueda","fr":"Monastère royal Notre-Dame de Rueda","de":"Königliches Kloster Nuestra Señora de Rueda","pt":"Real Mosteiro de Nossa Senhora de Rueda"},"when":{"es":"1202–1238 · cisterciense · Monumento Nacional desde 1924","en":"1202–1238 · Cistercian · National Monument since 1924","fr":"1202–1238 · cistercien · monument national depuis 1924","de":"1202–1238 · Zisterzienser · Nationaldenkmal seit 1924","pt":"1202–1238 · cisterciense · Monumento Nacional desde 1924"},"desc":{"es":"En 1182 Alfonso II cedió Escatrón al Císter; las obras empezaron en 1202 y la iglesia se consagró en 1238. Es una de las grandes abadías cistercienses de Aragón, con una torre mudéjar del siglo XIV, y es Monumento Nacional desde 1924. El Gobierno de Aragón lo restauró y lo habilitó como hospedería.","en":"In 1182 Alfonso II gave Escatrón to the Cistercians; building began in 1202 and the church was consecrated in 1238. It is one of the great Cistercian abbeys of Aragón, with a 14th-century Mudéjar tower, and has been a National Monument since 1924. The Government of Aragón restored it and fitted it out as a guesthouse.","fr":"En 1182, Alphonse II céda Escatrón aux cisterciens ; les travaux commencèrent en 1202 et l'église fut consacrée en 1238. C'est l'une des grandes abbayes cisterciennes d'Aragon, avec une tour mudéjare du XIVe siècle, monument national depuis 1924. Le gouvernement d'Aragon l'a restauré et aménagé en hôtellerie.","de":"1182 überließ Alfons II. Escatrón den Zisterziensern; der Bau begann 1202, die Kirche wurde 1238 geweiht. Es ist eine der großen Zisterzienserabteien Aragoniens mit einem Mudéjar-Turm aus dem 14. Jahrhundert und seit 1924 Nationaldenkmal. Die Regierung Aragoniens hat es restauriert und als Gästehaus eingerichtet.","pt":"Em 1182 Afonso II cedeu Escatrón à Ordem de Cister; as obras começaram em 1202 e a igreja foi consagrada em 1238. É uma das grandes abadias cistercienses de Aragão, com uma torre mudéjar do século XIV, e é Monumento Nacional desde 1924. O Governo de Aragão restaurou-o e adaptou-o a hospedaria."}},{"id":"rueda-noria","town":"Sástago","cat":"hidraulico","lat":41.2969,"lon":-0.3147,"src":"https://www.turismodearagon.com/ficha/real-monasterio-de-nuestra-senora-de-rueda-sastago/","name":{"es":"Noria y azud de Rueda","en":"Rueda waterwheel and weir","fr":"Noria et barrage de Rueda","de":"Wasserrad und Wehr von Rueda","pt":"Nora e açude de Rueda"},"when":{"es":"Ingeniería monástica · noria de 18 m","en":"Monastic engineering · 18 m wheel","fr":"Ingénierie monastique · roue de 18 m","de":"Klosterbaukunst · 18-m-Rad","pt":"Engenharia monástica · nora de 18 m"},"desc":{"es":"Los monjes cerraron el Ebro con un azud y levantaron una noria de 18 metros de diámetro, la «rueda» que da nombre al monasterio. Subía el agua a un acueducto gótico que la repartía por todo el conjunto. Al lado se conserva un molino harinero.","en":"The monks built a weir across the Ebro and raised a waterwheel 18 metres across, the “rueda” that gives the monastery its name. It lifted water to a Gothic aqueduct that carried it through the whole complex. A flour mill survives beside it.","fr":"Les moines barrèrent l'Èbre d'un barrage et élevèrent une noria de 18 mètres de diamètre, la « rueda » qui donne son nom au monastère. Elle montait l'eau jusqu'à un aqueduc gothique qui la distribuait dans tout l'ensemble. Un moulin à farine est conservé à côté.","de":"Die Mönche bauten ein Wehr in den Ebro und ein Wasserrad von 18 Metern Durchmesser, die „rueda“, die dem Kloster den Namen gibt. Es hob das Wasser in einen gotischen Aquädukt, der die ganze Anlage versorgte. Daneben ist eine Getreidemühle erhalten.","pt":"Os monges fecharam o Ebro com um açude e ergueram uma nora de 18 metros de diâmetro, a «rueda» que dá nome ao mosteiro. Elevava a água até um aqueduto gótico que a distribuía por todo o conjunto. Ao lado conserva-se um moinho de farinha."}},{"id":"escatron-tozal","town":"Escatrón","cat":"naturaleza","lat":41.29267,"lon":-0.32102,"src":"https://www.komoot.com/highlight/5818612","name":{"es":"Mirador de El Tozal","en":"El Tozal viewpoint","fr":"Belvédère d'El Tozal","de":"Aussichtspunkt El Tozal","pt":"Miradouro de El Tozal"},"when":{"es":"Vista del Ebro y de Rueda","en":"View of the Ebro and Rueda","fr":"Vue sur l'Èbre et Rueda","de":"Blick auf Ebro und Rueda","pt":"Vista do Ebro e de Rueda"},"desc":{"es":"Balcón sobre el Ebro desde el que se ve el Monasterio de Rueda en la orilla de enfrente. Es uno de los mejores puntos para fotografiar juntos el monasterio y el río.","en":"A balcony over the Ebro with the Monastery of Rueda on the opposite bank. It is one of the best spots to photograph the monastery and the river together.","fr":"Un balcon sur l'Èbre avec, en face, le monastère de Rueda. C'est l'un des meilleurs endroits pour photographier ensemble le monastère et le fleuve.","de":"Ein Balkon über dem Ebro mit dem Kloster Rueda am gegenüberliegenden Ufer. Einer der besten Plätze für ein Foto von Kloster und Fluss zusammen.","pt":"Uma varanda sobre o Ebro com o Mosteiro de Rueda na margem oposta. É um dos melhores sítios para fotografar o mosteiro e o rio juntos."}},{"id":"escatron-asuncion","town":"Escatrón","cat":"patrimonio","lat":41.29263,"lon":-0.32493,"src":"https://campaners.com/php/torrepdf.php?numer=9731","name":{"es":"Iglesia de la Asunción de Escatrón","en":"Church of the Assumption, Escatrón","fr":"Église de l'Assomption d'Escatrón","de":"Mariä-Himmelfahrt-Kirche, Escatrón","pt":"Igreja da Assunção de Escatrón"},"when":{"es":"Barroca · retablo de alabastro del siglo XVI","en":"Baroque · 16th-century alabaster altarpiece","fr":"Baroque · retable d'albâtre du XVIe siècle","de":"Barock · Alabasteraltar des 16. Jh.","pt":"Barroca · retábulo de alabastro do século XVI"},"desc":{"es":"Iglesia barroca de planta jesuítica, rehecha en la segunda mitad del siglo XVII; conserva tres capillas renacentistas del templo anterior. En el ábside está un retablo de alabastro del siglo XVI que procede del Monasterio de Rueda.","en":"A Baroque church on a Jesuit-style plan, rebuilt in the second half of the 17th century; it keeps three Renaissance chapels from the earlier church. In the apse stands a 16th-century alabaster altarpiece brought from the Monastery of Rueda.","fr":"Église baroque de plan jésuite, refaite dans la seconde moitié du XVIIe siècle ; elle conserve trois chapelles Renaissance de l'église antérieure. Dans l'abside, un retable d'albâtre du XVIe siècle provenant du monastère de Rueda.","de":"Barockkirche mit jesuitischem Grundriss, in der zweiten Hälfte des 17. Jahrhunderts neu gebaut; drei Renaissancekapellen des Vorgängerbaus sind erhalten. In der Apsis steht ein Alabasteraltar des 16. Jahrhunderts aus dem Kloster Rueda.","pt":"Igreja barroca de planta jesuítica, refeita na segunda metade do século XVII; conserva três capelas renascentistas do templo anterior. Na abside está um retábulo de alabastro do século XVI vindo do Mosteiro de Rueda."}},{"id":"escatron-sfjavier","town":"Escatrón","cat":"patrimonio","lat":41.28985,"lon":-0.32301,"src":"https://www.campaners.com/php/torrepdf.php?numer=9786","name":{"es":"Ruinas de San Francisco Javier","en":"Ruins of St Francis Xavier","fr":"Ruines de Saint-François-Xavier","de":"Ruine San Francisco Javier","pt":"Ruínas de São Francisco Xavier"},"when":{"es":"Siglos XVII–XVIII · antiguo colegio jesuita","en":"17th–18th centuries · former Jesuit college","fr":"XVIIe–XVIIIe siècles · ancien collège jésuite","de":"17.–18. Jh. · ehemaliges Jesuitenkolleg","pt":"Séculos XVII–XVIII · antigo colégio jesuíta"},"desc":{"es":"Restos de la iglesia del antiguo colegio jesuita, de finales del siglo XVII o comienzos del XVIII. Su fachada de dos torres gemelas con cuerpo octogonal sigue en pie y es una de las siluetas más reconocibles de Escatrón.","en":"The remains of the church of the former Jesuit college, from the late 17th or early 18th century. Its façade with twin octagonal towers still stands and is one of Escatrón's landmarks.","fr":"Vestiges de l'église de l'ancien collège jésuite, de la fin du XVIIe ou du début du XVIIIe siècle. Sa façade à deux tours jumelles octogonales est toujours debout et compte parmi les silhouettes les plus reconnaissables d'Escatrón.","de":"Reste der Kirche des ehemaligen Jesuitenkollegs aus dem späten 17. oder frühen 18. Jahrhundert. Die Fassade mit zwei achteckigen Zwillingstürmen steht noch und ist ein Wahrzeichen von Escatrón.","pt":"Restos da igreja do antigo colégio jesuíta, do final do século XVII ou início do XVIII. A fachada de duas torres gémeas octogonais continua de pé e é uma das silhuetas mais reconhecíveis de Escatrón."}},{"id":"saladas","town":"Sástago","cat":"naturaleza","lat":41.39389,"lon":-0.21306,"src":"https://rsis.ramsar.org/es/ris/2038","name":{"es":"Saladas de Sástago-Bujaraloz","en":"Sástago-Bujaraloz salt lakes","fr":"Lagunes salées de Sástago-Bujaraloz","de":"Salzlagunen von Sástago-Bujaraloz","pt":"Lagoas salgadas de Sástago-Bujaraloz"},"when":{"es":"Humedal Ramsar desde 2011","en":"Ramsar wetland since 2011","fr":"Zone humide Ramsar depuis 2011","de":"Ramsar-Feuchtgebiet seit 2011","pt":"Zona húmida Ramsar desde 2011"},"desc":{"es":"Conjunto de 26 lagunas saladas estacionales en plena estepa, declarado humedal de importancia internacional (Ramsar) en 2011. Alberga crustáceos que solo viven aquí y aves esteparias como la ganga, la ortega o la alondra ricotí, y conserva restos de anti /* ---------- distance ---------- */
function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

let toastT;function toast(msg){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2600);}

// basemaps (only used where the hosting allows external map tiles)
const TILES={
  mapa:{url:"https://www.ign.es/wmts/ign-base?layer=IGNBaseTodo&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix={z}&TileCol={x}&TileRow={y}",opt:{maxZoom:18,attribution:'Mapa base © <a href="https://www.ign.es">IGN</a>'}},
  ortofoto:{url:"https://www.ign.es/wmts/pnoa-ma?layer=OI.OrthoimageCoverage&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/jpeg&TileMatrix={z}&TileCol={x}&TileRow={y}",opt:{maxZoom:19,attribution:'PNOA © <a href="https://www.ign.es">IGN</a>'}}
};
let tileLayer=null;
function setBasemap(k,silent){
  state.basemap=k; $$(".layerbox button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===k)));
  if(tileLayer){map.removeLayer(tileLayer);tileLayer=null;}
  $("#map").classList.remove("tiles-on");
  if(k==="ilustrado"){map.setMaxZoom(15);return;}
  map.setMaxZoom(18);
  const def=TILES[k]; let ok=0,bad=0,decided=false;
  tileLayer=L.tileLayer(def.url,def.opt);
  tileLayer.on("tileload",()=>{ok++; if(!decided){decided=true;$("#map").classList.add("tiles-on");}});
  tileLayer.on("tileerror",()=>{bad++; if(!decided&&bad>=3){decided=true;map.removeLayer(tileLayer);tileLayer=null;state.basemap="ilustrado";map.setMaxZoom(15);$("#map").classList.remove("tiles-on");$$(".layerbox button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k==="ilustrado")));if(!silent) toast(t("tilesBlocked"));}});
  tileLayer.addTo(map); tileLayer.bringToBack();
}

/* markers */
const markers={};
function pinIcon(p){return L.divIcon({className:"",html:`<div class="pin" style="--c:var(${CATS[p.cat].color})">${ICON(p.cat)}</div>`,iconSize:[30,30],iconAnchor:[4,30],popupAnchor:[11,-30]});}
function addMarker(p){
  const m=L.marker([p.lat,p.lon],{keyboard:true,title:L10(p.name),riseOnHover:true,icon:pinIcon(p)});
  m.on("click",()=>{if(state.adding){map.fire("click",{latlng:m.getLatLng()});return;} openPlace(p.id,{fly:false});});
  m.addTo(map); markers[p.id]=m;
}
POIS.forEach(addMarker);
function pinEl(id){const m=markers[id];return m&&m.getElement()?m.getElement().querySelector(".pin"):null;}
function visible(p){
  if(!state.cats.has(p.cat)) return false;
  if(state.town&&p.town!==state.town) return false;
  if(state.q){const q=norm(state.q);const hay=norm(L10(p.name)+" "+p.town+" "+L10(p.desc)+" "+t("cat_"+p.cat));if(!hay.includes(q)) return false;}
  return true;
}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function refreshMarkers(){
  const inRoute=state.route?new Set(DATA.routes.find(r=>r.id===state.route).stops):null;
  POIS.forEach(p=>{const m=markers[p.id];const show=inRoute?inRoute.has(p.id):visible(p);
    if(show&&!map.hasLayer(m)) m.addTo(map); if(!show&&map.hasLayer(m)) map.removeLayer(m);
    const el=pinEl(p.id); if(el) el.classList.toggle("sel",state.sel===p.id);});
  Object.entries(muniLayers).forEach(([n,l])=>{const el=l.getElement&&l.getElement();if(el) el.classList.toggle("hl",state.town===n);});
}

/* ---------- route drawing ---------- */
let routeGroup=L.layerGroup().addTo(map);
function drawRoute(r){
  routeGroup.clearLayers(); if(!r) return;
  const pts=r.stops.map(id=>BYID[id]).map(p=>[p.lat,p.lon]);
  const color=`var(${CATS[r.cat].color})`;
  const line=L.polyline(pts,{pane:"routes",className:"route-line",interactive:false});
  routeGroup.addLayer(line);
  setTimeout(()=>{const el=line.getElement();if(el) el.style.setProperty("--c",color);},0);
  r.stops.forEach((id,i)=>{const p=BYID[id];routeGroup.addLayer(L.marker([p.lat,p.lon],{pane:"stops",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<div class="stopnum">${i+1}</div>`,iconSize:[0,0]})}));});
  map.flyToBounds(L.latLngBounds(pts),{padding:[50,50],duration:.8,maxZoom:15});
}
function routeStats(r){let km=0;const legs=[];for(let i=1;i<r.stops.length;i++){const d=hav(BYID[r.stops[i-1]],BYID[r.stops[i]])*1.25;legs.push(d);km+=d;}
  const speed={walk:4,bike:14,car:55}[r.mode];const mins=Math.round(km/speed*60+r.stops.length*(r.mode==="car"?35:20));return {km,legs,mins};}
function gmapsRoute(r){const pts=r.stops.map(id=>BYID[id]).map(p=>p.lat+","+p.lon);const mode={walk:"walking",bike:"bicycling",car:"driving"}[r.mode];
  return "https://www.google.com/maps/dir/?api=1&origin="+pts[0]+"&destination="+pts.at(-1)+(pts.length>2?"&waypoints="+encodeURIComponent(pts.slice(1,-1).join("|")):"")+"&travelmode="+mode;}
function fmtDur(m){const h=Math.floor(m/60),mm=m%60;return h?`${h} h${mm?" "+mm+" min":""}`:`${mm} min`;}

/* ---------- views ---------- */
function setTab(tab,push=true){
  state.tab=tab;
  $$("#tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab||(tab==="lugar"&&b.dataset.tab==="explorar"))));
  if(tab==="inicio"&&!state.route) map.flyToBounds(homeBounds,{padding:[16,16],duration:.6});
  $$(".view").forEach(v=>v.hidden=v.id!=="v-"+tab);
  if(tab!=="rutas"&&tab!=="lugar"&&state.route){state.route=null;drawRoute(null);}
  render(tab);
  if(push) setHash(tab==="lugar"?"p-"+state.sel:tab);
  $("#v-"+tab).scrollTop=0;
}
function setHash(h){try{if(location.hash!=="#"+h) history.replaceState(null,"","#"+h);}catch(e){}}
function render(tab){({inicio:renderHome,explorar:renderExplore,lugar:renderPlace,rutas:renderRoutes,guias:renderGuides,gestion:renderAdmin}[tab]||(()=>{}))();refreshMarkers();}

  $("#chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;const c=b.dataset.c;

    renderExplore();refreshMarkers();};
  $("#list").onclick=e=>{const b=e.target.closest("[data-id]");if(b) openPlace(b.dataset.id);};

function nearList(list){return list.map(p=>({p,d:hav(state.me,p)})).sort((a,b)=>a.d-b.d).map(({p,d})=>rowHTML(p,`${p.town} · ${nf().format(d)} km`)).join("");}
let meMarker=null;
function nearMe(){
  if(state.me){state.me=null;if(meMarker){map.removeLayer(meMarker);meMarker=null;}renderExplore();return;}
  if(!navigator.geolocation){toast(t("locErr"));return;}
  toast(t("locating"));
  try{navigator.geolocation.getCurrentPosition(pos=>{
    state.me={lat:pos.coords.latitude,lon:pos.coords.longitude};
    if(meMarker) map.removeLayer(meMarker);
    const tt=$(".toast");if(tt) tt.hidden=true;
    meMarker=L.marker([state.me.lat,state.me.lon],{interactive:false,keyboard:false,zIndexOffset:1000,title:t("youAreHere"),icon:L.divIcon({className:"",html:'<div class="me-dot"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map);
    const c=homeBounds.getCenter(),far=hav(state.me,{lat:c.lat,lon:c.lng});
    if(far>40) toast(t("farAway",{n:Math.round(far)})); else map.flyTo([state.me.lat,state.me.lon],13,{duration:.7});
    renderExplore();
  },()=>toast(t("locErr")),{timeout:9000,maximumAge:60000});}catch(e){toast(t("locErr"));}
}
function rowHTML(p,sub){return `<button type="button" class="row" data-id="${p.id}" style="--c:var(${CATS[p.cat].color})">${phHTML(p.id,p.cat,330)}<span style="min-width:0"><span class="t">${esc(L10(p.name))}</span><br><span class="s">${esc(sub??t("cat_"+p.cat))}</span></span><span class="go" aria-hidden="true">›</span></button>`;}
function groupByTown(list){const g={};list.forEach(p=>(g[p.town]=g[p.town]||[]).push(p));
  return Object.keys(g).sort((a,b)=>a.localeCompare(b,"es")).map(n=>`<div class="group-h">${esc(n)}<span>${esc(g[n].length===1?t("onePlace"):t("nPlaces",{n:g[n].length}))}</span></div>${g[n].map(p=>rowHTML(p)).join("")}`).join("");}

function placeUrl(id){return location.href.split("#")[0]+"#p-"+id;}
function qrInto(el,text){try{const q=qrcode(0,"M");q.addData(text);q.make();el.innerHTML=q.createSvgTag({cellSize:3,margin:0,scalable:true});const s=el.querySelector("svg");if(s){s.querySelectorAll("rect").forEach(r=>{if((r.getAttribute("fill")||"").toLowerCase()==="#ffffff"||r.getAttribute("fill")==="white") r.setAttribute("fill","#fff");});s.setAttribute("role","img");s.setAttribute("aria-label","QR");}}catch(e){el.textContent="QR";}}
function copyText(s){const done=()=>toast(t("copied"));try{navigator.clipboard.writeText(s).then(done,()=>fallbackCopy(s,done));}catch(e){fallbackCopy(s,done);}}
function fallbackCopy(s,done){const ta=document.createElement("textarea");ta.value=s;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy");}catch(e){}document.body.removeChild(ta);if(ok) done(); else toast(s);}
function speak(text){
  if(!("speechSynthesis" in window)){toast(t("noAudio"));return;}
  const ss=window.speechSynthesis;
  if(speaking){ss.cancel();speaking=false;renderPlace();return;}
  try{
    const u=new SpeechSynthesisUtterance(text);const code=LANGS.find(l=>l[0]===lang)[2];u.lang=code;
    const vs=ss.getVoices();const vv=vs.find(x=>x.lang===code)||vs.find(x=>x.lang&&x.lang.startsWith(lang));if(vv) u.voice=vv;
    u.rate=.97;u.onend=u.onerror=()=>{speaking=false;if(state.tab==="lugar") renderPlace();};
    ss.cancel();ss.speak(u);speaking=true;renderPlace();
  }catch(e){toast(t("noAudio"));}
}
function svgI(n){const P={audio:'<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="1.5"/>',nav:'<path d="M3 11 21 3l-8 18-2-8-8-2z"/>',link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',map:'<path d="m9 4-6 3v13l6-3 6 3 6-3V4l-6 3-6-3z"/><path d="M9 4v13M15 7v13"/>',locate:'<circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/><circle cx="12" cy="12" r="7.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',check:'<path d="m5 12 5 5 9-10"/>'};
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;}

function renderRoutes(){
  const v=$("#v-rutas");

  if(!r){
    v.innerHTML=`<div class="stack" style="gap:4px"><div class="eyebrow">${esc(t("tabRoutes"))}</div><h2>${esc(t("routesTitle"))}</h2><p class="lede">${esc(t("routesIntro"))}</p></div>
     ${DATA.routes.map(r=>{const s=routeStats(r);return `<button type="button" class="route-card" data-r="${r.id}" style="--c:var(${CATS[r.cat].color})">
       ${phHTML(r.cover||r.stops[0],r.cat,960,"cover-ph")}
       <span class="pill"><span class="dot"></span>${esc(t("cat_"+r.cat))}</span><h3>${esc(L10(r.name))}</h3><p class="small">${esc(L10(r.summary))}</p>
       <span class="kv"><span><b>${r.stops.length}</b> ${esc(t("stopsWord"))}</span><span><b>${nf().format(s.km)}</b> km</span><span>${esc(t("mode_"+r.mode))} · <b>${fmtDur(s.mins)}</b></span></span></button>`;}).join("")}
     <p class="note">${esc(t("routesNote"))}</p>`;
    v.onclick=e=>{const b=e.target.closest("[data-r]");if(b){state.route=b.dataset.r;setHash("r-"+state.route);renderRoutes();drawRoute(DATA.routes.find(x=>x.id===state.route));refreshMarkers();}};
    return;
  }
  const s=routeStats(r);
  v.innerHTML=`<button type="button" class="back" id="rback">‹ ${esc(t("allRoutes"))}</button>
   <div class="detail-h" style="--c:var(${CATS[r.cat].color})"><span class="pill"><span class="dot"></span>${esc(t("cat_"+r.cat))}</span><h2>${esc(L10(r.name))}</h2>
   <div class="meta" style="font-variant-numeric:tabular-nums">${r.stops.length} ${esc(t("stopsWord"))} · ${nf().format(s.km)} km · ${esc(t("mode_"+r.mode))} · ${fmtDur(s.mins)}</div></div>
   <p class="desc">${esc(L10(r.summary))}</p>
   <div class="actions"><a class="btn primary" href="${gmapsRoute(r)}" target="_blank" rel="noopener">${svgI("nav")}<span>${esc(t("openGmaps"))}</span></a><button type="button" class="btn" id="rcopy">${svgI("link")}<span>${esc(t("copyRoute"))}</span></button></div>
   <ol class="stops" style="--c:var(${CATS[r.cat].color})">${r.stops.map((id,i)=>`<li><span><button type="button" data-id="${id}">${esc(L10(BYID[id].name))}</button><span class="leg">${esc(BYID[id].town)}${i?` · ${nf().format(s.legs[i-1])} km ${esc(t("fromPrev"))}`:""}</span></span></li>`).join("")}</ol>
   <p class="note">${esc(t("routesNote"))}</p>`;
  $("#rcopy").onclick=e=>{e.stopPropagation();copyText(location.href.split("#")[0]+"#r-"+r.id);};
  $("#rback").onclick=()=>{state.route=null;drawRoute(null);setHash("rutas");renderRoutes();refreshMarkers();map.flyToBounds(homeBounds,{padding:[16,16],duration:.7});};
  v.onclick=e=>{const b=e.target.closest("[data-id]");if(b){state.sel=b.dataset.id;const p=BYID[state.sel];setTab("lugar");map.flyTo([p.lat,p.lon],14,{duration:.7});}};
}

   ${ex.map(x=>`<article class="guide"><div class="guide-top"><span class="avatar">${esc(x.initials)}</span><div style="min-width:0"><h3>${esc(L10(x.title))}</h3><div class="small">${esc(L10(x.host))}</div></div></div>
     <p class="small" style="color:var(--ink)">${esc(L10(x.desc))}</p>
     <div class="kv"><span><b>${esc(x.town)}</b></span><span>${esc(x.duration)}</span><span>${esc(x.langs)}</span><span>${esc(L10(x.price))}</span></div>

   <form class="card" id="guideForm" novalidate>

     <div class="two"><div class="field"><label for="g-town">${esc(t("fTown"))}</label><select id="g-town">${TOWNS.map(x=>`<option>${esc(x.name)}</option>`).join("")}</select></div>
       <div class="field"><label for="g-langs">${esc(t("fLangs"))}</label><input id="g-langs" placeholder="ES, EN"></div></div>
     <div class="field"><label for="g-desc">${esc(t("fDesc"))}</label><textarea id="g-desc" rows="3"></textarea></div>
     <label class="check"><input type="checkbox" id="g-lic" required><span>${esc(t("fLicense"))}</span></label>
     <button type="submit" class="btn primary" style="align-self:flex-start">${esc(t("publish"))}</button>
     <div id="g-ok"></div>
   </form>

  v.onclick=e=>{const b=e.target.closest("[data-book]");if(!b)return;const id=b.dataset.book;const slot=$(`[data-form="${id}"]`,v);
