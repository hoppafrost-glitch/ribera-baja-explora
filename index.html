    slot.innerHTML=`<form class="card" data-bf="${id}" novalidate><div class="two"><div class="field"><label for="b-name-${id}">${esc(t("fYourName"))}</label><input id="b-name-${id}" required></div>
     <div class="field"><label for="b-date-${id}">${esc(t("fDate"))}</label><input id="b-date-${id}" type="date" required></div></div>

     <div class="field"><label for="b-lang-${id}">${esc(t("fLanguage"))}</label><select id="b-lang-${id}">${LANGS.map(l=>`<option ${l[0]===lang?"selected":""}>${l[1]}</option>`).join("")}</select></div></div>

function renderAdmin(){
  const v=$("#v-gestion");const A=DATA.adminSample;
  const byTown={};POIS.forEach(p=>{const x=byTown[p.town]=byTown[p.town]||{n:0,ok:0};x.n++;if(p.status==="ok")x.ok++;});
  const max=Math.max(...A.byLang.map(x=>x[1]));
  if(!state.ed.id||!BYID[state.ed.id]) state.ed={id:POIS[0].id,lang:state.ed.lang||"es",draft:null};
  const ep=BYID[state.ed.id];
  if(!state.ed.draft||state.ed.draft.id!==ep.id) state.ed.draft={id:ep.id,name:Object.assign({},ep.name),desc:Object.assign({},ep.desc),cat:ep.cat,status:ep.status||"pending"};
  const d=state.ed.draft,el=state.ed.lang;
  const towns=[...new Set(POIS.map(p=>p.town))].sort((x,y)=>x.localeCompare(y,"es"));
  v.innerHTML=`<div class="stack" style="gap:4px"><div class="eyebrow">${esc(t("tabAdmin"))}</div><h2>${esc(t("adminTitle"))}</h2><p class="lede">${esc(t("adminIntro"))}</p></div>
   <div class="stack" style="gap:6px"><div class="toolbar"><h3>${esc(t("adminActivity"))}</h3><span class="tag">${esc(t("sampleData"))}</span></div>
   <div class="kpis"><div class="kpi"><b>${new Intl.NumberFormat(lang).format(A.visits)}</b><span>${esc(t("kVisits"))}</span></div>
   <div class="kpi"><b>${A.foreign}%</b><span>${esc(t("kForeign"))}</span></div><div class="kpi"><b>${A.qrScans}</b><span>${esc(t("kQr"))}</span></div></div>
   <div class="bars" aria-label="${esc(t("byLang"))}">${A.byLang.map(([k,n])=>`<div class="bar"><span>${esc(k)}</span><span class="track"><span class="fill" style="width:${(n/max*100).toFixed(1)}%;display:block"></span></span><span class="v">${new Intl.NumberFormat(lang).format(n)}</span></div>`).join("")}</div>
   <div class="small">${esc(t("byLang"))}</div></div>

   <form class="editor" id="ed" novalidate>
     <div class="toolbar"><h3>${esc(t("editTitle"))}</h3>${d.status==="ok"?`<span class="status ok"><i></i>${esc(t("validated"))}</span>`:`<span class="status"><i></i>${esc(t("pending"))}</span>`}</div>
     <p class="small">${esc(t("editIntro"))}</p>
     <div class="field"><label for="ed-place">${esc(t("pickPlace"))}</label><select id="ed-place">${towns.map(tn=>`<optgroup label="${esc(tn)}">${POIS.filter(p=>p.town===tn).map(p=>`<option value="${p.id}" ${p.id===ep.id?"selected":""}>${esc(L10(p.name))}${p.status==="ok"?" ✓":""}</option>`).join("")}</optgroup>`).join("")}</select></div>
     <div class="field"><label for="ed-cat">${esc(t("fieldCat"))}</label><select id="ed-cat">${Object.keys(CATS).map(c=>`<option value="${c}" ${c===d.cat?"selected":""}>${esc(t("cat_"+c))}</option>`).join("")}</select></div>
     <div class="field"><span class="small" style="font-weight:600">${esc(t("editLang"))}</span><div class="seg" id="ed-lang">${LANGS.map(([k,lab])=>`<button type="button" data-l="${k}" aria-pressed="${k===el}">${lab}</button>`).join("")}</div></div>
     <div class="field"><label for="ed-name">${esc(t("fieldName"))} · ${el.toUpperCase()}</label><input id="ed-name" lang="${el}" value="${esc(d.name[el]||"")}"></div>
     <div class="field"><label for="ed-desc">${esc(t("fieldDesc"))} · ${el.toUpperCase()}</label><textarea id="ed-desc" lang="${el}" rows="7">${esc(d.desc[el]||"")}</textarea></div>
     <label class="check"><input type="checkbox" id="ed-ok" ${d.status==="ok"?"checked":""}><span>${esc(t("markValidated"))}</span></label>
     <div class="actions"><button type="submit" class="btn primary">${svgI("check")}<span>${esc(t("save"))}</span></button><button type="button" class="btn" id="ed-view">${esc(t("viewOnMap"))}</button></div>
   </form>

   <div class="stack" style="gap:6px"><h3>${esc(t("addTitle"))}</h3><p class="small">${esc(t("addText"))}</p>
     <div class="actions"><button type="button" class="btn" id="ed-add">${svgI("plus")}<span>${esc(state.adding?t("cancel"):t("addBtn"))}</span></button>
     <button type="button" class="btn" id="ed-reset">${svgI("undo")}<span>${esc(t("resetBtn"))}</span></button></div></div>

   <div class="stack" style="gap:6px"><h3>${esc(t("adminContent"))}</h3>
   <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>${esc(t("fTown"))}</th><th class="n" style="text-align:right">${esc(t("places"))}</th><th>${esc(t("state"))}</th></tr></thead>
   <tbody>${Object.keys(byTown).sort((x,y)=>x.localeCompare(y,"es")).map(n=>`<tr><td>${esc(n)}</td><td class="n">${byTown[n].n}</td><td><span class="status${byTown[n].ok===byTown[n].n?" ok":""}"><i></i>${esc(t("nValidated",{a:byTown[n].ok,b:byTown[n].n}))}</span></td></tr>`).join("")}</tbody></table></div>
   <div class="actions"><button type="button" class="btn" id="exp">${svgI("copy")}<span>${esc(t("exportJson"))}</span></button></div></div>

   <div class="stack" style="gap:6px"><h3>${esc(t("qrSheet"))}</h3><p class="small">${esc(t("qrSheetText"))}</p>
   <div class="qrgrid">${POIS.map(p=>`<figure><div class="qr" data-qr="${p.id}"></div><figcaption>${esc(L10(p.name))}<br>${esc(p.town)}</figcaption></figure>`).join("")}</div></div>
   <p class="note">${esc(t("editNote"))}</p>`;
  $$("[data-qr]",v).forEach(q=>qrInto(q,placeUrl(q.dataset.qr)));
  const keep=()=>{d.name[state.ed.lang]=$("#ed-name").value;d.desc[state.ed.lang]=$("#ed-desc").value;d.cat=$("#ed-cat").value;d.status=$("#ed-ok").checked?"ok":"pending";};
  $("#ed-place").onchange=e=>{state.ed.id=e.target.value;state.ed.draft=null;renderAdmin();};
  $("#ed-lang").onclick=e=>{const b=e.target.closest("button");if(!b)return;keep();state.ed.lang=b.dataset.l;renderAdmin();$("#ed-name").focus();};
  $("#ed").onsubmit=e=>{e.preventDefault();keep();
    const p=BYID[d.id];const rec=EDITS.byId[p.id]=EDITS.byId[p.id]||{};
    rec.name=Object.assign({},d.name);rec.desc=Object.assign({},d.desc);rec.status=d.status;rec.cat=d.cat;
    p.name=Object.assign({},d.name);p.desc=Object.assign({},d.desc);p.status=d.status;
    if(p.cat!==d.cat){p.cat=d.cat;markers[p.id].setIcon(pinIcon(p));}
    const add=EDITS.added.find(a=>a.id===p.id);if(add){Object.assign(add,{name:p.name,desc:p.desc,status:p.status,cat:p.cat});}
    saveEdits();state.ed.draft=null;toast(t("saved"));renderAdmin();refreshMarkers();};
  $("#ed-view").onclick=()=>{keep();openPlace(d.id);};
  $("#ed-add").onclick=()=>{if(state.adding){stopAdding();renderAdmin();return;}
    state.adding=true;$("#map").classList.add("adding");toast(t("clickMap"));renderAdmin();
    map.once("click",ev=>{if(!state.adding)return;stopAdding();
      const ll={lat:+ev.latlng.lat.toFixed(5),lon:+ev.latlng.lng.toFixed(5)};
      const town=TOWNS.map(tw=>({tw,d:hav(ll,tw)})).sort((x,y)=>x.d-y.d)[0].tw.name;
      const np={id:"nuevo-"+Date.now().toString(36),town,cat:"patrimonio",lat:ll.lat,lon:ll.lon,name:{es:t("newPlace")},desc:{es:""},when:{es:""},status:"pending",added:true};
      POIS.push(np);BYID[np.id]=np;EDITS.added.push(np);saveEdits();addMarker(np);
      state.ed={id:np.id,lang:"es",draft:null};renderAdmin();refreshMarkers();
      const f=$("#ed-name");if(f){f.focus();f.select();}});};
  const rb=$("#ed-reset");rb.onclick=()=>{if(rb.dataset.armed){EDITS={byId:{},added:[]};saveEdits();try{location.reload();}catch(e){}return;}
    rb.dataset.armed="1";rb.classList.add("warn");rb.querySelector("span").textContent=t("resetConfirm");setTimeout(()=>{if(rb.isConnected){delete rb.dataset.armed;rb.classList.remove("warn");rb.querySelector("span").textContent=t("resetBtn");}},4000);};
  $("#exp").onclick=()=>copyText(JSON.stringify(POIS.map(p=>({id:p.id,municipio:p.town,categoria:p.cat,lat:p.lat,lon:p.lon,estado:p.status||"pending",nombre:p.name,descripcion:p.desc})),null,1));
}
function stopAdding(){state.adding=false;$("#map").classList.remove("adding");}

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  $$("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  $("#langs").innerHTML=LANGS.map(([k,lab])=>`<button type="button" data-l="${k}" aria-pressed="${k===lang}" lang="${k}">${lab}</button>`).join("");
  $$(".layerbox button").forEach(b=>b.textContent=t("base_"+b.dataset.k));
  $("#legend").innerHTML=Object.keys(CATS).map(c=>`<div style="--c:var(${CATS[c].color})"><i></i>${esc(t("cat_"+c))}</div>`).join("");
  POIS.forEach(p=>{const el=markers[p.id].getElement();if(el) el.setAttribute("title",L10(p.name));});
  if(speaking){try{speechSynthesis.cancel()}catch(e){} speaking=false;}
  render(state.tab);
}
$("#langs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;store.set("rbx-lang",lang);applyLang();});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.tab==="explorar") state.sel=null;setTab(b.dataset.tab);});
setBasemap("mapa",true);
function zoomClasses(){const z=map.getZoom(),el=$("#map");el.classList.toggle("zlow",z<11.4);el.classList.toggle("zfar",z<12);}
map.on("zoomend",zoomClasses);zoomClasses();

/* ---------- cover ---------- */
function showCover(){
  let seen=false;try{seen=sessionStorage.getItem("rbx-cover")==="1";}catch(e){}
  if(seen) return;
  const c=$("#cover");const key=DATA.coverPhoto||"rueda";const ph=PH[key];
  const draw=()=>{c.innerHTML=`${phHTML(key,"patrimonio",1280)}<div class="shade"></div>
    <div class="brandc"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="rgba(255,255,255,.16)"/><path d="M4 22c5-1 6-7 11-7s5 9 10 9 4-6 5-7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="23" cy="10" r="2.6" fill="#fff"/></svg><span>Ribera Baja Explora</span></div>
    <div class="clangs">${LANGS.map(([k,lab])=>`<button type="button" data-l="${k}" aria-pressed="${k===lang}">${lab}</button>`).join("")}</div>
    <div class="in"><div class="kick">${esc(t("coverKicker"))}</div><h1>${clauses(t("coverTitle"))}</h1><p>${esc(t("coverText"))}</p>
    <div class="row2"><button type="button" class="cbtn main" id="c-go">${esc(t("coverCta"))}</button><button type="button" class="cbtn" id="c-routes">${esc(t("coverRoutes"))}</button></div></div>
    ${ph?`<div class="credit">${esc(t("photo"))}: <a href="${esc(ph.page)}" target="_blank" rel="noopener">${esc(ph.author)}</a> · ${esc(ph.license)}</div>`:""}`;
    $("#c-go").onclick=()=>hideCover("inicio");$("#c-routes").onclick=()=>hideCover("rutas");
    $(".clangs",c).onclick=e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;store.set("rbx-lang",lang);applyLang();draw();};};
  draw();c.hidden=false;
  setTimeout(()=>{const g=$("#c-go");if(g) g.focus();},50);
}
function hideCover(tab){const c=$("#cover");c.hidden=true;c.innerHTML="";try{sessionStorage.setItem("rbx-cover","1");}catch(e){}
  if(tab&&tab!==state.tab) setTab(tab);setTimeout(()=>map.invalidateSize(),30);}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#cover").hidden) hideCover();});

/* ---------- hash routing ---------- */
function fromHash(){
  const h=(location.hash||"").slice(1);
  if(h&&!$("#cover").hidden){const c=$("#cover");c.hidden=true;c.innerHTML="";setTimeout(()=>map.invalidateSize(),30);}
  if(h.startsWith("p-")&&BYID[h.slice(2)]){state.sel=h.slice(2);const p=BYID[state.sel];setTab("lugar",false);map.setView([p.lat,p.lon],14);return;}
  if(h.startsWith("r-")&&DATA.routes.some(r=>r.id===h.slice(2))){state.route=h.slice(2);setTab("rutas",false);drawRoute(DATA.routes.find(r=>r.id===state.route));return;}
  if(["inicio","explorar","rutas","guias","gestion"].includes(h)){setTab(h,false);return;}
  setTab("inicio",false);showCover();
}
window.addEventListener("hashchange",fromHash);
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(state.adding){stopAdding();if(state.tab==="gestion")renderAdmin();return;}const bk=$("#back")||$("#rback");if(bk&&!e.target.closest("input,textarea,select"))bk.click();});
applyLang();
fromHash();
setTimeout(()=>map.invalidateSize(),60);
window.addEventListener("resize",()=>map.invalidateSize());
})();
</script>
