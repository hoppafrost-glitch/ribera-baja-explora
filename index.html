/* Layout: one-screen app. Map is the stage; a reading panel sits beside it (stacked under it on phones).
   Palette drawn from the Ribera: limestone ground, Ebro teal, mudéjar brick, steppe ochre. */
:root{
  --bg:#ECEFEA; --panel:#FAFBF8; --panel-2:#F2F4EF; --ink:#18221E; --muted:#56635D; --faint:#7D8984;
  --line:#D5DBD3; --accent:#17646C; --accent-ink:#FFFFFF; --accent-soft:#D6E8E8;
  --land:#E2E6DB; --land-hi:#D5DCCB; --land-out:#EEF0EA; --edge:#9AA79C; --outline:#17646C;
  --water:#3C8D96; --water-soft:#BFDCDD; --label:#2E3A35;
  --c-pat:#A4502C; --c-gue:#5A6A33; --c-mus:#7A4A7F; --c-hid:#2A6CA1; --c-nat:#3C8550; --c-arq:#97702F; --c-cam:#B98A0E;
  --ok:#2E7D4F; --shadow:0 1px 2px rgba(20,34,30,.08),0 6px 18px rgba(20,34,30,.08);
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --panel:#141C19; --panel-2:#19231F; --ink:#E5ECE8; --muted:#9FADA7; --faint:#7E8C86;
  --line:#26332E; --accent:#5DB6BE; --accent-ink:#0B1513; --accent-soft:#183437;
  --land:#1A2420; --land-hi:#21302A; --land-out:#111815; --edge:#3A4A43; --outline:#5DB6BE;
  --water:#3E8F98; --water-soft:#1B3A3D; --label:#C9D4CF;
  --c-pat:#E08A63; --c-gue:#A9B872; --c-mus:#C08BC5; --c-hid:#6FA9DA; --c-nat:#7CC48D; --c-arq:#D6AE68; --c-cam:#E5BD45;
  --ok:#69C08E; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --panel:#141C19; --panel-2:#19231F; --ink:#E5ECE8; --muted:#9FADA7; --faint:#7E8C86;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:1001}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand svg{flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1.28rem;line-height:1.1;letter-spacing:.01em}
.brand-sub{font-size:.74rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel-2)}
.langs button{border:0;background:transparent;padding:5px 10px;font-size:.78rem;font-weight:600;letter-spacing:.05em;cursor:pointer;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.demo-tag{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:2px 6px}

main{display:grid;grid-template-columns:minmax(330px,410px) 1fr;min-height:0}
#panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#mapwrap{position:relative;min-height:0;min-width:0}
#map{position:absolute;inset:0;background:var(--bg)}
@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(260px,46%) 1fr}
  #mapwrap{order:-1}
  #panel{border-right:0;border-top:1px solid var(--line)}
  .brand-sub{display:none}
}

nav.tabs{display:flex;gap:2px;padding:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}

.town-label.out{font-weight:500;font-size:11px;color:var(--faint);font-style:italic}
.river-label{font-family:var(--f-display);font-style:italic;font-size:14px;color:var(--water);letter-spacing:.35em;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg);white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%) rotate(-12deg);display:inline-block}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.35);border:2px solid var(--panel);transition:transform .15s}
.pin svg{width:15px;height:15px;transform:rotate(45deg);color:#fff}
.pin.sel{transform:rotate(-45deg) scale(1.28);border-color:var(--ink)}
.pin.dim{opacity:.28}
.zlow .pin{width:13px;height:13px;border-radius:50%;transform:translate(-2.5px,23.5px);border-width:1.5px}
.zlow .pin svg{display:none}
.zlow .pin.sel{transform:translate(-2.5px,23.5px) scale(1.6)}
.zfar .town-label.minor{display:none}
.stopnum{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--panel);transform:translate(14px,-40px);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.zlow .stopnum{transform:translate(4px,-14px)}
.leaflet-control-zoom a,.mapbtn{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--muted)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--accent)!important}
.leaflet-top.leaflet-left{left:env(safe-area-inset-left,0px)}
.layerbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;gap:2px}
.layerbox button{border:0;background:none;text-align:left;padding:6px 10px;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.layerbox button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;font-size:.74rem;display:flex;flex-direction:column;gap:3px;max-width:180px}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
@media (max-width:760px){.legend{display:none}.layerbox{flex-direction:row;padding:3px;margin-left:max(10px,env(safe-area-inset-left,0px))!important}.layerbox button{padding:5px 8px;font-size:.72rem}.leaflet-bottom.leaflet-left{bottom:16px}}

/* Móvil: la página entera hace scroll; el mapa queda arriba y se va al bajar, así se lee a pantalla completa */
@media (max-width:760px){
  html,body{height:auto}
  #app{height:auto;display:block}
  main{display:flex;flex-direction:column}
  #mapwrap{order:-1;height:40vh;height:40svh;min-height:230px;flex:none}
  #panel{min-height:calc(100vh - 56px);min-height:calc(100svh - 56px)}
  nav.tabs{position:sticky;top:0;z-index:1002;background:var(--panel)}
  .view{overflow:visible;flex:none;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #tomap{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:1500;display:flex;align-items:center;gap:7px;
    border:0;border-radius:999px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.86rem;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;
    transition:opacity .2s,transform .2s}
  #tomap svg{width:17px;height:17px}
  #tomap[data-off]{opacity:0;transform:translateY(12px);pointer-events:none}
}
@media (min-width:761px){#tomap{display:none}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:8px;font-size:.86rem;z-index:5000;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="cover" hidden></div>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="var(--accent)"/><path d="M4 22c5-1 6-7 11-7s5 9 10 9 4-6 5-7" stroke="var(--accent-ink)" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="23" cy="10" r="2.6" fill="var(--accent-ink)"/></svg>
      <div style="min-width:0">
        <div class="brand-name">Ribera Baja Explora</div>
        <div class="brand-sub" data-i="appSub"></div>
      </div>
    </div>
    <span class="demo-tag" data-i="demo"></span>
    <div class="langs" role="group" aria-label="Idioma / Language" id="langs"></div>
  </header>
  <main>
    <aside id="panel">
      <nav class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="inicio" data-i="tabHome"></button>
        <button role="tab" data-tab="explorar" data-i="tabExplore"></button>
        <button role="tab" data-tab="rutas" data-i="tabRoutes"></button>
        <button role="tab" data-tab="guias" data-i="tabGuides"></button>
        <button role="tab" data-tab="gestion" data-i="tabAdmin"></button>
      </nav>
      <section class="view stack" id="v-inicio"></section>
      <section class="view stack" id="v-explorar" hidden></section>
      <section class="view stack" id="v-lugar" hidden></section>
      <section class="view stack" id="v-rutas" hidden></section>
      <section class="view stack" id="v-guias" hidden></section>
      <section class="view stack" id="v-gestion" hidden></section>
    </aside>
    <div id="mapwrap"><div id="map" role="application" aria-label="Mapa"></div></div>
    <button type="button" id="tomap" data-off><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 4-6 3v13l6-3 6 3 6-3V4l-6 3-6-3z"/><path d="M9 4v13M15 7v13"/></svg><span data-i="tabMap"></span></button>
  </main>
</div>

":{"color":"--c-pat","icon":"<path d=\"M4 21V10l8-6 8 6v11\"/><path d=\"M9.5 21v-5.5a2.5 2.5 0 0 1 5 0V21\"/>"},"memoria":{"color":"--c-gue","icon":"<path d=\"M6 21V4\"/><path d=\"M6 4h11l-2.5 4L17 12H6\"/>"},"museo":{"color":"--c-mus","icon":"<path d=\"M3 9.5 12 4l9 5.5\"/><path d=\"M5.5 11v7M10 11v7M14 11v7M18.5 11v7\"/><path d=\"M3 20.5h18\"/>"},"arqueologia":{"color":"--c-arq","icon":"<path d=\"M9 3h6\"/><path d=\"M10 3v3.2C7.2 8 6.3 11 7 14.5L9 20h6l2-5.5c.7-3.5-.2-6.5-3-8.3V3\"/>"},"hidraulico":{"color":"--c-hid","icon":"<circle cx=\"12\" cy=\"12\" r=\"7.5\"/><circle cx=\"12\" cy=\"12\" r=\"1.8\"/><path d=\"M12 4.5v15M4.5 12h15M6.7 6.7l10.6 10.6M17.3 6.7 6.7 17.3\"/>"},"naturaleza":{"color":"--c-nat","icon":"<path d=\"M2.5 11c2.8-2.6 5.6-2.6 8 .3 2.4-2.9 5.2-2.9 8-.3\"/><path d=\"M8 17c1.6-1.5 3.2-1.5 4.6.2 1.4-1.7 3-1.7 4.6-.2\"/>"},"camino":{"color":"--c-cam","icon":"<path d=\"M12 20.5 3.5 9.2a9.5 9.5 0 0 1 17 0z\"/><path d=\"M12 20.5 8 6.5M12 20.5V5M12 20.5l4-14\"/>"}},"pois":[{"id":"piquete","town":"Quinto","cat":"museo","lat":41.42386,"lon":-0.49827,"src":"https://campaners.com/php/torrepdf.php?numer=9414","name":{"es":"El Piquete · Museo de las Momias","en":"El Piquete · Mummy Museum","fr":"El Piquete · Musée des momies","de":"El Piquete · Mumienmuseum","pt":"El Piquete · Museu das Múmias"},"when":{"es":"Siglo XV · mudéjar · Bien de Interés Cultural","en":"15th century · Mudéjar · Site of Cultural Interest","fr":"XVe siècle · mudéjar · Bien d'intérêt culturel","de":"15. Jh. · Mudéjar · Kulturgut (BIC)","pt":"Século XV · mudéjar · Bem de Interesse Cultural"},"desc":{"es":"La antigua iglesia de la Asunción, de ladrillo mudéjar, domina Quinto desde el cerro de la Corona; se empezó a principios del siglo XV y es un destacado ejemplo del mudéjar aragonés. Quedó dañada en la batalla de 1937. Desde 2018 acoge el primer museo de momias de España: quince cuerpos que se momificaron de forma natural entre los siglos XVIII y XIX, hallados en 2011 entre más de mil enterramientos.","en":"The old Church of the Assumption, built in Mudéjar brick, crowns Quinto from the Corona hill; work began in the early 15th century and it is a fine example of Aragonese Mudéjar. It was damaged in the 1937 battle. Since 2018 it has housed Spain's first mummy museum: fifteen bodies naturally mummified in the 18th and 19th centuries, found in 2011 among more than a thousand burials.","fr":"L'ancienne église de l'Assomption, en brique mudéjare, domine Quinto depuis la colline de la Corona ; commencée au début du XVe siècle, elle est un bel exemple de l'art mudéjar aragonais. Elle fut endommagée lors de la bataille de 1937. Depuis 2018, elle abrite le premier musée des momies d'Espagne : quinze corps momifiés naturellement aux XVIIIe et XIXe siècles, retrouvés en 2011 parmi plus de mille sépultures.","de":"Die alte Mariä-Himmelfahrt-Kirche aus Mudéjar-Backstein thront auf dem Corona-Hügel über Quinto; begonnen Anfang des 15. Jahrhunderts, ist sie ein herausragendes Beispiel des aragonesischen Mudéjar. In der Schlacht von 1937 wurde sie beschädigt. Seit 2018 beherbergt sie Spaniens erstes Mumienmuseum: fünfzehn im 18. und 19. Jahrhundert natürlich mumifizierte Leichname, 2011 unter über tausend Bestattungen gefunden.","pt":"A antiga igreja da Assunção, em tijolo mudéjar, domina Quinto a partir da colina da Corona; foi iniciada no início do século XV e é um destacado exemplo do mudéjar aragonês. Ficou danificada na batalha de 1937. Desde 2018 acolhe o primeiro museu de múmias de Espanha: quinze corpos mumificados naturalmente entre os séculos XVIII e XIX, encontrados em 2011 entre mais de mil enterramentos."},"visit":{"es":"Solo con visita guiada. Reservas en momiasdequinto.es; los horarios cambian según la temporada, así que consulta el calendario antes de ir.","en":"Guided visits only. Book at momiasdequinto.es; times vary by season, so check the calendar before you go.","fr":"Uniquement en visite guidée. Réservation sur momiasdequinto.es ; les horaires varient selon la saison, consultez le calendrier avant de venir.","de":"Nur mit Führung. Buchung über momiasdequinto.es; die Zeiten wechseln je nach Saison, also vorher den Kalender prüfen.","pt":"Apenas com visita guiada. Reservas em momiasdequinto.es; os horários mudam conforme a época, por isso consulte o calendário antes de ir."},"more":{"es":"Fíjate en la torre: base de piedra sin decorar y, en el segundo cuerpo, estrellas de ocho puntas en ladrillo; el cuarto cuerpo se añadió en el siglo XVI. La portada sur conserva escudos en alabastro, uno atribuido al arzobispo de Zaragoza Francisco Clemente Pérez, y tres hornacinas que han perdido sus esculturas. Se suele atribuir la obra a Mahoma Ramí, maestro de obras del papa Luna. Entre 1687 y 1697 Joseph Bardaxi alargó la nave dos tramos, y la capilla de Santa Ana se bendijo en 1761.","en":"Look at the tower: a plain stone base and, on the second stage, eight-pointed brick stars; the fourth stage was added in the 16th century. The south doorway keeps alabaster coats of arms, one attributed to Archbishop Francisco Clemente Pérez of Zaragoza, and three niches whose statues are gone. The design is usually credited to Mahoma Ramí, master builder to the antipope Benedict XIII (Papa Luna). Between 1687 and 1697 Joseph Bardaxi lengthened the nave by two bays, and the Santa Ana chapel was blessed in 1761.","fr":"Observez la tour : une base en pierre nue et, au deuxième niveau, des étoiles à huit pointes en brique ; le quatrième niveau date du XVIe siècle. Le portail sud conserve des blasons en albâtre, dont l'un est attribué à l'archevêque de Saragosse Francisco Clemente Pérez, et trois niches qui ont perdu leurs statues. On attribue généralement l'édifice à Mahoma Ramí, maître d'œuvre du pape Luna (Benoît XIII). Entre 1687 et 1697, Joseph Bardaxi allongea la nef de deux travées ; la chapelle Santa Ana fut bénie en 1761.","de":"Achten Sie auf den Turm: ein schmuckloser Steinsockel und im zweiten Geschoss achtzackige Ziegelsterne; das vierte Geschoss kam im 16. Jahrhundert hinzu. Das Südportal bewahrt Alabasterwappen, eines davon wird Erzbischof Francisco Clemente Pérez von Zaragoza zugeschrieben, und drei Nischen, deren Figuren verloren sind. Als Baumeister gilt meist Mahoma Ramí, der für Papst Luna (Benedikt XIII.) arbeitete. Zwischen 1687 und 1697 verlängerte Joseph Bardaxi das Schiff um zwei Joche; die Kapelle Santa Ana wurde 1761 geweiht.","pt":"Repare na torre: base de pedra lisa e, no segundo corpo, estrelas de oito pontas em tijolo; o quarto corpo foi acrescentado no século XVI. O portal sul conserva brasões em alabastro, um deles atribuído ao arcebispo de Saragoça Francisco Clemente Pérez, e três nichos que perderam as esculturas. A obra costuma ser atribuída a Mahoma Ramí, mestre de obras do papa Luna. Entre 1687 e 1697, Joseph Bardaxi prolongou a nave em dois tramos, e a capela de Santa Ana foi benzida em 1761."}},{"id":"portal-sanroque","town":"Quinto","cat":"patrimonio","lat":41.42203,"lon":-0.49614,"src":"https://www.campaners.com/php/torrepdf.php?numer=9416","name":{"es":"Portal de San Roque","en":"San Roque gate","fr":"Porte de San Roque","de":"Stadttor San Roque","pt":"Portal de San Roque"},"when":{"es":"Origen medieval · aspecto actual de los siglos XVII–XVIII","en":"Medieval origin · present form 17th–18th century","fr":"Origine médiévale · aspect actuel des XVIIe–XVIIIe siècles","de":"Mittelalterlicher Ursprung · heutige Form 17.–18. Jh.","pt":"Origem medieval · aspeto atual dos séculos XVII–XVIII"},"desc":{"es":"Uno de los tres portales que cerraban Quinto, junto a los de San Antón y San Miguel. Era la salida hacia Alcañiz y sobre el paso tiene una capilla octogonal con linterna y un reloj de sol. Se restauró en 2010.","en":"One of the three gateways into old Quinto, along with those of San Antón and San Miguel. It was the way out towards Alcañiz, and above the passage sits an octagonal chapel with a lantern and a sundial. It was restored in 2010.","fr":"L'une des trois portes qui fermaient Quinto, avec celles de San Antón et de San Miguel. C'était la sortie vers Alcañiz ; au-dessus du passage se trouve une chapelle octogonale à lanterne avec un cadran solaire. Restaurée en 2010.","de":"Eines der drei Tore, die Quinto abschlossen, neben San Antón und San Miguel. Hier ging es nach Alcañiz; über dem Durchgang sitzt eine achteckige Kapelle mit Laterne und Sonnenuhr. 2010 restauriert.","pt":"Um dos três portais que fechavam Quinto, juntamente com os de San Antón e San Miguel. Era a saída para Alcañiz e sobre a passagem tem uma capela octogonal com lanternim e um relógio de sol. Foi restaurado em 2010."},"more":{"es":"La imagen de San Roque ocupa una hornacina semicircular en el muro central de la capilla, y sobre ella está el reloj de sol, acompañado de una inscripción bíblica en latín que viene a decir «mis días son como una sombra que pasa». Desde fuera, la cúpula se ve octogonal, rematada por una linterna de ladrillo. En otros tiempos era el concejo quien fijaba a qué hora se abrían y cerraban sus puertas.","en":"The figure of San Roque stands in a semicircular niche in the chapel's central wall, and above it is the sundial, with a Latin biblical inscription meaning roughly “my days are like a passing shadow”. From outside, the dome reads as an octagon, topped by a brick lantern. In the past the town council decided when its doors were opened and shut.","fr":"La statue de San Roque occupe une niche en hémicycle dans le mur central de la chapelle ; au-dessus se trouve le cadran solaire, accompagné d'une inscription biblique en latin qui signifie à peu près « mes jours sont comme une ombre qui passe ». De l'extérieur, la coupole apparaît octogonale, coiffée d'une lanterne en brique. Autrefois, c'était le conseil municipal qui fixait l'heure d'ouverture et de fermeture des portes.","de":"Die Figur des San Roque steht in einer halbrunden Nische in der Mittelwand der Kapelle; darüber sitzt die Sonnenuhr mit einer lateinischen Bibelinschrift, sinngemäß „meine Tage sind wie ein vorüberziehender Schatten“. Von außen wirkt die Kuppel achteckig, bekrönt von einer Laterne aus Ziegeln. Früher legte der Gemeinderat fest, wann die Tore geöffnet und geschlossen wurden.","pt":"A imagem de San Roque ocupa um nicho semicircular na parede central da capela e, por cima, está o relógio de sol, acompanhado de uma inscrição bíblica em latim que diz mais ou menos «os meus dias são como uma sombra que passa». Vista de fora, a cúpula é octogonal e tem um lanternim de tijolo. Antigamente era o concelho que fixava a hora de abrir e fechar as portas."},"visit":{"es":"Se ve desde la calle en cualquier momento; calcula 10 minutos. Para subir a la capilla, consulta en el Ayuntamiento de Quinto.","en":"Visible from the street at any time; allow 10 minutes. To see the chapel inside, ask at Quinto town hall.","fr":"Visible depuis la rue à tout moment ; comptez 10 minutes. Pour voir la chapelle, renseignez-vous à la mairie de Quinto.","de":"Jederzeit von der Straße aus zu sehen; rechnen Sie mit 10 Minuten. Wer die Kapelle betreten möchte, fragt im Rathaus von Quinto.","pt":"Vê-se da rua a qualquer hora; conte com 10 minutos. Para ver a capela por dentro, informe-se na Câmara Municipal de Quinto."}},{"id":"quinto-camino","town":"Quinto","cat":"camino","lat":41.42496,"lon":-0.4958,"src":"https://www.gronze.com/etapa/escatron/quinto","name":{"es":"Quinto, final de etapa del Camino Jacobeo","en":"Quinto, stage end on the Way of St James","fr":"Quinto, fin d'étape du Chemin de Saint-Jacques","de":"Quinto, Etappenziel am Jakobsweg","pt":"Quinto, fim de etapa do Caminho de Santiago"},"when":{"es":"Plaza de España · etapa Escatrón–Quinto","en":"Plaza de España · Escatrón–Quinto stage","fr":"Plaza de España · étape Escatrón–Quinto","de":"Plaza de España · Etappe Escatrón–Quinto","pt":"Plaza de España · etapa Escatrón–Quinto"},"desc":{"es":"Quinto cierra la etapa que llega desde Escatrón pasando por el Monasterio de Rueda y Gelsa, y abre la siguiente hacia Fuentes de Ebro y Zaragoza. La iglesia parroquial de la plaza la levantó después de la guerra la Dirección General de Regiones Devastadas, con proyecto de 1943.","en":"Quinto ends the stage that arrives from Escatrón via the Monastery of Rueda and Gelsa, and starts the next one towards Fuentes de Ebro and Zaragoza. The parish church on the square was built after the war by the post-war reconstruction agency (Regiones Devastadas), to a 1943 design.","fr":"Quinto clôt l'étape qui arrive d'Escatrón par le monastère de Rueda et Gelsa, et ouvre la suivante vers Fuentes de Ebro et Saragosse. L'église paroissiale de la place a été construite après la guerre par le service de reconstruction Regiones Devastadas, sur un projet de 1943.","de":"Quinto ist Ziel der Etappe von Escatrón über das Kloster Rueda und Gelsa und Ausgangspunkt der nächsten Richtung Fuentes de Ebro und Zaragoza. Die Pfarrkirche am Platz wurde nach dem Krieg vom Wiederaufbauamt Regiones Devastadas nach einem Entwurf von 1943 gebaut.","pt":"Quinto fecha a etapa que chega de Escatrón pelo Mosteiro de Rueda e Gelsa, e abre a seguinte em direção a Fuentes de Ebro e Saragoça. A igreja paroquial da praça foi construída depois da guerra pelo organismo de reconstrução Regiones Devastadas, com projeto de 1943."},"more":{"es":"El proyecto de 1943 es del arquitecto Antonio Chóliz; una década después Eduardo Lagunilla lo modificó porque el agua del subsuelo comprometía la estabilidad del solar. Por eso no tiene torre: en su lugar se levantó una espadaña de tres vanos sobre el hastial. Fíjate en el gran pórtico que ocupa toda la fachada y en las ventanas altas de la nave, dispuestas como una galería renacentista. Desde Gelsa hay 5,8 km y hasta Fuentes de Ebro, 16,6.","en":"The 1943 design was by the architect Antonio Chóliz; ten years later Eduardo Lagunilla revised it because groundwater threatened the stability of the site. That is why there is no tower: a three-opening bell gable was raised on the front instead. Note the large portico running across the whole façade and the upper windows of the nave, set out like a Renaissance gallery. Gelsa is 5.8 km back and Fuentes de Ebro 16.6 km ahead.","fr":"Le projet de 1943 est de l'architecte Antonio Chóliz ; dix ans plus tard, Eduardo Lagunilla le modifia car l'eau du sous-sol menaçait la stabilité du terrain. D'où l'absence de clocher : on éleva à la place un clocher-mur à trois baies sur le pignon. Remarquez le grand portique qui occupe toute la façade et les fenêtres hautes de la nef, disposées comme une galerie Renaissance. Gelsa est à 5,8 km et Fuentes de Ebro à 16,6 km.","de":"Der Entwurf von 1943 stammt vom Architekten Antonio Chóliz; zehn Jahre später änderte ihn Eduardo Lagunilla, weil Grundwasser die Standfestigkeit des Baugrunds gefährdete. Deshalb gibt es keinen Turm, sondern einen Glockengiebel mit drei Öffnungen. Sehenswert sind die große Vorhalle über die ganze Fassade und die hohen Fenster des Schiffs, angeordnet wie eine Renaissance-Galerie. Bis Gelsa sind es 5,8 km zurück, bis Fuentes de Ebro 16,6 km.","pt":"O projeto de 1943 é do arquiteto Antonio Chóliz; uma década depois, Eduardo Lagunilla alterou-o porque a água do subsolo punha em risco a estabilidade do terreno. Por isso não tem torre: em seu lugar ergueu-se uma espadana de três vãos sobre a empena. Repare no grande pórtico que ocupa toda a fachada e nas janelas altas da nave, dispostas como uma galeria renascentista. Gelsa fica a 5,8 km e Fuentes de Ebro a 16,6 km."},"visit":{"es":"La plaza y la fachada se ven libremente. Para entrar en la iglesia, aprovecha el horario de culto o consulta en el Ayuntamiento de Quinto.","en":"The square and façade can be seen freely. To go inside the church, come at service times or ask at Quinto town hall.","fr":"La place et la façade sont visibles librement. Pour entrer dans l'église, venez aux heures des offices ou renseignez-vous à la mairie de Quinto.","de":"Platz und Fassade sind frei zugänglich. Ins Innere kommt man zu den Gottesdienstzeiten; sonst im Rathaus von Quinto nachfragen.","pt":"A praça e a fachada veem-se livremente. Para entrar na igreja, aproveite o horário das missas ou informe-se na Câmara Municipal de Quinto."}},{"id":"purburel","town":"Quinto","cat":"memoria","lat":41.41049,"lon":-0.48898,"src":"https://quinto.es/tu-municipio/trincheras","name":{"es":"Trincheras del Purburel","en":"Purburel trenches","fr":"Tranchées du Purburel","de":"Schützengräben am Purburel","pt":"Trincheiras do Purburel"},"when":{"es":"Batalla de Quinto · 24–26 de agosto de 1937","en":"Battle of Quinto · 24–26 August 1937","fr":"Bataille de Quinto · 24–26 août 1937","de":"Schlacht von Quinto · 24.–26. August 1937","pt":"Batalha de Quinto · 24–26 de agosto de 1937"},"desc":{"es":"Era la posición más fortificada del bando sublevado en Quinto: alambradas, nidos de ametralladora y unos 250 metros de trinchera. Entre el 24 y el 26 de agosto de 1937 la atacaron las Brigadas Internacionales XI y XV, y el Batallón Británico asaltó el cerro el día 25. Hoy el recorrido está señalizado y tiene paneles.","en":"This was the most heavily fortified Nationalist position at Quinto: barbed wire, machine-gun nests and some 250 metres of trench. Between 24 and 26 August 1937 it was attacked by the XI and XV International Brigades, and the British Battalion stormed the hill on the 25th. Today the site is signposted with information panels.","fr":"C'était la position la plus fortifiée du camp nationaliste à Quinto : barbelés, nids de mitrailleuses et quelque 250 mètres de tranchée. Du 24 au 26 août 1937, les XIe et XVe Brigades internationales l'attaquèrent, et le bataillon britannique prit d'assaut la colline le 25. Le site est aujourd'hui balisé et doté de panneaux.","de":"Die am stärksten befestigte Stellung der Aufständischen in Quinto: Stacheldraht, MG-Nester und rund 250 Meter Schützengraben. Vom 24. bis 26. August 1937 griffen die XI. und XV. Internationalen Brigaden an, am 25. stürmte das Britische Bataillon den Hügel. Heute ist der Ort ausgeschildert und mit Tafeln versehen.","pt":"Era a posição mais fortificada do lado sublevado em Quinto: arame farpado, ninhos de metralhadora e cerca de 250 metros de trincheira. Entre 24 e 26 de agosto de 1937 foi atacada pelas Brigadas Internacionais XI e XV, e o Batalhão Britânico assaltou a colina no dia 25. Hoje o percurso está sinalizado e tem painéis."},"visit":{"es":"Acceso libre; está a unos 4,5 km del pueblo por pista, y el tramo de trinchera son 250 m a pie. Visitas guiadas con reserva en momiasdequinto.es.","en":"Open access; it lies about 4.5 km from the village along a dirt track, and the trench section is 250 m on foot. Guided visits bookable at momiasdequinto.es.","fr":"Accès libre ; le site est à environ 4,5 km du village par une piste, et le tronçon de tranchée fait 250 m à pied. Visites guidées sur réservation via momiasdequinto.es.","de":"Frei zugänglich; rund 4,5 km vom Ort über eine Piste, der Grabenabschnitt ist 250 m lang und wird zu Fuß begangen. Führungen buchbar über momiasdequinto.es.","pt":"Acesso livre; fica a cerca de 4,5 km da vila por estradão, e o troço de trincheira são 250 m a pé. Visitas guiadas com reserva em momiasdequinto.es."},"more":{"es":"En el recorrido se distinguen tramos de trinchera, pozos de tirador, refugios y un puesto de observación que pudo servir de nido de ametralladora. La posición incluía una obra de hormigón y acero que batía la carretera de Azaila, y recibía agua potable por una tubería desde el pueblo, que quedó cortada durante los combates. Los últimos defensores del Purburel no se rindieron hasta hacia las cuatro y media de la tarde del 26 de agosto.","en":"Along the route you can make out stretches of trench, rifle pits, shelters and an observation post that may also have served as a machine-gun nest. The position included a concrete-and-steel emplacement covering the Azaila road, and drinking water came up by pipe from the village; the supply was cut during the fighting. The last defenders of Purburel did not surrender until about half past four on the afternoon of 26 August.","fr":"Le long du parcours, on distingue des tronçons de tranchée, des trous de tirailleur, des abris et un poste d'observation qui a pu servir de nid de mitrailleuse. La position comprenait un ouvrage en béton et acier qui battait la route d'Azaila, et l'eau potable arrivait du village par une conduite, coupée pendant les combats. Les derniers défenseurs du Purburel ne se rendirent que vers 16 h 30 le 26 août.","de":"Entlang des Weges erkennt man Grabenabschnitte, Schützenlöcher, Unterstände und einen Beobachtungsposten, der wohl auch als MG-Nest diente. Zur Stellung gehörte ein Werk aus Beton und Stahl, das die Straße nach Azaila bestrich; Trinkwasser kam per Leitung aus dem Ort und wurde während der Kämpfe unterbrochen. Die letzten Verteidiger des Purburel ergaben sich erst gegen 16:30 Uhr am 26. August.","pt":"No percurso distinguem-se troços de trincheira, abrigos individuais de atirador, refúgios e um posto de observação que pode ter servido de ninho de metralhadora. A posição incluía uma obra de betão e aço que batia a estrada de Azaila, e a água potável chegava da vila por uma conduta, cortada durante os combates. Os últimos defensores do Purburel só se renderam por volta das quatro e meia da tarde de 26 de agosto."}},{"id":"cabezo-nariz","town":"Quinto","cat":"memoria","lat":41.41394,"lon":-0.49224,"src":"https://quintodeebro.com/guerra/guia_visita.pdf","name":{"es":"Cabezo de la Nariz","en":"Cabezo de la Nariz hill","fr":"Colline Cabezo de la Nariz","de":"Hügel Cabezo de la Nariz","pt":"Cabezo de la Nariz"},"when":{"es":"26 de agosto de 1937, 18:30","en":"26 August 1937, 6.30 pm","fr":"26 août 1937, 18 h 30","de":"26. August 1937, 18:30 Uhr","pt":"26 de agosto de 1937, 18h30"},"desc":{"es":"Último punto que resistió en la batalla de Quinto. Tras las primeras rendiciones de la tarde, las tropas republicanas lo tomaron hacia las seis y media del 26 de agosto de 1937, y con él terminó la lucha por el pueblo.","en":"The last point to hold out in the Battle of Quinto. After the first surrenders that afternoon, Republican troops took it at around half past six on 26 August 1937, ending the fight for the village.","fr":"Dernier point à résister lors de la bataille de Quinto. Après les premières redditions de l'après-midi, les troupes républicaines le prirent vers 18 h 30 le 26 août 1937, mettant fin aux combats pour le village.","de":"Der letzte Punkt, der in der Schlacht von Quinto standhielt. Nach den ersten Kapitulationen am Nachmittag nahmen republikanische Truppen ihn am 26. August 1937 gegen 18:30 Uhr ein; damit endete der Kampf um den Ort.","pt":"O último ponto a resistir na batalha de Quinto. Depois das primeiras rendições da tarde, as tropas republicanas tomaram-no por volta das seis e meia de 26 de agosto de 1937, pondo fim à luta pela vila."},"more":{"es":"El cabezo formaba, con el cerro de Balar y el Purburel, la llamada Posición n.º 1, la más extensa y fortificada del triángulo defensivo de Quinto, con unos 650 defensores según las estimaciones. Las fuentes en inglés llaman «Purburel Hill» a todo este conjunto. Cayó dos horas después de que se rindieran los últimos defensores del Purburel.","en":"Together with Balar hill and Purburel, this hill made up what is known as Position No. 1, the largest and most heavily fortified corner of Quinto's defensive triangle, with an estimated 650 defenders. English-language sources call the whole complex “Purburel Hill”. It fell two hours after the last defenders of Purburel surrendered.","fr":"Avec la colline de Balar et le Purburel, ce mamelon formait la Position n° 1, la plus étendue et la plus fortifiée du triangle défensif de Quinto, tenue selon les estimations par quelque 650 hommes. Les sources anglophones appellent l'ensemble « Purburel Hill ». Il tomba deux heures après la reddition des derniers défenseurs du Purburel.","de":"Zusammen mit dem Hügel Balar und dem Purburel bildete er die sogenannte Stellung Nr. 1, den ausgedehntesten und am stärksten befestigten Teil des Verteidigungsdreiecks von Quinto, nach Schätzungen mit rund 650 Verteidigern. Englischsprachige Quellen nennen das Ganze „Purburel Hill“. Er fiel zwei Stunden nach der Kapitulation der letzten Verteidiger des Purburel.","pt":"Juntamente com o cerro de Balar e o Purburel, este cabeço formava a chamada Posição n.º 1, a mais extensa e fortificada do triângulo defensivo de Quinto, com cerca de 650 defensores segundo as estimativas. As fontes em inglês chamam «Purburel Hill» a todo o conjunto. Caiu duas horas depois de se renderem os últimos defensores do Purburel."},"visit":{"es":"Terreno abierto, junto a las trincheras del Purburel: desde Quinto, sal por la carretera de Castellón hacia Alcañiz y sube la «revueltilla» hasta el llano. No hay servicios; lleva agua y calzado de campo.","en":"Open ground next to the Purburel trenches: from Quinto, take the Castellón road towards Alcañiz and climb the winding “revueltilla” up to the plateau. There are no facilities; bring water and sturdy shoes.","fr":"Terrain ouvert, à côté des tranchées du Purburel : depuis Quinto, prenez la route de Castellón vers Alcañiz et montez la « revueltilla » jusqu'au plateau. Aucun service sur place ; prévoyez de l'eau et de bonnes chaussures.","de":"Offenes Gelände neben den Gräben am Purburel: von Quinto über die Straße nach Castellón Richtung Alcañiz und die Serpentine „revueltilla“ hinauf zur Hochebene. Keine Einrichtungen vor Ort; Wasser und festes Schuhwerk mitnehmen.","pt":"Terreno aberto, junto às trincheiras do Purburel: a partir de Quinto, siga pela estrada de Castellón em direção a Alcañiz e suba a «revueltilla» até ao planalto. Não há serviços; leve água e calçado próprio."}},{"id":"bonastre","town":"Quinto","cat":"patrimonio","lat":41.46836,"lon":-0.55181,"src":"https://www.quintodeebro.com/web/docs/quinto-ermitas.pdf","name":{"es":"Ermita de Nuestra Señora de Bonastre","en":"Chapel of Our Lady of Bonastre","fr":"Chapelle Notre-Dame de Bonastre","de":"Kapelle Nuestra Señora de Bonastre","pt":"Ermida de Nossa Senhora de Bonastre"},"when":{"es":"Reconstruida en 1847 · romería el Lunes de Pascua","en":"Rebuilt 1847 · pilgrimage on Easter Monday","fr":"Reconstruit en 1847 · pèlerinage le lundi de Pâques","de":"1847 wiederaufgebaut · Wallfahrt am Ostermontag","pt":"Reconstruída em 1847 · romaria na Segunda-feira de Páscoa"},"desc":{"es":"Ermita junto a la N-232, a unos 7 km de Quinto hacia Zaragoza. Una inscripción recuerda su reconstrucción en 1847. En 1937 fue una de las posiciones defensivas y tras la Guerra Civil volvió a reconstruirse. Cada Lunes de Pascua el pueblo sube en romería.","en":"A chapel beside the N-232, about 7 km from Quinto towards Zaragoza. An inscription records its rebuilding in 1847. In 1937 it was one of the defensive positions, and it was rebuilt again after the Civil War. Every Easter Monday the village walks here on pilgrimage.","fr":"Chapelle au bord de la N-232, à environ 7 km de Quinto vers Saragosse. Une inscription rappelle sa reconstruction de 1847 ; en 1937, elle servit de position défensive et fut de nouveau relevée après la guerre civile. Chaque lundi de Pâques, le village y monte en pèlerinage.","de":"Kapelle an der N-232, etwa 7 km von Quinto Richtung Zaragoza. Eine Inschrift erinnert an den Wiederaufbau 1847; nach dem Bürgerkrieg, in dem sie 1937 eine Verteidigungsstellung war, wurde sie erneut aufgebaut. Jeden Ostermontag pilgert der Ort hierher.","pt":"Ermida junto à N-232, a cerca de 7 km de Quinto em direção a Saragoça. Uma inscrição recorda a reconstrução de 1847. Em 1937 foi uma das posições defensivas e voltou a ser reconstruída depois da Guerra Civil. Todas as Segundas-feiras de Páscoa a vila sobe em romaria."},"more":{"es":"La piedra con la inscripción «A expensas de los vecinos de Quinto 1847» está en el centro del antiguo crucero. El atrio, abierto por tres lados con arcos de medio punto, y la fachada son de ladrillo, y a los pies una torrecilla semicircular guarda la escalera de caracol al coro. Según la leyenda, un pastor halló aquí la imagen y, cuando la llevaron al pueblo, volvió sola al cerro; en 1739 Faci describía una talla de madera de unos tres palmos, la Virgen con el Niño y un pastorcillo a sus pies.","en":"The stone inscribed “A expensas de los vecinos de Quinto 1847” (at the expense of the people of Quinto) sits at the centre of the former crossing. The porch, open on three sides with round arches, and the façade are brick, and at the west end a small semicircular tower holds the spiral stair to the choir. Legend says a shepherd found the statue here and, when it was taken to the village, it returned to the hill on its own; in 1739 the chronicler Faci described a wooden carving about three spans high, the Virgin and Child with a little shepherd at her feet.","fr":"La pierre portant l'inscription « A expensas de los vecinos de Quinto 1847 » (aux frais des habitants de Quinto) se trouve au centre de l'ancienne croisée. Le porche, ouvert sur trois côtés par des arcs en plein cintre, et la façade sont en brique ; à l'ouest, une tourelle semi-circulaire abrite l'escalier en colimaçon menant à la tribune. Selon la légende, un berger trouva ici la statue qui, emportée au village, revint seule sur la colline ; en 1739, Faci décrivait une sculpture en bois d'environ trois empans, la Vierge à l'Enfant avec un petit berger à ses pieds.","de":"Der Stein mit der Inschrift „A expensas de los vecinos de Quinto 1847“ (auf Kosten der Bewohner von Quinto) liegt in der Mitte der früheren Vierung. Die an drei Seiten mit Rundbögen geöffnete Vorhalle und die Fassade sind aus Ziegel; im Westen birgt ein kleiner Halbrundturm die Wendeltreppe zur Empore. Der Legende nach fand ein Hirte hier das Bildnis, das, ins Dorf gebracht, von selbst auf den Hügel zurückkehrte; 1739 beschrieb der Chronist Faci eine etwa drei Spannen hohe Holzfigur der Muttergottes mit Kind und einem Hirtenknaben zu ihren Füßen.","pt":"A pedra com a inscrição «A expensas de los vecinos de Quinto 1847» (a expensas dos moradores de Quinto) está no centro do antigo cruzeiro. O átrio, aberto em três lados com arcos de volta perfeita, e a fachada são de tijolo, e na parte de trás uma pequena torre semicircular guarda a escada em caracol para o coro. Diz a lenda que um pastor encontrou aqui a imagem e que, levada para a vila, voltou sozinha à colina; em 1739, Faci descrevia uma talha de madeira de uns três palmos, a Virgem com o Menino e um pastorinho aos pés."},"visit":{"es":"Exterior visible en todo momento, a pie de la N-232; ojo con el tráfico al aparcar. Para ver el interior fuera de la romería, consulta en el Ayuntamiento de Quinto.","en":"The exterior can be seen at any time, right by the N-232; take care with traffic when parking. To see inside outside the pilgrimage day, ask at Quinto town hall.","fr":"Extérieur visible à tout moment, au bord de la N-232 ; attention à la circulation en vous garant. Pour voir l'intérieur en dehors du pèlerinage, renseignez-vous à la mairie de Quinto.","de":"Von außen jederzeit zu sehen, direkt an der N-232; beim Parken auf den Verkehr achten. Wer außerhalb der Wallfahrt hinein möchte, fragt im Rathaus von Quinto.","pt":"Exterior visível a qualquer hora, junto à N-232; cuidado com o trânsito ao estacionar. Para ver o interior fora da romaria, informe-se na Câmara Municipal de Quinto."}},{"id":"pina-convento","town":"Pina de Ebro","cat":"patrimonio","lat":41.48732,"lon":-0.53108,"src":"https://pilgrimaps.com/franciscan-convent-of-pina","name":{"es":"Antiguo convento franciscano de Pina","en":"Former Franciscan friary of Pina","fr":"Ancien couvent franciscain de Pina","de":"Ehemaliges Franziskanerkloster von Pina","pt":"Antigo convento franciscano de Pina"},"when":{"es":"1530–1539 · claustro gótico y renacentista","en":"1530–1539 · Gothic and Renaissance cloister","fr":"1530–1539 · cloître gothique et Renaissance","de":"1530–1539 · Kreuzgang aus Gotik und Renaissance","pt":"1530–1539 · claustro gótico e renascentista"},"desc":{"es":"Convento construido entre 1530 y 1539 bajo el patrocinio de los condes de Sástago, sobre un templo mudéjar anterior que se reformó en estilo barroco en el siglo XVIII. Su claustro mezcla el gótico levantino con el renacimiento aragonés. Es la parroquia de Pina desde 1939, porque la de Santa María quedó arruinada en la guerra.","en":"A friary built between 1530 and 1539 under the patronage of the Counts of Sástago, over an earlier Mudéjar church remodelled in Baroque style in the 18th century. Its cloister blends Valencian-style Gothic with Aragonese Renaissance. It has been Pina's parish church since 1939, after the church of Santa María was left in ruins in the war.","fr":"Couvent fondé entre 1530 et 1539 sous le patronage des comtes de Sástago, sur une église mudéjare antérieure remaniée en style baroque au XVIIIe siècle. Son cloître mêle gothique levantin et Renaissance aragonaise. C'est l'église paroissiale de Pina depuis 1939, celle de Santa María ayant été ruinée pendant la guerre.","de":"Zwischen 1530 und 1539 unter dem Patronat der Grafen von Sástago gegründet, über einer älteren Mudéjar-Kirche, die im 18. Jahrhundert barock umgestaltet wurde. Der Kreuzgang verbindet levantinische Gotik mit aragonesischer Renaissance. Seit 1939 Pfarrkirche von Pina, da Santa María im Krieg zerstört wurde.","pt":"Convento fundado entre 1530 e 1539 sob o patrocínio dos condes de Sástago, sobre um templo mudéjar anterior reformado em estilo barroco no século XVIII. O claustro mistura o gótico levantino com o renascimento aragonês. É a igreja matriz de Pina desde 1939, porque a de Santa María ficou em ruínas na guerra."},"more":{"es":"La iglesia está dedicada a Santa María la Mayor, y el convento se fundó bajo el patrocinio de Blasco de Alagón, primer conde de Sástago. El claustro, de planta cuadrada, tiene dos pisos de galerías de ladrillo con arcos de medio punto en torno a un patio. La restauración iniciada en 1985 recuperó el claustro, la sacristía y la capilla de la Virgen.","en":"The church is dedicated to Santa María la Mayor, and the friary was founded under the patronage of Blasco de Alagón, first Count of Sástago. The square cloister has two storeys of brick galleries with round arches around a courtyard. Restoration work begun in 1985 brought back the cloister, the sacristy and the Lady chapel.","fr":"L'église est dédiée à Santa María la Mayor, et le couvent fut fondé sous le patronage de Blasco de Alagón, premier comte de Sástago. Le cloître, de plan carré, compte deux étages de galeries en brique à arcs en plein cintre autour d'une cour. La restauration entamée en 1985 a permis de récupérer le cloître, la sacristie et la chapelle de la Vierge.","de":"Die Kirche ist Santa María la Mayor geweiht; gegründet wurde das Kloster unter dem Patronat von Blasco de Alagón, dem ersten Grafen von Sástago. Der quadratische Kreuzgang hat zwei Geschosse mit Ziegelgalerien und Rundbögen um einen Innenhof. Die 1985 begonnene Restaurierung stellte Kreuzgang, Sakristei und Marienkapelle wieder her.","pt":"A igreja é dedicada a Santa María la Mayor, e o convento foi fundado sob o patrocínio de Blasco de Alagón, primeiro conde de Sástago. O claustro, de planta quadrada, tem dois pisos de galerias de tijolo com arcos de volta perfeita à volta de um pátio. O restauro iniciado em 1985 recuperou o claustro, a sacristia e a capela da Virgem."},"visit":{"es":"Está en la calle de la Iglesia, junto a la plaza Mayor. Al ser la parroquia, se puede entrar en horario de culto; para ver el claustro, consulta en el Ayuntamiento de Pina de Ebro.","en":"It stands on Calle de la Iglesia, by the Plaza Mayor. As the parish church it is open at service times; to see the cloister, ask at Pina de Ebro town hall.","fr":"Il se trouve calle de la Iglesia, près de la Plaza Mayor. Étant l'église paroissiale, on peut y entrer aux heures des offices ; pour voir le cloître, renseignez-vous à la mairie de Pina de Ebro.","de":"Es liegt in der Calle de la Iglesia an der Plaza Mayor. Als Pfarrkirche ist es zu den Gottesdienstzeiten zugänglich; für den Kreuzgang im Rathaus von Pina de Ebro nachfragen.","pt":"Fica na Calle de la Iglesia, junto à Plaza Mayor. Sendo a igreja matriz, pode entrar-se no horário das missas; para ver o claustro, informe-se na Câmara Municipal de Pina de Ebro."}},{"id":"pina-durruti","town":"Pina de Ebro","cat":"memoria","lat":41.48896,"lon":-0.52602,"src":"https://es.hispanopedia.com/wiki/Pina_de_Ebro","name":{"es":"Pina en el frente de 1936","en":"Pina on the 1936 front line","fr":"Pina sur le front de 1936","de":"Pina an der Front von 1936","pt":"Pina na frente de 1936"},"when":{"es":"Verano de 1936 · Columna Durruti","en":"Summer 1936 · Durruti Column","fr":"Été 1936 · colonne Durruti","de":"Sommer 1936 · Kolonne Durruti","pt":"Verão de 1936 · Coluna Durruti"},"desc":{"es":"La columna anarquista de Buenaventura Durruti salió de Barcelona el 24 de julio de 1936 y avanzó por Lérida y los Monegros hacia Zaragoza hasta quedar atrincherada en Pina, con su cuartel general en Bujaraloz. De la vieja parroquia de Santa María, destruida en la guerra, solo queda la Torre Vieja, hoy símbolo del pueblo.","en":"Buenaventura Durruti's anarchist column left Barcelona on 24 July 1936 and advanced through Lleida and the Monegros towards Zaragoza until it dug in at Pina, with its headquarters at Bujaraloz. Of the old parish church of Santa María, destroyed in the war, only the Torre Vieja (Old Tower) remains, now the village's emblem.","fr":"La colonne anarchiste de Buenaventura Durruti quitta Barcelone le 24 juillet 1936 et avança par Lérida et les Monegros vers Saragosse jusqu'à se retrancher à Pina, avec son quartier général à Bujaraloz. De l'ancienne église Santa María, détruite pendant la guerre, il ne reste que la Torre Vieja, aujourd'hui emblème du village.","de":"Die anarchistische Kolonne von Buenaventura Durruti verließ Barcelona am 24. Juli 1936 und zog über Lleida und die Monegros Richtung Zaragoza, bis sie sich in Pina eingrub; ihr Hauptquartier lag in Bujaraloz. Von der im Krieg zerstörten alten Pfarrkirche Santa María blieb nur die Torre Vieja (Alter Turm), heute Wahrzeichen des Ortes.","pt":"A coluna anarquista de Buenaventura Durruti saiu de Barcelona a 24 de julho de 1936 e avançou por Lérida e pelos Monegros em direção a Saragoça até ficar entrincheirada em Pina, com o quartel-general em Bujaraloz. Da antiga igreja matriz de Santa María, destruída na guerra, só resta a Torre Vieja, hoje símbolo da vila."},"more":{"es":"La Torre Vieja, restaurada a finales del siglo XX, es de ladrillo sobre un zócalo bajo de dos hiladas de sillar; tiene cuatro cuerpos cuadrados y el último, con las esquinas achaflanadas, acaba en un remate piramidal con chapitel. En Pina la columna formó un comité de defensa, incautó las propiedades de los derechistas y destruyó el registro de la propiedad. La filósofa Simone Weil, que se unió a la columna, dejó escrito el fusilamiento de un joven falangista del pueblo.","en":"The Torre Vieja, restored in the late 20th century, is built of brick on a low base of two courses of dressed stone; it has four square stages, the top one with chamfered corners and a pyramidal cap and spire. In Pina the column set up a defence committee, seized the property of right-wingers and destroyed the land registry. The philosopher Simone Weil, who joined the column, wrote about the execution of a young Falangist from the village.","fr":"La Torre Vieja, restaurée à la fin du XXe siècle, est en brique sur un soubassement bas de deux assises de pierre de taille ; elle compte quatre niveaux carrés, le dernier aux angles chanfreinés, couronné d'un toit pyramidal et d'une flèche. À Pina, la colonne créa un comité de défense, saisit les biens des partisans du soulèvement et détruisit le registre foncier. La philosophe Simone Weil, engagée dans la colonne, a laissé un récit de l'exécution d'un jeune phalangiste du village.","de":"Die Ende des 20. Jahrhunderts restaurierte Torre Vieja ist aus Ziegeln auf einem niedrigen Sockel aus zwei Lagen Quadersteinen gebaut; sie hat vier quadratische Geschosse, das oberste mit abgeschrägten Ecken, und endet in einem Pyramidendach mit Helmspitze. In Pina bildete die Kolonne ein Verteidigungskomitee, beschlagnahmte den Besitz von Anhängern der Rechten und vernichtete das Grundbuch. Die Philosophin Simone Weil, die sich der Kolonne anschloss, schrieb über die Erschießung eines jungen Falangisten aus dem Ort.","pt":"A Torre Vieja, restaurada no final do século XX, é de tijolo sobre um soco baixo de duas fiadas de cantaria; tem quatro corpos quadrados e o último, de cantos chanfrados, termina num remate piramidal com coruchéu. Em Pina, a coluna formou um comité de defesa, confiscou os bens dos simpatizantes da direita e destruiu o registo predial. A filósofa Simone Weil, que se juntou à coluna, deixou escrito o fuzilamento de um jovem falangista da vila."},"visit":{"es":"La Torre Vieja se ve desde la calle en cualquier momento; calcula 15 minutos. Para conocer más sobre la guerra en Pina, consulta en el Ayuntamiento.","en":"The Torre Vieja can be seen from the street at any time; allow 15 minutes. For more on the war in Pina, ask at the town hall.","fr":"La Torre Vieja est visible depuis la rue à tout moment ; comptez 15 minutes. Pour en savoir plus sur la guerre à Pina, adressez-vous à la mairie.","de":"Die Torre Vieja ist jederzeit von der Straße aus zu sehen; rechnen Sie mit 15 Minuten. Mehr zur Kriegsgeschichte von Pina erfährt man im Rathaus.","pt":"A Torre Vieja vê-se da rua a qualquer hora; conte com 15 minutos. Para saber mais sobre a guerra em Pina, informe-se na Câmara Municipal."}},{"id":"pina-sangregorio","town":"Pina de Ebro","cat":"patrimonio","lat":41.50013,"lon":-0.49235,"src":"https://www.komoot.com/highlight/8155275","name":{"es":"Ermita de San Gregorio","en":"Chapel of St Gregory","fr":"Chapelle Saint-Grégoire","de":"Kapelle San Gregorio","pt":"Ermida de São Gregório"},"when":{"es":"Siglo XVII · romería el 9 de mayo","en":"17th century · pilgrimage on 9 May","fr":"XVIIe siècle · pèlerinage le 9 mai","de":"17. Jh. · Wallfahrt am 9. Mai","pt":"Século XVII · romaria a 9 de maio"},"desc":{"es":"Ermita de una nave del siglo XVII en un alto a unos 3 km de Pina, camino de Monegros. Desde allí se ve el valle del Ebro a un lado y la estepa de Monegros al otro. La romería se celebra el 9 de mayo.","en":"A single-nave 17th-century chapel on a rise about 3 km from Pina, on the road to Monegros. From up here you see the Ebro valley on one side and the Monegros steppe on the other. The pilgrimage takes place on 9 May.","fr":"Chapelle à nef unique du XVIIe siècle, sur une hauteur à environ 3 km de Pina, en direction des Monegros. On y voit d'un côté la vallée de l'Èbre, de l'autre la steppe des Monegros. Le pèlerinage a lieu le 9 mai.","de":"Einschiffige Kapelle aus dem 17. Jahrhundert auf einer Anhöhe rund 3 km von Pina Richtung Monegros. Auf der einen Seite das Ebrotal, auf der anderen die Steppe der Monegros. Die Wallfahrt findet am 9. Mai statt.","pt":"Ermida de nave única do século XVII num alto a cerca de 3 km de Pina, a caminho de Monegros. Dali vê-se o vale do Ebro de um lado e a estepe de Monegros do outro. A romaria celebra-se a 9 de maio."},"more":{"es":"San Gregorio es el segundo patrón de Pina, y tradicionalmente se le pedía que bendijera las cosechas y trajera la lluvia. El día de la romería el pueblo sube a la ermita con carrozas engalanadas.","en":"St Gregory is Pina's second patron saint, traditionally asked to bless the crops and bring rain. On the pilgrimage day the village goes up to the chapel with decorated floats.","fr":"Saint Grégoire est le second patron de Pina ; on lui demandait traditionnellement de bénir les récoltes et d'apporter la pluie. Le jour du pèlerinage, le village monte à la chapelle avec des chars décorés.","de":"San Gregorio ist der zweite Schutzpatron von Pina; traditionell bat man ihn um Segen für die Ernte und um Regen. Am Wallfahrtstag zieht der Ort mit geschmückten Wagen zur Kapelle hinauf.","pt":"São Gregório é o segundo padroeiro de Pina, a quem tradicionalmente se pedia que abençoasse as colheitas e trouxesse a chuva. No dia da romaria, a vila sobe à ermida com carros enfeitados."},"visit":{"es":"El entorno y las vistas son de acceso libre, a unos 3 km del pueblo. Para ver el interior, consulta en el Ayuntamiento de Pina de Ebro.","en":"The surroundings and views are freely accessible, about 3 km from the village. To see inside, ask at Pina de Ebro town hall.","fr":"Les abords et le panorama sont en accès libre, à environ 3 km du village. Pour voir l'intérieur, renseignez-vous à la mairie de Pina de Ebro.","de":"Umgebung und Aussicht sind frei zugänglich, etwa 3 km vom Ort entfernt. Für einen Blick ins Innere im Rathaus von Pina de Ebro nachfragen.","pt":"O espaço envolvente e as vistas são de acesso livre, a cerca de 3 km da vila. Para ver o interior, informe-se na Câmara Municipal de Pina de Ebro."}},{"id":"pina-sotos","town":"Pina de Ebro","cat":"naturaleza","lat":41.46439,"lon":-0.49761,"src":"https://www.mapa.gob.es/en/desarrollo-rural/temas/caminos-naturales/caminos-naturales/sector-noreste/ebro/etapa27/default.aspx","name":{"es":"Sotos y azud de Pina","en":"Pina riverside woods and weir","fr":"Bois riverains et barrage de Pina","de":"Auwälder und Wehr von Pina","pt":"Matas ribeirinhas e açude de Pina"},"when":{"es":"Camino Natural del Ebro (GR 99) · azud de 1910","en":"Ebro Nature Trail (GR 99) · weir of 1910","fr":"Chemin naturel de l'Èbre (GR 99) · barrage de 1910","de":"Ebro-Naturweg (GR 99) · Wehr von 1910","pt":"Caminho Natural do Ebro (GR 99) · açude de 1910"},"desc":{"es":"El Camino Natural del Ebro recorre aquí los sotos de ribera y pasa junto al azud de Pina, de 1910, que riega más de 4.000 hectáreas. En la isla de Pina anida una gran colonia de avión zapador, y aguas abajo el sendero sigue por la Mejana de los Nidos y el meandro de Belloque.","en":"Here the Ebro Nature Trail runs through the riverside woods and passes the Pina weir, built in 1910, which irrigates more than 4,000 hectares. A large colony of sand martins nests on the island of Pina, and downstream the path continues past the Mejana de los Nidos and the Belloque meander.","fr":"Le Chemin naturel de l'Èbre traverse ici les bois riverains et longe le barrage de Pina, de 1910, qui irrigue plus de 4 000 hectares. Une grande colonie d'hirondelles de rivage niche sur l'île de Pina, et en aval le sentier continue par la Mejana de los Nidos et le méandre de Belloque.","de":"Der Ebro-Naturweg führt hier durch die Auwälder und am Wehr von Pina aus dem Jahr 1910 vorbei, das mehr als 4.000 Hektar bewässert. Auf der Insel von Pina brütet eine große Uferschwalbenkolonie; flussabwärts geht es weiter zur Mejana de los Nidos und zur Belloque-Schleife.","pt":"O Caminho Natural do Ebro percorre aqui as matas ribeirinhas e passa junto ao açude de Pina, de 1910, que rega mais de 4.000 hectares. Na ilha de Pina nidifica uma grande colónia de andorinhas-das-barreiras, e a jusante o trilho segue pela Mejana de los Nidos e o meandro de Belloque."},"more":{"es":"El azud alimenta las acequias de Pina y de Quinto, a ambos lados del río. Los aviones zapadores excavan en los taludes de tierra galerías de medio metro a un metro que terminan en una cámara forrada de plumas, y una colonia puede reunir cientos de nidos. Pasado el meandro de Belloque, junto a la casa Aznárez, una terraza permite asomarse a la punta del meandro.","en":"The weir feeds the irrigation channels of Pina and Quinto on both sides of the river. Sand martins dig tunnels half a metre to a metre long into earth banks, ending in a feather-lined chamber, and a single colony can hold hundreds of nests. By the Belloque meander, near the Casa Aznárez farmhouse, a terrace looks out over the tip of the bend.","fr":"Le barrage alimente les canaux d'irrigation de Pina et de Quinto, sur les deux rives. Les hirondelles de rivage creusent dans les berges de terre des galeries de 50 cm à 1 m qui se terminent par une chambre tapissée de plumes ; une colonie peut compter des centaines de nids. Au méandre de Belloque, près de la ferme Casa Aznárez, une terrasse offre une vue sur la pointe de la boucle.","de":"Das Wehr speist die Bewässerungskanäle von Pina und Quinto auf beiden Flussseiten. Uferschwalben graben in Erdböschungen einen halben bis einen Meter lange Röhren, die in einer mit Federn ausgelegten Kammer enden; eine Kolonie kann Hunderte Nester umfassen. An der Belloque-Schleife, beim Gehöft Casa Aznárez, bietet eine Terrasse Blick auf die Spitze der Flussschleife.","pt":"O açude alimenta as levadas de Pina e de Quinto, nas duas margens do rio. As andorinhas-das-barreiras escavam nos taludes de terra galerias de meio metro a um metro, que terminam numa câmara forrada de penas, e uma colónia pode juntar centenas de ninhos. No meandro de Belloque, junto à Casa Aznárez, um terraço permite espreitar a ponta da curva."},"visit":{"es":"Acceso libre a pie o en bici. Desde la plaza Mayor de Pina sale la etapa del Camino Natural del Ebro hacia Gelsa y Velilla (20,1 km, unas 4 horas); para un paseo corto basta con acercarse al río.","en":"Open access on foot or by bike. The Ebro Nature Trail stage to Gelsa and Velilla starts from Pina's Plaza Mayor (20.1 km, about 4 hours); for a short walk, just head down to the river.","fr":"Accès libre à pied ou à vélo. L'étape du Chemin naturel de l'Èbre vers Gelsa et Velilla part de la Plaza Mayor de Pina (20,1 km, environ 4 heures) ; pour une courte balade, il suffit de descendre vers le fleuve.","de":"Frei zugänglich zu Fuß oder mit dem Rad. Von der Plaza Mayor in Pina startet die Etappe des Ebro-Naturwegs nach Gelsa und Velilla (20,1 km, etwa 4 Stunden); für einen kurzen Spaziergang genügt der Weg hinunter zum Fluss.","pt":"Acesso livre a pé ou de bicicleta. Da Plaza Mayor de Pina parte a etapa do Caminho Natural do Ebro até Gelsa e Velilla (20,1 km, cerca de 4 horas); para um passeio curto, basta descer até ao rio."}},{"id":"gelsa-sanpedro","town":"Gelsa","cat":"patrimonio","lat":41.40673,"lon":-0.46212,"src":"https://es.wikipedia.org/wiki/Gelsa","name":{"es":"Iglesia de San Pedro Apóstol","en":"Church of St Peter the Apostle","fr":"Église Saint-Pierre-Apôtre","de":"Kirche San Pedro Apóstol","pt":"Igreja de São Pedro Apóstolo"},"when":{"es":"Último tercio del siglo XVII · torre de 1826","en":"Late 17th century · tower of 1826","fr":"Fin du XVIIe siècle · clocher de 1826","de":"Spätes 17. Jh. · Turm von 1826","pt":"Último terço do século XVII · torre de 1826"},"desc":{"es":"Se levantó a finales del siglo XVII aprovechando los muros de una antigua mezquita y se reformó en 1863. Tiene tres naves, crucero con cúpula y una torre de 1826. Guarda el relicario de la Santa Espina.","en":"Built in the late 17th century on the walls of a former mosque and remodelled in 1863. It has a nave and two aisles, a domed crossing and a tower of 1826. It keeps the reliquary of the Holy Thorn.","fr":"Élevée à la fin du XVIIe siècle sur les murs d'une ancienne mosquée et remaniée en 1863. Elle compte trois nefs, une croisée à coupole et un clocher de 1826. Elle conserve le reliquaire de la Sainte Épine.","de":"Im späten 17. Jahrhundert auf den Mauern einer ehemaligen Moschee errichtet und 1863 umgebaut. Drei Schiffe, Vierung mit Kuppel und ein Turm von 1826. Hier wird das Reliquiar des Heiligen Dorns verwahrt.","pt":"Construída no final do século XVII aproveitando os muros de uma antiga mesquita e reformada em 1863. Tem três naves, cruzeiro com cúpula e uma torre de 1826. Guarda o relicário da Santa Espinha."},"more":{"es":"Está construida en ladrillo y tapial sobre un zócalo de sillar, con bóvedas de lunetos y cabecera plana; el reloj con campanas se instaló en 1899. La Santa Espina, que según la tradición procede de la corona de Jesús, se guarda en un relicario de cristal en forma de columna con guarniciones de oro. Antes se sacaba en procesión cada 10 de mayo y los vecinos le rezaban cuando amenazaba granizo; hoy la fiesta es el domingo siguiente a las comuniones.","en":"It is built of brick and rammed earth on a dressed-stone base, with lunette vaults and a flat east end; the clock with its bells was installed in 1899. The Holy Thorn, said by tradition to come from Christ's crown, is kept in a column-shaped glass reliquary with gold mounts. It used to be carried in procession every 10 May, and villagers prayed to it when hail threatened; today the feast falls on the Sunday after First Communions.","fr":"Elle est bâtie en brique et pisé sur un soubassement en pierre de taille, avec des voûtes à lunettes et un chevet plat ; l'horloge et ses cloches furent installées en 1899. La Sainte Épine, qui proviendrait selon la tradition de la couronne du Christ, est conservée dans un reliquaire en verre en forme de colonne, garni d'or. Autrefois portée en procession chaque 10 mai, elle était invoquée par les habitants contre la grêle ; la fête a lieu aujourd'hui le dimanche qui suit les premières communions.","de":"Sie ist aus Ziegel und Stampflehm auf einem Quadersockel gebaut, mit Stichkappengewölben und geradem Chorschluss; die Uhr mit Glocken kam 1899 hinzu. Der Heilige Dorn, der der Überlieferung nach aus der Dornenkrone Christi stammt, ruht in einem säulenförmigen Glasreliquiar mit Goldbeschlägen. Früher trug man ihn jeden 10. Mai in Prozession durch den Ort und rief ihn bei drohendem Hagel an; heute wird das Fest am Sonntag nach den Erstkommunionen gefeiert.","pt":"Foi construída em tijolo e taipa sobre um soco de cantaria, com abóbadas de lunetas e cabeceira reta; o relógio com sinos foi instalado em 1899. A Santa Espinha, que segundo a tradição provém da coroa de Cristo, guarda-se num relicário de vidro em forma de coluna com guarnições de ouro. Antigamente saía em procissão a cada 10 de maio e os moradores rezavam-lhe quando ameaçava granizo; hoje a festa é no domingo a seguir às primeiras comunhões."},"visit":{"es":"Exterior visible en todo momento. Para ver el interior y el relicario, aprovecha el horario de culto o consulta en el Ayuntamiento de Gelsa.","en":"The exterior can be seen at any time. To see the interior and the reliquary, come at service times or ask at Gelsa town hall.","fr":"Extérieur visible à tout moment. Pour voir l'intérieur et le reliquaire, venez aux heures des offices ou renseignez-vous à la mairie de Gelsa.","de":"Von außen jederzeit zu sehen. Innenraum und Reliquiar zeigt man zu den Gottesdienstzeiten; sonst im Rathaus von Gelsa nachfragen.","pt":"Exterior visível a qualquer hora. Para ver o interior e o relicário, aproveite o horário das missas ou informe-se na Câmara Municipal de Gelsa."}},{"id":"gelsa-cubiertos","town":"Gelsa","cat":"patrimonio","lat":41.40709,"lon":-0.46143,"src":"https://riberabaja.es/municipios/gelsa","name":{"es":"Barrio morisco y calle de los Cubiertos","en":"Morisco quarter and Calle de los Cubiertos","fr":"Quartier morisque et Calle de los Cubiertos","de":"Moriskenviertel und Calle de los Cubiertos","pt":"Bairro mourisco e Calle de los Cubiertos"},"when":{"es":"Trazado medieval de origen andalusí","en":"Medieval layout of Andalusi origin","fr":"Tracé médiéval d'époque andalusí","de":"Mittelalterlicher Grundriss maurischen Ursprungs","pt":"Traçado medieval de origem andalusina"},"desc":{"es":"Barrio de trazado ovalado y origen andalusí, conocido por sus pasos cubiertos, los «cubiertos», de los que quedan nueve. Es un buen ejemplo de arquitectura popular de tapial y yeso, y se recorre en un paseo corto desde la iglesia.","en":"An oval-shaped quarter of Andalusi origin, known for its covered passages, the “cubiertos”, nine of which survive. It is a fine example of vernacular rammed-earth and gypsum building, and can be explored on a short walk from the church.","fr":"Quartier au tracé ovale d'époque andalusí, connu pour ses passages couverts, les « cubiertos », dont neuf subsistent. C'est un bel exemple d'architecture populaire en pisé et en plâtre, à parcourir en une courte promenade depuis l'église.","de":"Ein ovales Viertel maurischen Ursprungs, bekannt für seine überdachten Durchgänge, die „cubiertos“, von denen neun erhalten sind. Ein schönes Beispiel volkstümlicher Bauweise aus Stampflehm und Gips, ein kurzer Spaziergang von der Kirche aus führt hindurch.","pt":"Bairro de traçado oval e origem andalusina, conhecido pelas suas passagens cobertas, os «cubiertos», das quais restam nove. É um bom exemplo de arquitetura popular de taipa e gesso, e percorre-se num passeio curto a partir da igreja."},"more":{"es":"El barrio se organiza en torno a dos calles perpendiculares, con callejones y pequeñas plazas; la del Hospital debe su nombre a un antiguo hospital, y La Dula viene del árabe dawla, «turno», porque allí se juntaban las ovejas que se pastoreaban por turnos. En 1495 casi todos sus unos 400 habitantes eran musulmanes; tras la expulsión de 1610 el lugar se repobló, con carta puebla de 1628. En la calle Cubierta verás una casa de dos plantas sobre el paso, con muros de tapial de yeso.","en":"The quarter is laid out around two streets at right angles, with alleys and small squares; Plaza del Hospital is named after a former hospital, and La Dula comes from the Arabic dawla, “turn”, as sheep were gathered there to be grazed in turns. In 1495 almost all of its roughly 400 inhabitants were Muslims; after the 1610 expulsion the village was resettled under a charter of 1628. On Calle Cubierta you will see a two-storey house built over the passage, with gypsum rammed-earth walls.","fr":"Le quartier s'organise autour de deux rues perpendiculaires, avec ruelles et placettes ; la place del Hospital doit son nom à un ancien hôpital, et La Dula vient de l'arabe dawla, « tour de rôle », car on y rassemblait les brebis que l'on menait paître à tour de rôle. En 1495, presque tous ses quelque 400 habitants étaient musulmans ; après l'expulsion de 1610, le village fut repeuplé avec une charte de 1628. Calle Cubierta, on voit une maison de deux étages enjambant le passage, aux murs en pisé de plâtre.","de":"Das Viertel ordnet sich um zwei rechtwinklig verlaufende Straßen mit Gassen und kleinen Plätzen; die Plaza del Hospital ist nach einem früheren Hospital benannt, La Dula kommt vom arabischen dawla, „Reihe“, weil dort die Schafe gesammelt wurden, die man reihum weiden ließ. 1495 waren fast alle der rund 400 Einwohner Muslime; nach der Vertreibung 1610 wurde der Ort mit einem Siedlungsbrief von 1628 neu besiedelt. In der Calle Cubierta steht ein zweigeschossiges Haus über dem Durchgang mit Wänden aus Gipsstampflehm.","pt":"O bairro organiza-se em torno de duas ruas perpendiculares, com becos e pequenas praças; a do Hospital deve o nome a um antigo hospital, e La Dula vem do árabe dawla, «turno», porque ali se juntavam as ovelhas que se pastoreavam por turnos. Em 1495 quase todos os seus cerca de 400 habitantes eram muçulmanos; depois da expulsão de 1610, a povoação foi repovoada com carta de povoamento de 1628. Na Calle Cubierta verá uma casa de dois pisos sobre a passagem, com paredes de taipa de gesso."},"visit":{"es":"Calles de paso libre; calcula 30 minutos. Territorio Mudéjar publica un folleto «Paseos de Arquitectura Popular» de Gelsa con seis paradas señaladas en un plano.","en":"Public streets, open at all times; allow 30 minutes. Territorio Mudéjar publishes a “Paseos de Arquitectura Popular” leaflet for Gelsa with six stops marked on a map.","fr":"Rues en accès libre ; comptez 30 minutes. Territorio Mudéjar publie pour Gelsa un dépliant « Paseos de Arquitectura Popular » avec six arrêts indiqués sur un plan.","de":"Öffentliche Gassen, jederzeit zugänglich; rechnen Sie mit 30 Minuten. Territorio Mudéjar gibt für Gelsa ein Faltblatt „Paseos de Arquitectura Popular“ mit sechs Stationen auf einem Plan heraus.","pt":"Ruas de acesso livre; conte com 30 minutos. O Territorio Mudéjar publica um folheto «Paseos de Arquitectura Popular» de Gelsa com seis paragens assinaladas num mapa."}},{"id":"gelsa-buensuceso","town":"Gelsa","cat":"patrimonio","lat":41.4112,"lon":-0.4557,"src":"https://es.wikipedia.org/wiki/Gelsa","name":{"es":"Ermita del Buen Suceso","en":"Chapel of Buen Suceso","fr":"Chapelle du Buen Suceso","de":"Kapelle Buen Suceso","pt":"Ermida do Buen Suceso"},"when":{"es":"Siglo XVIII · reconstruida por los vecinos","en":"18th century · rebuilt by the villagers","fr":"XVIIIe siècle · reconstruit par les habitants","de":"18. Jh. · von den Bewohnern wiederaufgebaut","pt":"Século XVIII · reconstruída pelos moradores"},"desc":{"es":"Ermita del siglo XVIII de ladrillo y tapial, con ábside semicircular y pórtico de tres arcos. Ardió en 1936 y se reconstruyó con donativos de los vecinos. La Virgen del Buen Suceso es la patrona de Gelsa.","en":"An 18th-century chapel of brick and rammed earth, with a semicircular apse and a three-arched porch. It burned in 1936 and was rebuilt with donations from the villagers. Our Lady of Buen Suceso is the patron saint of Gelsa.","fr":"Chapelle du XVIIIe siècle en brique et pisé, avec abside semi-circulaire et porche à trois arcs. Incendiée en 1936, elle a été reconstruite grâce aux dons des habitants. La Vierge du Buen Suceso est la patronne de Gelsa.","de":"Kapelle des 18. Jahrhunderts aus Ziegel und Stampflehm, mit halbrunder Apsis und dreibogiger Vorhalle. Sie brannte 1936 aus und wurde mit Spenden der Bewohner wieder aufgebaut. Die Virgen del Buen Suceso ist die Schutzpatronin von Gelsa.","pt":"Ermida do século XVIII de tijolo e taipa, com abside semicircular e pórtico de três arcos. Ardeu em 1936 e foi reconstruída com donativos dos moradores. A Virgem do Buen Suceso é a padroeira de Gelsa."},"more":{"es":"En el interior, la nave se cubre con bóvedas de lunetos. La ermita ya figura en el diccionario de Madoz de 1845. Las fiestas mayores de Gelsa, a principios de septiembre, son en honor a esta Virgen e incluyen la procesión con su imagen.","en":"Inside, the nave has lunette vaults. The chapel is already listed in Madoz's 1845 gazetteer. Gelsa's main festival in early September honours this Virgin and includes a procession with her statue.","fr":"À l'intérieur, la nef est couverte de voûtes à lunettes. La chapelle figure déjà dans le dictionnaire de Madoz de 1845. Les grandes fêtes de Gelsa, début septembre, sont dédiées à cette Vierge et comprennent une procession avec sa statue.","de":"Innen ist das Schiff mit Stichkappengewölben gedeckt. Die Kapelle wird schon in Madoz' Ortslexikon von 1845 genannt. Das Hauptfest von Gelsa Anfang September gilt dieser Muttergottes und umfasst eine Prozession mit ihrem Bildnis.","pt":"No interior, a nave é coberta por abóbadas de lunetas. A ermida já aparece no dicionário de Madoz de 1845. As festas maiores de Gelsa, no início de setembro, são em honra desta Virgem e incluem a procissão com a sua imagem."},"visit":{"es":"Exterior visible en todo momento; calcula 10 minutos. Para ver el interior, consulta en el Ayuntamiento de Gelsa.","en":"The exterior can be seen at any time; allow 10 minutes. To see inside, ask at Gelsa town hall.","fr":"Extérieur visible à tout moment ; comptez 10 minutes. Pour voir l'intérieur, renseignez-vous à la mairie de Gelsa.","de":"Von außen jederzeit zu sehen; rechnen Sie mit 10 Minuten. Für einen Blick ins Innere im Rathaus von Gelsa nachfragen.","pt":"Exterior visível a qualquer hora; conte com 10 minutos. Para ver o interior, informe-se na Câmara Municipal de Gelsa."}},{"id":"gelsa-hidraulico","town":"Gelsa","cat":"hidraulico","lat":41.41904,"lon":-0.4667,"src":"https://www.sipca.es/censo/11-INM-ZAR-018-119-4/Conjunto/hidr%C3%A1ulico.html","name":{"es":"Complejo hidráulico de Gelsa","en":"Gelsa water-mill complex","fr":"Ensemble hydraulique de Gelsa","de":"Wasserbauensemble von Gelsa","pt":"Complexo hidráulico de Gelsa"},"when":{"es":"Documentado en 1381 · azud de 1775–1778","en":"Recorded 1381 · weir of 1775–1778","fr":"Attesté en 1381 · barrage de 1775–1778","de":"Erwähnt 1381 · Wehr von 1775–1778","pt":"Documentado em 1381 · açude de 1775–1778"},"desc":{"es":"Se cita por primera vez en 1381. El azud, reconstruido entre 1775 y 1778 por Agustín Sanz, aprovecha dos mejanas para partir el río. Conserva la caja de tres norias anterior a 1628, y una turbina de principios del siglo XX. La harinera cerró en 1989 y desde 1993 funciona una minicentral.","en":"First recorded in 1381. The weir, rebuilt between 1775 and 1778 by Agustín Sanz, uses two river islands to split the Ebro. It keeps a housing for three waterwheels dating from before 1628, and an early 20th-century turbine. The flour mill closed in 1989 and a small hydro plant has run since 1993.","fr":"Mentionné pour la première fois en 1381. Le barrage, reconstruit entre 1775 et 1778 par Agustín Sanz, s'appuie sur deux îles pour partager le fleuve. Il conserve le bâti de trois norias antérieure à 1628, et une turbine du début du XXe siècle. La minoterie a fermé en 1989 ; une petite centrale fonctionne depuis 1993.","de":"Erstmals 1381 erwähnt. Das Wehr, 1775 bis 1778 von Agustín Sanz neu gebaut, nutzt zwei Flussinseln, um den Ebro zu teilen. Erhalten sind das Gehäuse für drei Wasserräder aus der Zeit vor 1628, und eine Turbine vom Anfang des 20. Jahrhunderts. Die Getreidemühle schloss 1989; seit 1993 läuft ein kleines Wasserkraftwerk.","pt":"Citado pela primeira vez em 1381. O açude, reconstruído entre 1775 e 1778 por Agustín Sanz, aproveita duas ilhas fluviais para dividir o rio. Conserva a caixa de três noras anterior a 1628, e uma turbina do início do século XX. A moagem fechou em 1989 e desde 1993 funciona uma minicentral."},"more":{"es":"El azud dio pie a pleitos: en 1431 hubo un conflicto porque, según se dijo, hombres de Quinto habían destruido el azud «de Exelsa». Hacia 1845 Madoz describía en Gelsa un molino harinero de cuatro muelas, dos molinos de aceite y un batán.","en":"The weir was a source of disputes: in 1431 a conflict broke out after men from Quinto were said to have destroyed the “de Exelsa” weir. Around 1845 Madoz recorded in Gelsa a flour mill with four millstones, two oil mills and a fulling mill.","fr":"Le barrage fut source de litiges : en 1431, un conflit éclata parce que des hommes de Quinto auraient détruit le barrage « de Exelsa ». Vers 1845, Madoz signalait à Gelsa un moulin à farine à quatre meules, deux moulins à huile et un foulon.","de":"Das Wehr sorgte für Streit: 1431 kam es zu einem Konflikt, weil Männer aus Quinto angeblich das Wehr „de Exelsa“ zerstört hatten. Um 1845 verzeichnete Madoz in Gelsa eine Getreidemühle mit vier Mahlsteinen, zwei Ölmühlen und eine Walkmühle.","pt":"O açude deu origem a pleitos: em 1431 houve um conflito porque, segundo se disse, homens de Quinto tinham destruído o açude «de Exelsa». Por volta de 1845, Madoz registava em Gelsa um moinho de farinha de quatro mós, dois lagares de azeite e um pisão."},"visit":{"es":"Se contempla desde la ribera y los caminos cercanos. Para acercarte a las instalaciones, consulta en el Ayuntamiento de Gelsa.","en":"Best viewed from the riverbank and nearby paths. To get closer to the buildings, ask at Gelsa town hall.","fr":"On l'observe depuis la berge et les chemins voisins. Pour approcher des installations, renseignez-vous à la mairie de Gelsa.","de":"Am besten vom Ufer und den nahen Wegen aus zu sehen. Wer näher an die Anlagen möchte, fragt im Rathaus von Gelsa.","pt":"Observa-se a partir da margem e dos caminhos próximos. Para se aproximar das instalações, informe-se na Câmara Municipal de Gelsa."}},{"id":"gelsa-barca","town":"Gelsa","cat":"naturaleza","lat":41.4272,"lon":-0.46543,"src":"https://riberabaja.es/municipios/gelsa","name":{"es":"Paso de barca y mejanas","en":"Ferry crossing and river islands","fr":"Bac et îles fluviales","de":"Fährstelle und Flussinseln","pt":"Passagem de barca e ilh
