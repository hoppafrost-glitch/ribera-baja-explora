square brick stage and an octagonal one capped by a small dome. The round-arched doorway has stepped voussoirs that act like simple archivolts. According to a 1988 inventory, the crossing was covered by a blind dome on pendentives; the college buildings attached to the church were turned into houses, now also in ruins.","fr":"Les deux tours suivent le même schéma : une base intégrée à la façade, un niveau carré en brique et un niveau octogonal coiffé d'une petite coupole. Le portail en plein cintre a des claveaux en gradins qui font office d'archivoltes. Selon un inventaire de 1988, la croisée était couverte d'une coupole aveugle sur pendentifs ; les bâtiments du collège adossés ont été transformés en logements, aujourd'hui en ruine eux aussi.","de":"Beide Türme folgen demselben Schema: ein in die Fassade eingebundener Sockel, ein quadratisches Backsteingeschoss und ein achteckiges mit kleiner Kuppel. Das Rundbogenportal hat gestufte Keilsteine, die wie einfache Archivolten wirken. Laut einem Inventar von 1988 überspannte eine Blendkuppel auf Pendentifs die Vierung; die angebauten Kollegsgebäude wurden zu Wohnhäusern umgebaut, die heute ebenfalls verfallen sind.","pt":"As duas torres repetem o mesmo esquema: base integrada na fachada, um corpo quadrado de tijolo e outro octogonal rematado por uma pequena cúpula. O portal, de volta perfeita, tem aduelas escalonadas à maneira de arquivoltas. Segundo um inventário de 1988, o cruzeiro era coberto por uma cúpula cega sobre pendentes; as dependências do colégio adossadas foram convertidas em habitações, hoje também em ruína."},"visit":{"es":"Se contempla desde la calle; el interior no es visitable y el edificio está en ruina, así que no te acerques a los muros.","en":"View it from the street; the interior cannot be visited and the building is a ruin, so keep away from the walls.","fr":"On la contemple depuis la rue ; l'intérieur ne se visite pas et l'édifice est en ruine, ne vous approchez pas des murs.","de":"Nur von der Straße aus zu betrachten; innen nicht zugänglich, und da es eine Ruine ist, Abstand zu den Mauern halten.","pt":"Contempla-se da rua; o interior não é visitável e o edifício está em ruína, por isso não se aproxime dos muros."}},{"id":"saladas","town":"Sástago","cat":"naturaleza","lat":41.39389,"lon":-0.21306,"src":"https://rsis.ramsar.org/es/ris/2038","name":{"es":"Saladas de Sástago-Bujaraloz","en":"Sástago-Bujaraloz salt lakes","fr":"Lagunes salées de Sástago-Bujaraloz","de":"Salzlagunen von Sástago-Bujaraloz","pt":"Lagoas salgadas de Sástago-Bujaraloz"},"when":{"es":"Humedal Ramsar desde 2011","en":"Ramsar wetland since 2011","fr":"Zone humide Ramsar depuis 2011","de":"Ramsar-Feuchtgebiet seit 2011","pt":"Zona húmida Ramsar desde 2011"},"desc":{"es":"Conjunto de lagunas saladas estacionales en plena estepa; 26 de ellas forman el humedal de importancia internacional (Ramsar) declarado en 2011. Alberga crustáceos que solo viven aquí y aves esteparias como la ganga, la ortega o la alondra ricotí, y conserva restos de antiguas salinas.","en":"A cluster of seasonal salt lakes in the open steppe; 26 of them make up the wetland of international importance (Ramsar) designated in 2011. It is home to crustaceans found nowhere else and steppe birds such as sandgrouse and Dupont's lark, and keeps traces of old salt works.","fr":"Un ensemble de lagunes salées saisonnières en pleine steppe ; 26 d'entre elles forment la zone humide d'importance internationale (Ramsar) classée en 2011. On y trouve des crustacés endémiques et des oiseaux steppiques comme les gangas et l'alouette de Dupont, ainsi que des vestiges d'anciennes salines.","de":"Saisonale Salzlagunen mitten in der Steppe; 26 davon bilden das 2011 ausgewiesene Feuchtgebiet von internationaler Bedeutung (Ramsar). Hier leben endemische Krebstiere und Steppenvögel wie Flughühner und die Dupontlerche; Reste alter Salinen sind erhalten.","pt":"Conjunto de lagoas salgadas sazonais em plena estepe; 26 delas formam a zona húmida de importância internacional (Ramsar) classificada em 2011. Acolhe crustáceos endémicos e aves estepárias como os cortiçóis e a cotovia-de-dupont, e conserva vestígios de antigas salinas."},"more":{"es":"En total hay unas 99 depresiones, de las que solo una quincena se inunda con regularidad; se formaron por la disolución de los yesos y la erosión del viento. La laguna de La Playa se explotó como salina del Estado entre 1703 y 1870, y aún quedan restos de casas de salineros, almacenes y una capilla. Aquí vive el crustáceo Candelacypris aragonica, exclusivo de este humedal, y en las orillas crecen plantas muy amenazadas.","en":"There are some 99 hollows in all, of which only about fifteen flood regularly; they were formed by gypsum dissolving and by wind erosion. La Playa lagoon was worked as a state salt pan from 1703 to 1870, and remains of the salt workers' houses, stores and a chapel survive. The crustacean Candelacypris aragonica lives here and nowhere else, and highly threatened plants grow along the shores.","fr":"On compte en tout quelque 99 dépressions, dont une quinzaine seulement se remplit régulièrement ; elles se sont formées par dissolution du gypse et érosion éolienne. La lagune de La Playa fut exploitée comme saline d'État de 1703 à 1870 ; il reste des vestiges des maisons des sauniers, d'entrepôts et d'une chapelle. Le crustacé Candelacypris aragonica ne vit qu'ici, et des plantes très menacées poussent sur les rives.","de":"Insgesamt gibt es rund 99 Senken, von denen nur etwa fünfzehn regelmäßig Wasser führen; sie entstanden durch Gipsauflösung und Winderosion. Die Lagune La Playa wurde von 1703 bis 1870 als staatliche Saline betrieben; Reste der Salzarbeiterhäuser, Lagerhäuser und einer Kapelle sind erhalten. Hier lebt der nur in diesem Feuchtgebiet vorkommende Krebs Candelacypris aragonica, und an den Ufern wachsen stark gefährdete Pflanzen.","pt":"Ao todo há cerca de 99 depressões, das quais só uma quinzena enche com regularidade; formaram-se pela dissolução dos gessos e pela erosão do vento. A lagoa de La Playa foi explorada como salina do Estado entre 1703 e 1870, e ainda restam vestígios de casas dos salineiros, armazéns e uma capela. Aqui vive o crustáceo Candelacypris aragonica, exclusivo deste humedal, e nas margens crescem plantas muito ameaçadas."},"visit":{"es":"Se recorren por pistas de tierra desde la carretera A-2105 (Bujaraloz–Sástago); no hay observatorios, así que unos prismáticos o un telescopio ayudan. Primavera y otoño son las mejores épocas. Es un espacio protegido: no salgas de las pistas, no pises los fondos de las lagunas y no molestes a las aves.","en":"Explore them along dirt tracks off the A-2105 (Bujaraloz–Sástago); there are no hides, so binoculars or a telescope help. Spring and autumn are the best seasons. This is a protected area: stay on the tracks, keep off the lagoon beds and do not disturb the birds.","fr":"On les parcourt par des pistes en terre depuis la route A-2105 (Bujaraloz–Sástago) ; il n'y a pas d'observatoire, des jumelles ou une longue-vue sont utiles. Le printemps et l'automne sont les meilleures saisons. C'est un espace protégé : restez sur les pistes, ne marchez pas dans le fond des lagunes et ne dérangez pas les oiseaux.","de":"Erkunden lassen sie sich über Erdpisten abseits der A-2105 (Bujaraloz–Sástago); Beobachtungshütten gibt es nicht, Fernglas oder Spektiv helfen. Frühjahr und Herbst sind die besten Jahreszeiten. Das Gebiet ist geschützt: auf den Pisten bleiben, die Lagunenböden nicht betreten und die Vögel nicht stören.","pt":"Percorrem-se por estradões de terra a partir da estrada A-2105 (Bujaraloz–Sástago); não há observatórios, por isso binóculos ou um telescópio ajudam. A primavera e o outono são as melhores épocas. É um espaço protegido: não saia dos caminhos, não pise o fundo das lagoas e não incomode as aves."}}],"towns":[{"name":"Quinto","lat":41.42481,"lon":-0.49752},{"name":"Pina de Ebro","lat":41.48896,"lon":-0.52602},{"name":"Gelsa","lat": ssível carregar o mapa. Verifique a ligação e recarregue a página.","tabMap":"Ver mapa","photoContext":"Foto dos arredores","openGallery":"Ver as fotos","gallery":"Galeria de fotos","pause":"Pausa","audioguide":"Audioguia","speed":"Velocidade","noVoice":"De momento não há áudio deste lugar neste idioma.","moreTitle":"Mais detalhes","tabHome":"Início","coverKicker":"Comarca Ribera Baja del Ebro","coverTitle":"Dez localidades, dois mil anos, um rio","coverText":"Uma colónia romana, um mosteiro cisterciense, o mudéjar de Quinto e a frente de 1937, a uma hora de Saragoça.","coverCta":"Começar a explorar","coverRoutes":"Ver as rotas","homeTitle":"Ribera Baja del Ebro","homeText":"Escolha por onde começar: os imperdíveis, uma rota ou o que estiver mais perto.","homeMust":"Imperdíveis","homeRoutes":"Rotas a fazer","seeAll":"Ver tudo","explorePlaces":"Explorar os {n} lugares","photo":"Foto","photosCredit":"Fotografias da Wikimedia Commons com licenças Creative Commons; o autor figura em cada ficha. Audioguia gravado com as vozes neuronais livres Piper (voz francesa: corpus SIWIS, CC BY 4.0).","base_mapa":"Mapa","stopsShort":"paragens"}};
</script>
<script>
(function(){
"use strict";
if(!window.L){var mw=document.getElementById("mapwrap");if(mw) mw.innerHTML='<div class="maperr">No se ha podido cargar el mapa. Comprueba la conexión y recarga la página.</div>';return;}
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LANGS=[["es","ES","es-ES"],["en","EN","en-GB"],["fr","FR","fr-FR"],["de","DE","de-DE"],["pt","PT","pt-PT"]];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("rbx-lang")||((navigator.language||"es").slice(0,2));
if(!LANGS.some(l=>l[0]===lang)) lang="es";
const t=(k,vars)=>{let s=(I18N[lang]&&I18N[lang][k])??I18N.es[k]??k; if(vars) for(const v in vars) s=s.replace("{"+v+"}",vars[v]); return s;};
const L10=(o)=>o?(typeof o==="string"?o:(o[lang]||o.es||"")):"";
const nf=()=>new Intl.NumberFormat(lang==="en"?"en-GB":lang,{maximumFractionDigits:1});

const CATS=DATA.categories; // {id:{color:"--c-pat", icon:"svgpath"}}
const ICON=id=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${CATS[id].icon}</svg>`;
const POIS=DATA.pois, BYID=Object.fromEntries(POIS.map(p=>[p.id,p]));
const TOWNS=DATA.towns;
const PH=DATA.photos||{};
const imgURL=(f,w)=>"https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(f)+"?width="+w;
const IMG_BASE=DATA.imgBase||"img/";
const localImg=(key,w)=>IMG_BASE+key+(w<=330?"-s":"")+".jpg";
const GAL=DATA.gallery||{};
const galleryOf=id=>[id].concat(GAL[id]||[]).filter(k=>PH[k]);
const creditHTML=ph=>`${esc(t(ph.context?"photoContext":"photo"))}: <a href="${esc(ph.page)}" target="_blank" rel="noopener">${esc(ph.author)}</a> · ${esc(ph.license)} · Wikimedia Commons`;
const clauses=txt=>txt.split(/(?<=,)\s+/).map(x=>`<span class="nb">${esc(x)}</span>`).join(" ");
function phHTML(key,cat,w,cls,credit){const ph=PH[key];const c=CATS[cat]?CATS[cat].color:"--accent";
  return `<div class="ph ${cls||""}" style="--c:var(${c})">${CATS[cat]?ICON(cat):""}${ph?`<img src="${localImg(key,w)}" data-fb="${esc(imgURL(ph.file,w))}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">`:""}${credit&&ph?`<span class="credit">${creditHTML(ph)}</span>`:""}</div>`;}
document.addEventListener("error",e=>{const el=e.target;if(!el||el.tagName!=="IMG") return;
  if(el.dataset.fb&&!el.dataset.tried){el.dataset.tried="1";el.src=el.dataset.fb;return;}
  if(el.closest(".ph,.gal,.lb")) el.classList.add("broken");},true);
const state={cats:new Set(Object.keys(CATS)),town:"",q:"",sel:null,route:null,tab:"explorar",intro:store.get("rbx-intro")!=="0",basemap:"ilustrado",me:null,ed:{id:null,lang:"es",draft:null},adding:false};
/* ---------- local edits (demo of the content editor) ---------- */
const EDIT_KEY="rbx-edits-v1";
let EDITS={};try{EDITS=JSON.parse(store.get(EDIT_KEY)||"{}")||{};}catch(e){EDITS={};}
EDITS.byId=EDITS.byId||{};EDITS.added=Array.isArray(EDITS.added)?EDITS.added:[];
EDITS.added.forEach(a=>{if(a&&a.id&&!BYID[a.id]&&CATS[a.cat]){POIS.push(a);BYID[a.id]=a;}});
POIS.forEach(p=>{const e=EDITS.byId[p.id];if(!e)return;if(e.name)p.name=Object.assign({},p.name,e.name);if(e.desc)p.desc=Object.assign({},p.desc,e.desc);if(e.status)p.status=e.status;if(e.cat&&CATS[e.cat])p.cat=e.cat;});
function saveEdits(){store.set(EDIT_KEY,JSON.stringify(EDITS));}

/* ---------- distance ---------- */
function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

/* ---------- toast ---------- */
let toastT;function toast(msg){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2600);}

/* ---------- map ---------- */
const map=L.map("map",{zoomControl:true,attributionControl:true,minZoom:9,maxZoom:18,zoomSnap:.25,
  maxBounds:[[40.85,-1.2],[41.95,0.45]],maxBoundsViscosity:.8,preferCanvas:false});
map.attributionControl.setPrefix(false);
const baseAttr='Límites municipales: IGN-CNIG';
map.attributionControl.addAttribution(baseAttr);
const panes={};["base","river","routes","labels"].forEach((n,i)=>{panes[n]=map.createPane(n);panes[n].style.zIndex=350+i*10;});
panes.stops=map.createPane("stops");panes.stops.style.zIndex=650;panes.stops.style.pointerEvents="none";
panes.labels.style.pointerEvents="none";
const muniLayers={};
const baseLayer=L.geoJSON(BASE,{pane:"base",interactive:false,filter:f=>!f.properties.river,
  style:f=>f.properties.outline?{className:"comarca-outline",fill:false}:{className:"muni"+(f.properties.c?"":" out")},
  onEachFeature:(f,l)=>{if(f.properties.c) muniLayers[f.properties.n]=l;}}).addTo(map);
const riverFeat=BASE.features.find(f=>f.properties.river);
if(riverFeat){
  const ll=riverFeat.geometry.coordinates.map(c=>[c[1],c[0]]);
  L.polyline(ll,{pane:"river",className:"river-halo",interactive:false,smoothFactor:1}).addTo(map);
  L.polyline(ll,{pane:"river",className:"river",interactive:false,smoothFactor:1}).addTo(map);
}
// town & context labels
TOWNS.forEach(tw=>L.marker([tw.lat,tw.lon],{pane:"labels",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<span class="town-label${tw.minor?" minor":""}">${esc(tw.name)}</span>`,iconSize:null})}).addTo(map));
(DATA.context||[]).forEach(tw=>L.marker([tw.lat,tw.lon],{pane:"labels",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<span class="town-label out">${esc(tw.name)}</span>`,iconSize:null})}).addTo(map));
if(DATA.riverLabel) L.marker(DATA.riverLabel,{pane:"labels",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:'<span class="river-label">EBRO</span>',iconSize:null})}).addTo(map);

const homeBounds=baseLayer.getLayers().find(l=>l.feature.properties.outline).getBounds();
map.fitBounds(homeBounds,{padding:[16,16]});
map.setMaxZoom(15);

// basemaps (only used where the hosting allows external map tiles)
const TILES={
  mapa:{url:"https://www.ign.es/wmts/ign-base?layer=IGNBaseTodo&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix={z}&TileCol={x}&TileRow={y}",opt:{maxZoom:18,attribution:'Mapa base © <a href="https://www.ign.es">IGN</a>'}},
  ortofoto:{url:"https://www.ign.es/wmts/pnoa-ma?layer=OI.OrthoimageCoverage&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/jpeg&TileMatrix={z}&TileCol={x}&TileRow={y}",opt:{maxZoom:19,attribution:'PNOA © <a href="https://www.ign.es">IGN</a>'}}
};
let tileLayer=null;
function setBasemap(k,silent){
  state.basemap=k; $$(".layerbox button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===k)));
  if(tileLayer){map.removeLayer(tileLayer);tileLayer=null;}
  $("#map").classList.remove("tiles-on");
  if(k==="ilustrado"){map.setMaxZoom(15);return;}
  map.setMaxZoom(18);
  const def=TILES[k]; let ok=0,bad=0,decided=false;
  tileLayer=L.tileLayer(def.url,def.opt);
  tileLayer.on("tileload",()=>{ok++; if(!decided){decided=true;$("#map").classList.add("tiles-on");}});
  tileLayer.on("tileerror",()=>{bad++; if(!decided&&bad>=3){decided=true;map.removeLayer(tileLayer);tileLayer=null;state.basemap="ilustrado";map.setMaxZoom(15);$("#map").classList.remove("tiles-on");$$(".layerbox button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k==="ilustrado")));if(!silent) toast(t("tilesBlocked"));}});
  tileLayer.addTo(map); tileLayer.bringToBack();
}
const isPhone=()=>!!(window.matchMedia&&window.matchMedia("(max-width:760px)").matches);
const PHONE=window.matchMedia&&window.matchMedia("(max-width:760px)").matches;
const LayerCtl=L.Control.extend({options:{position:PHONE?"bottomleft":"topright"},onAdd(){const d=L.DomUtil.create("div","layerbox");L.DomEvent.disableClickPropagation(d);
  d.innerHTML=["mapa","ortofoto","ilustrado"].map(k=>`<button type="button" data-k="${k}" aria-pressed="${k===state.basemap}"></button>`).join("");
  d.addEventListener("click",e=>{const b=e.target.closest("button");if(b) setBasemap(b.dataset.k);});return d;}});
map.addControl(new LayerCtl());
const LegendCtl=L.Control.extend({options:{position:"bottomright"},onAdd(){const d=L.DomUtil.create("div","legend");d.id="legend";return d;}});
map.addControl(new LegendCtl());

/* markers */
const markers={};
function pinIcon(p){return L.divIcon({className:"",html:`<div class="pin" style="--c:var(${CATS[p.cat].color})">${ICON(p.cat)}</div>`,iconSize:[30,30],iconAnchor:[4,30],popupAnchor:[11,-30]});}
function addMarker(p){
  const m=L.marker([p.lat,p.lon],{keyboard:true,title:L10(p.name),riseOnHover:true,icon:pinIcon(p)});
  m.on("click",()=>{if(state.adding){map.fire("click",{latlng:m.getLatLng()});return;} openPlace(p.id,{fly:false});});
  m.addTo(map); markers[p.id]=m;
}
POIS.forEach(addMarker);
function pinEl(id){const m=markers[id];return m&&m.getElement()?m.getElement().querySelector(".pin"):null;}
function visible(p){
  if(!state.cats.has(p.cat)) return false;
  if(state.town&&p.town!==state.town) return false;
  if(state.q){const q=norm(state.q);const hay=norm(L10(p.name)+" "+p.town+" "+L10(p.desc)+" "+t("cat_"+p.cat));if(!hay.includes(q)) return false;}
  return true;
}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function refreshMarkers(){
  const inRoute=state.route?new Set(DATA.routes.find(r=>r.id===state.route).stops):null;
  POIS.forEach(p=>{const m=markers[p.id];const show=inRoute?inRoute.has(p.id):visible(p);
    if(show&&!map.hasLayer(m)) m.addTo(map); if(!show&&map.hasLayer(m)) map.removeLayer(m);
    const el=pinEl(p.id); if(el) el.classList.toggle("sel",state.sel===p.id);});
  Object.entries(muniLayers).forEach(([n,l])=>{const el=l.getElement&&l.getElement();if(el) el.classList.toggle("hl",state.town===n);});
}

/* ---------- route drawing ---------- */
let routeGroup=L.layerGroup().addTo(map);
function drawRoute(r){
  routeGroup.clearLayers(); if(!r) return;
  const pts=r.stops.map(id=>BYID[id]).map(p=>[p.lat,p.lon]);
  const color=`var(${CATS[r.cat].color})`;
  const line=L.polyline(pts,{pane:"routes",className:"route-line",interactive:false});
  routeGroup.addLayer(line);
  setTimeout(()=>{const el=line.getElement();if(el) el.style.setProperty("--c",color);},0);
  r.stops.forEach((id,i)=>{const p=BYID[id];routeGroup.addLayer(L.marker([p.lat,p.lon],{pane:"stops",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<div class="stopnum">${i+1}</div>`,iconSize:[0,0]})}));});
  map.flyToBounds(L.latLngBounds(pts),{padding:[50,50],duration:.8,maxZoom:15});
}
function routeStats(r){let km=0;const legs=[];for(let i=1;i<r.stops.length;i++){const d=hav(BYID[r.stops[i-1]],BYID[r.stops[i]])*1.25;legs.push(d);km+=d;}
  const speed={walk:4,bike:14,car:55}[r.mode];const mins=Math.round(km/speed*60+r.stops.length*(r.mode==="car"?35:20));return {km,legs,mins};}
function gmapsRoute(r){const pts=r.stops.map(id=>BYID[id]).map(p=>p.lat+","+p.lon);const mode={walk:"walking",bike:"bicycling",car:"driving"}[r.mode];
  return "https://www.google.com/maps/dir/?api=1&origin="+pts[0]+"&destination="+pts.at(-1)+(pts.length>2?"&waypoints="+encodeURIComponent(pts.slice(1,-1).join("|")):"")+"&travelmode="+mode;}
function fmtDur(m){const h=Math.floor(m/60),mm=m%60;return h?`${h} h${mm?" "+mm+" min":""}`:`${mm} min`;}

/* ---------- views ---------- */
function setTab(tab,push=true){closeLightbox();
  state.tab=tab;
  $$("#tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab||(tab==="lugar"&&b.dataset.tab==="explorar"))));
  if(tab==="inicio"&&!state.route) map.flyToBounds(homeBounds,{padding:[16,16],duration:.6});
  $$(".view").forEach(v=>v.hidden=v.id!=="v-"+tab);
  if(tab!=="rutas"&&tab!=="lugar"&&state.route){state.route=null;drawRoute(null);}
  render(tab);
  if(push) setHash(tab==="lugar"?"p-"+state.sel:tab);
  if(isPhone()){const y=$("#panel").getBoundingClientRect().top+window.scrollY;
    if(tab==="lugar"||window.scrollY>y) window.scrollTo({top:y,behavior:tab==="lugar"?"smooth":"auto"});}
  else $("#v-"+tab).scrollTop=0;
}
function setHash(h){try{if(location.hash!=="#"+h) history.replaceState(null,"","#"+h);}catch(e){}}
function render(tab){({inicio:renderHome,explorar:renderExplore,lugar:renderPlace,rutas:renderRoutes,guias:renderGuides,gestion:renderAdmin}[tab]||(()=>{}))();refreshMarkers();}

const MUST=DATA.must||[];
function renderHome(){
  const v=$("#v-inicio");
  v.innerHTML=`<div class="home-hero">${phHTML(DATA.homeHero||"rueda","patrimonio",960)}<div class="shade"></div>
     <div class="txt"><span class="eyebrow" style="color:rgba(255,255,255,.8)">${esc(t("coverKicker"))}</span><h2>${clauses(t("coverTitle"))}</h2><p>${esc(t("coverText"))}</p></div></div>
   <div class="stats" style="margin-top:0"><span><b>${TOWNS.length}</b>${esc(t("statTowns"))}</span><span><b>${POIS.length}</b>${esc(t("statPlaces"))}</span><span><b>${DATA.routes.length}</b>${esc(t("statRoutes"))}</span><span><b>${LANGS.length}</b>${esc(t("statLangs"))}</span></div>
   <div class="quick"><button type="button" class="btn primary" id="h-explore">${svgI("map")}<span>${esc(t("explorePlaces",{n:POIS.length}))}</span></button>
     <button type="button" class="btn" id="h-near">${svgI("locate")}<span>${esc(t("nearMe"))}</span></button></div>
   <div class="stack" style="gap:8px"><div class="sec-h"><h3>${esc(t("homeMust"))}</h3><button type="button" class="linkbtn" id="h-all">${esc(t("seeAll"))} ›</button></div>
     <div class="hscroll" id="h-must">${MUST.filter(id=>BYID[id]).map(id=>{const p=BYID[id];return `<button type="button" class="card" data-id="${p.id}">${phHTML(p.id,p.cat,500)}<b>${esc(L10(p.name))}</b><span>${esc(p.town)}</span></button>`;}).join("")}</div></div>
   <div class="stack" style="gap:8px"><div class="sec-h"><h3>${esc(t("homeRoutes"))}</h3><button type="button" class="linkbtn" id="h-routes">${esc(t("seeAll"))} ›</button></div>
     <div class="hscroll" id="h-r">${DATA.routes.map(r=>`<button type="button" class="card" data-r="${r.id}">${phHTML(r.cover||r.stops[0],r.cat,500)}<b>${esc(L10(r.name))}</b><span>${r.stops.length} ${esc(t("stopsShort"))} · ${esc(t("mode_"+r.mode))}</span></button>`).join("")}</div></div>
   <p class="note">${esc(t("photosCredit"))} ${esc(t("footNote"))}</p>`;
  $("#h-explore").onclick=()=>setTab("explorar");
  $("#h-all").onclick=()=>setTab("explorar");
  $("#h-routes").onclick=()=>setTab("rutas");
  $("#h-near").onclick=()=>{setTab("explorar");if(!state.me) nearMe();};
  $("#h-must").onclick=e=>{const b=e.target.closest("[data-id]");if(b) openPlace(b.dataset.id);};
  $("#h-r").onclick=e=>{const b=e.target.closest("[data-r]");if(!b)return;state.route=b.dataset.r;setTab("rutas",false);setHash("r-"+state.route);drawRoute(DATA.routes.find(x=>x.id===state.route));refreshMarkers();};
}
function renderExplore(){
  const v=$("#v-explorar");
  const list=POIS.filter(visible);
  const towns=[...new Set(POIS.map(p=>p.town))].sort((a,b)=>a.localeCompare(b,"es"));
  v.innerHTML=`

const AUD=new Audio(); AUD.preload="none";
let audKey=null, audRate=1, ttsOn=false;
const audioURL=(id,l)=>(DATA.audioBase||"audio/")+l+"/"+id+".mp3";
const fmtT=s=>{if(!isFinite(s)||s<0) s=0;const m=Math.floor(s/60),x=Math.round(s%60);return m+":"+String(x).padStart(2,"0");};
function playerHTML(p){const on=audKey===lang+"/"+p.id&&!AUD.paused||ttsOn;
  return `<div class="player" id="player"><button type="button" class="pp" id="pp" aria-label="${esc(t(on?"pause":"listen"))}">${svgI(on?"pause":"play")}</button>
   <div class="mid"><div class="lbl"><span>${esc(t("audioguide"))} · ${({es:"Español",en:"English",fr:"Français",de:"Deutsch",pt:"Português"})[lang]}</span><span id="ptime">${audKey===lang+"/"+p.id?fmtT(AUD.currentTime)+" / "+fmtT(AUD.duration):""}</span></div>
   <div class="track" id="ptrack"><i id="pbar" style="width:${audKey===lang+"/"+p.id&&AUD.duration?(100*AUD.currentTime/AUD.duration):0}%"></i></div></div>
   <button type="button" class="spd" id="pspd" aria-label="${esc(t("speed"))}">${audRate===1?"1×":audRate+"×"}</button></div>`;}
function bindPlayer(p){
  $("#pp").onclick=()=>toggleAudio(p);
  $("#pspd").onclick=()=>{audRate=audRate===1?1.25:audRate===1.25?0.85:1;AUD.playbackRate=audRate;$("#pspd").textContent=audRate+"×";};
  $("#ptrack").onclick=e=>{if(audKey!==lang+"/"+p.id||!AUD.duration) return;const r=e.currentTarget.getBoundingClientRect();AUD.currentTime=AUD.duration*Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));};
}
function updPlayer(){const pt=$("#ptime"),pb=$("#pbar");if(!pt||!pb||!state.sel||audKey!==lang+"/"+state.sel) return;
  pt.textContent=fmtT(AUD.currentTime)+" / "+fmtT(AUD.duration);pb.style.width=(AUD.duration?100*AUD.currentTime/AUD.duration:0)+"%";}
function setPP(on){const b=$("#pp");if(b){b.innerHTML=svgI(on?"pause":"play");b.setAttribute("aria-label",t(on?"pause":"listen"));}}
AUD.addEventListener("timeupdate",updPlayer);AUD.addEventListener("loadedmetadata",updPlayer);
AUD.addEventListener("play",()=>setPP(true));AUD.addEventListener("pause",()=>setPP(false));
AUD.addEventListener("ended",()=>{setPP(false);AUD.currentTime=0;updPlayer();});
AUD.addEventListener("error",()=>{if(!audKey) return;const [l,id]=audKey.split("/");audKey=null;const p=BYID[id];if(p&&l===lang) speakTTS(p);});
function toggleAudio(p){
  if(ttsOn){stopAudio();return;}
  const key=lang+"/"+p.id;
  if(audKey===key){if(AUD.paused){AUD.playbackRate=audRate;AUD.play().catch(()=>{});}else AUD.pause();return;}
  stopAudio();audKey=key;AUD.src=audioURL(p.id,lang);AUD.playbackRate=audRate;
  AUD.play().catch(err=>{if(err&&err.name==="NotAllowedError") return;});
  setPP(true);
}
function stopAudio(){try{AUD.pause();}catch(e){}audKey=null;if(ttsOn){try{speechSynthesis.cancel();}catch(e){}ttsOn=false;}setPP(false);const pt=$("#ptime"),pb=$("#pbar");if(pt) pt.textContent="";if(pb) pb.style.width="0";}
/* Respaldo: voz del dispositivo, solo si existe en el idioma elegido (nunca leer francés con voz española). */
function bestVoice(code){const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];const base=code.slice(0,2);
  const c=vs.filter(v=>(v.lang||"").replace("_","-").toLowerCase().startsWith(base));if(!c.length) return null;
  const score=v=>{const n=v.name||"";let s=0;if(/natural|neural/i.test(n)) s+=50;if(/online/i.test(n)) s+=20;if(/premium|enhanced|mejorada|siri/i.test(n)) s+=30;if(/google/i.test(n)) s+=15;
    if((v.lang||"").replace("_","-").toLowerCase()===code.toLowerCase()) s+=10;if(/compact|espeak/i.test(n)) s-=30;return s;};
  return c.sort((a,b)=>score(b)-score(a))[0];}
function speakTTS(p){
  if(!("speechSynthesis" in window)){toast(t("noAudio"));setPP(false);return;}
  const go=()=>{const code=LANGS.find(l=>l[0]===lang)[2];const v=bestVoice(code);
    if(!v){toast(t("noVoice"));setPP(false);return;}
    const txt=[L10(p.name),L10(p.desc),L10(p.more)].filter(Boolean).join(". ");
    const parts=txt.match(/[^.!?;]+[.!?;]*/g)||[txt];speechSynthesis.cancel();ttsOn=true;setPP(true);
    parts.forEach((s,i)=>{const u=new SpeechSynthesisUtterance(s.trim());u.voice=v;u.lang=v.lang;u.rate=.95*audRate;
      if(i===parts.length-1) u.onend=()=>{ttsOn=false;setPP(false);};u.onerror=()=>{ttsOn=false;setPP(false);};speechSynthesis.speak(u);});};
  if(speechSynthesis.getVoices().length) go(); else {let done=false;const f=()=>{if(done) return;done=true;go();};speechSynthesis.addEventListener("voiceschanged",f,{once:true});setTimeout(f,900);}
}

function qrInto(el,text){try{const q=qrcode(0,"M");q.addData(text);q.make();el.innerHTML=q.createSvgTag({cellSize:3,margin:0,scalable:true});const s=el.querySelector("svg");if(s){s.querySelectorAll("rect").forEach(r=>{if((r.getAttribute("fill")||"").toLowerCase()==="#ffffff"||r.getAttribute("fill")==="white") r.setAttribute("fill","#fff");});s.setAttribute("role","img");s.setAttribute("aria-label","QR");}}catch(e){el.textContent="QR";}}

function svgI(n){const P={audio:'<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="1.5"/>',nav:'<path d="M3 11 21 3l-8 18-2-8-8-2z"/>',link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',map:'<path d="m9 4-6 3v13l6-3 6 3 6-3V4l-6 3-6-3z"/><path d="M9 4v13M15 7v13"/>',locate:'<circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/><circle cx="12" cy="12" r="7.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',check:'<path d="m5 12 5 5 9-10"/>',play:'<path d="M8 5.5v13l11-6.5z" fill="currentColor"/>',pause:'<rect x="6.5" y="5.5" width="3.5" height="13" rx="1" fill="currentColor"/><rect x="14" y="5.5" width="3.5" height="13" rx="1" fill="currentColor"/>',photos:'<rect x="3" y="5" width="14" height="12" rx="2"/><path d="M7 21h12a2 2 0 0 0 2-2V9"/><circle cx="8" cy="9.5" r="1.5"/><path d="m3 15 4-3 4 3 3-2 3 2"/>'};

   ${ex.map(x=>`<article class="guide"><div class="guide-top"><span class="avatar">${esc(x.initials)}</span><div style="min-width:0"><h3>${esc(L10(x.title))}</h3><div class="small">${esc(L10(x.host))}</div></div></div>
     <p class="small" style="color:var(--ink)">${esc(L10(x.desc))}</p>
     <div class="kv"><span><b>${esc(x.town)}</b></span><span>${esc(x.duration)}</span><span>${esc(x.langs)}</span><span>${esc(L10(x.price))}</span></div>
     <div class="actions"><button type="button" class="btn primary" data-book="${x.id}">${esc(t("requestVisit"))}</button><span class="tag">${esc(t("sample"))}</span></div>
     <div data-form="${x.id}"></div></article>`).join("")}
   <form class="card" id="guideForm" novalidate>
     <h3>${esc(t("beGuide"))}</h3><p class="small">${esc(t("beGuideText"))}</p>
     <div class="field"><label for="g-name">${esc(t("fName"))}</label><input id="g-name" required></div>
     <div class="field"><label for="g-title">${esc(t("fTitle"))}</label><input id="g-title" required placeholder="${esc(t("fTitlePh"))}"></div>
     <div class="two"><div class="field"><label for="g-town">${esc(t("fTown"))}</label><select id="g-town">${TOWNS.map(x=>`<option>${esc(x.name)}</option>`).join("")}</select></div>
       <div class="field"><label for="g-langs">${esc(t("fLangs"))}</label><input id="g-langs" placeholder="ES, EN"></div></div>
     <div class="field"><label for="g-desc">${esc(t("fDesc"))}</label><textarea id="g-desc" rows="3"></textarea></div>
     <label class="check"><input type="checkbox" id="g-lic" required><span>${esc(t("fLicense"))}</span></label>
     <button type="submit" class="btn primary" style="align-self:flex-start">${esc(t("publish"))}</button>
     <div id="g-ok"></div>
   </form>
   <p class="note">${esc(t("guidesNote"))}</p>`;
  v.onclick=e=>{const b=e.target.closest("[data-book]");if(!b)return;const id=b.dataset.book;const slot=$(`[data-form="${id}"]`,v);
    if(slot.innerHTML){slot.innerHTML="";return;}
    slot.innerHTML=`<form class="card" data-bf="${id}" novalidate><div class="two"><div class="field"><label for="b-name-${id}">${esc(t("fYourName"))}</label><input id="b-name-${id}" required></div>
     <div class="field"><label for="b-date-${id}">${esc(t("fDate"))}</label><input id="b-date-${id}" type="date" required></div></div>
     <div class="two"><div class="field"><label for="b-ppl-${id}">${esc(t("fPeople"))}</label><input id="b-ppl-${id}" type="number" min="1" max="60" value="2"></div>
     <div class="field"><label for="b-lang-${id}">${esc(t("fLanguage"))}</label><select id="b-lang-${id}">${LANGS.map(l=>`<option ${l[0]===lang?"selected":""}>${l[1]}</option>`).join("")}</select></div></div>
     <button type="submit" class="btn primary" style="align-self:flex-start">${esc(t("send"))}</button><div class="okslot"></div></form>`;};
  v.onsubmit=e=>{e.preventDefault();const f=e.target;
    if(f.id==="guideForm"){if(!$("#g-name").value.trim()||!$("#g-title").value.trim()||!$("#g-lic").checked){toast(t("fillRequired"));return;}
      $("#g-ok").innerHTML=`<div class="okmsg">${esc(t("publishedOk"))}</div>`;return;}
    if(f.dataset.bf){const id=f.dataset.bf;if(!$(`#b-name-${id}`).value.trim()||!$(`#b-date-${id}`).value){toast(t("fillRequired"));return;}
      $(".okslot",f).innerHTML=`<div class="okmsg">${esc(t("sentOk"))}</div>`;}};
}

function renderAdmin(){
  const v=$("#v-gestion");const A=DATA.adminSample;
  const byTown={};POIS.forEach(p=>{const x=byTown[p.town]=byTown[p.town]||{n:0,ok:0};x.n++;if(p.status==="ok")x.ok++;});
  const max=Math.max(...A.byLang.map(x=>x[1]));
  if(!state.ed.id||!BYID[state.ed.id]) state.ed={id:POIS[0].id,lang:state.ed.lang||"es",draft:null};
  const ep=BYID[state.ed.id];
  if(!state.ed.draft||state.ed.draft.id!==ep.id) state.ed.draft={id:ep.id,name:Object.assign({},ep.name),desc:Object.assign({},ep.desc),cat:ep.cat,status:ep.status||"pending"};
  const d=state.ed.draft,el=state.ed.lang;
  const towns=[...new Set(POIS.map(p=>p.town))].sort((x,y)=>x.localeCompare(y,"es"));
  v.innerHTML=`<div class="stack" style="gap:4px"><div class="eyebrow">${esc(t("tabAdmin"))}</div><h2>${esc(t("adminTitle"))}</h2><p class="lede">${esc(t("adminIntro"))}</p></div>
   <div class="stack" style="gap:6px"><div class="toolbar"><h3>${esc(t("adminActivity"))}</h3><span class="tag">${esc(t("sampleData"))}</span></div>
   <div class="kpis"><div class="kpi"><b>${new Intl.NumberFormat(lang).format(A.visits)}</b><span>${esc(t("kVisits"))}</span></div>
   <div class="kpi"><b>${A.foreign}%</b><span>${esc(t("kForeign"))}</span></div><div class="kpi"><b>${A.qrScans}</b><span>${esc(t("kQr"))}</span></div></div>
   <div class="bars" aria-label="${esc(t("byLang"))}">${A.byLang.map(([k,n])=>`<div class="bar"><span>${esc(k)}</span><span class="track"><span class="fill" style="width:${(n/max*100).toFixed(1)}%;display:block"></span></span><span class="v">${new Intl.NumberFormat(lang).format(n)}</span></div>`).join("")}</div>
   <div class="small">${esc(t("byLang"))}</div></div>

   <form class="editor" id="ed" novalidate>
     <div class="toolbar"><h3>${esc(t("editTitle"))}</h3>${d.status==="ok"?`<span class="status ok"><i></i>${esc(t("validated"))}</span>`:`<span class="status"><i></i>${esc(t("pending"))}</span>`}</div>
     <p class="small">${esc(t("editIntro"))}</p>
     <div class="field"><label for="ed-place">${esc(t("pickPlace"))}</label><select id="ed-place">${towns.map(tn=>`<optgroup label="${esc(tn)}">${POIS.filter(p=>p.town===tn).map(p=>`<option value="${p.id}" ${p.id===ep.id?"selected":""}>${esc(L10(p.name))}${p.status==="ok"?" ✓":""}</option>`).join("")}</optgroup>`).join("")}</select></div>
     <div class="field"><label for="ed-cat">${esc(t("fieldCat"))}</label><select id="ed-cat">${Object.keys(CATS).map(c=>`<option value="${c}" ${c===d.cat?"selected":""}>${esc(t("cat_"+c))}</option>`).join("")}</select></div>
     <div class="field"><span class="small" style="font-weight:600">${esc(t("editLang"))}</span><div class="seg" id="ed-lang">${LANGS.map(([k,lab])=>`<button type="button" data-l="${k}" aria-pressed="${k===el}">${lab}</button>`).join("")}</div></div>
     <div class="field"><label for="ed-name">${esc(t("fieldName"))} · ${el.toUpperCase()}</label><input id="ed-name" lang="${el}" value="${esc(d.name[el]||"")}"></div>
     <div class="field"><label for="ed-desc">${esc(t("fieldDesc"))} · ${el.toUpperCase()}</label><textarea id="ed-desc" lang="${el}" rows="7">${esc(d.desc[el]||"")}</textarea></div>
     <label class="check"><input type="checkbox" id="ed-ok" ${d.status==="ok"?"checked":""}><span>${esc(t("markValidated"))}</span></label>
     <div class="actions"><button type="submit" class="btn primary">${svgI("check")}<span>${esc(t("save"))}</span></button><button type="button" class="btn" id="ed-view">${esc(t("viewOnMap"))}</button></div>
   </form>

   <div class="stack" style="gap:6px"><h3>${esc(t("addTitle"))}</h3><p class="small">${esc(t("addText"))}</p>
     <div class="actions"><button type="button" class="btn" id="ed-add">${svgI("plus")}<span>${esc(state.adding?t("cancel"):t("addBtn"))}</span></button>
     <button type="button" class="btn" id="ed-reset">${svgI("undo")}<span>${esc(t("resetBtn"))}</span></button></div></div>

   <div class="stack" style="gap:6px"><h3>${esc(t("adminContent"))}</h3>
   <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>${esc(t("fTown"))}</th><th class="n" style="text-align:right">${esc(t("places"))}</th><th>${esc(t("state"))}</th></tr></thead>
   <tbody>${Object.keys(byTown).sort((x,y)=>x.localeCompare(y,"es")).map(n=>`<tr><td>${esc(n)}</td><td class="n">${byTown[n].n}</td><td><span class="status${byTown[n].ok===byTown[n].n?" ok":""}"><i></i>${esc(t("nValidated",{a:byTown[n].ok,b:byTown[n].n}))}</span></td></tr>`).join("")}</tbody></table></div>
   <div class="actions"><button type="button" class="btn" id="exp">${svgI("copy")}<span>${esc(t("exportJson"))}</span></button></div></div>

   <div class="stack" style="gap:6px"><h3>${esc(t("qrSheet"))}</h3><p class="small">${esc(t("qrSheetText"))}</p>
   <div class="qrgrid">${POIS.map(p=>`<figure><div class="qr" data-qr="${p.id}"></div><figcaption>${esc(L10(p.name))}<br>${esc(p.town)}</figcaption></figure>`).join("")}</div></div>
   <p class="note">${esc(t("editNote"))}</p>`;
  $$("[data-qr]",v).forEach(q=>qrInto(q,placeUrl(q.dataset.qr)));
  const keep=()=>{d.name[state.ed.lang]=$("#ed-name").value;d.desc[state.ed.lang]=$("#ed-desc").value;d.cat=$("#ed-cat").value;d.status=$("#ed-ok").checked?"ok":"pending";};
  $("#ed-place").onchange=e=>{state.ed.id=e.target.value;state.ed.draft=null;renderAdmin();};
  $("#ed-lang").onclick=e=>{const b=e.target.closest("button");if(!b)return;keep();state.ed.lang=b.dataset.l;renderAdmin();$("#ed-name").focus();};
  $("#ed").onsubmit=e=>{e.preventDefault();keep();
    const p=BYID[d.id];const rec=EDITS.byId[p.id]=EDITS.byId[p.id]||{};
    rec.name=Object.assign({},d.name);rec.desc=Object.assign({},d.desc);rec.status=d.status;rec.cat=d.cat;
    p.name=Object.assign({},d.name);p.desc=Object.assign({},d.desc);p.status=d.status;
    if(p.cat!==d.cat){p.cat=d.cat;markers[p.id].setIcon(pinIcon(p));}
    const add=EDITS.added.find(a=>a.id===p.id);if(add){Object.assign(add,{name:p.name,desc:p.desc,status:p.status,cat:p.cat});}
    saveEdits();state.ed.draft=null;toast(t("saved"));renderAdmin();refreshMarkers();};
  $("#ed-view").onclick=()=>{keep();openPlace(d.id);};
  $("#ed-add").onclick=()=>{if(state.adding){stopAdding();renderAdmin();return;}
    state.adding=true;$("#map").classList.add("adding");toast(t("clickMap"));renderAdmin();
    map.once("click",ev=>{if(!state.adding)return;stopAdding();
      const ll={lat:+ev.latlng.lat.toFixed(5),lon:+ev.latlng.lng.toFixed(5)};
      const town=TOWNS.map(tw=>({tw,d:hav(ll,tw)})).sort((x,y)=>x.d-y.d)[0].tw.name;
      const np={id:"nuevo-"+Date.now().toString(36),town,cat:"patrimonio",lat:ll.lat,lon:ll.lon,name:{es:t("newPlace")},desc:{es:""},when:{es:""},status:"pending",added:true};
      POIS.push(np);BYID[np.id]=np;EDITS.added.push(np);saveEdits();addMarker(np);
      state.ed={id:np.id,lang:"es",draft:null};renderAdmin();refreshMarkers();
      const f=$("#ed-name");if(f){f.focus();f.select();}});};
  const rb=$("#ed-reset");rb.onclick=()=>{if(rb.dataset.armed){EDITS={byId:{},added:[]};saveEdits();try{location.reload();}catch(e){}return;}
    rb.dataset.armed="1";rb.classList.add("warn");rb.querySelector("span").textContent=t("resetConfirm");setTimeout(()=>{if(rb.isConnected){delete rb.dataset.armed;rb.classList.remove("warn");rb.querySelector("span").textContent=t("resetBtn");}},4000);};
  $("#exp").onclick=()=>copyText(JSON.stringify(POIS.map(p=>({id:p.id,municipio:p.town,categoria:p.cat,lat:p.lat,lon:p.lon,estado:p.status||"pending",nombre:p.name,descripcion:p.desc})),null,1));
}
function stopAdding(){state.adding=false;$("#map").classList.remove("adding");}

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  $$("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  $("#langs").innerHTML=LANGS.map(([k,lab])=>`<button type="button" data-l="${k}" aria-pressed="${k===lang}" lang="${k}">${lab}</button>`).join("");
  $$(".layerbox button").forEach(b=>b.textContent=t("base_"+b.dataset.k));
  $("#legend").innerHTML=Object.keys(CATS).map(c=>`<div style="--c:var(${CATS[c].color})"><i></i>${esc(t("cat_"+c))}</div>`).join("");
  POIS.forEach(p=>{const el=markers[p.id].getElement();if(el) el.setAttribute("title",L10(p.name));});
  stopAudio();
  render(state.tab);
}
$("#langs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;store.set("rbx-lang",lang);applyLang();});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.tab==="explorar") state.sel=null;setTab(b.dataset.tab);});
setBasemap("mapa",true);
function zoomClasses(){const z=map.getZoom(),el=$("#map");el.classList.toggle("zlow",z<11.4);el.classList.toggle("zfar",z<12);}
map.on("zoomend",zoomClasses);zoomClasses();

/* ---------- cover ---------- */
function showCover(){
  let seen=false;try{seen=sessionStorage.getItem("rbx-cover")==="1";}catch(e){}
  if(seen) return;
  const c=$("#cover");const key=DATA.coverPhoto||"rueda";const ph=PH[key];
  const draw=()=>{c.innerHTML=`${phHTML(key,"patrimonio",1280)}<div class="shade"></div>
    <div class="brandc"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="rgba(255,255,255,.16)"/><path d="M4 22c5-1 6-7 11-7s5 9 10 9 4-6 5-7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="23" cy="10" r="2.6" fill="#fff"/></svg><span>Ribera Baja Explora</span></div>
    <div class="clangs">${LANGS.map(([k,lab])=>`<button type="button" data-l="${k}" aria-pressed="${k===lang}">${lab}</button>`).join("")}</div>
    <div class="in"><div class="kick">${esc(t("coverKicker"))}</div><h1>${clauses(t("coverTitle"))}</h1><p>${esc(t("coverText"))}</p>
    <div class="row2"><button type="button" class="cbtn main" id="c-go">${esc(t("coverCta"))}</button><button type="button" class="cbtn" id="c-routes">${esc(t("coverRoutes"))}</button></div></div>
    ${ph?`<div class="credit">${esc(t("photo"))}: <a href="${esc(ph.page)}" target="_blank" rel="noopener">${esc(ph.author)}</a> · ${esc(ph.license)}</div>`:""}`;
    $("#c-go").onclick=()=>hideCover("inicio");$("#c-routes").onclick=()=>hideCover("rutas");
    $(".clangs",c).onclick=e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;store.set("rbx-lang",lang);applyLang();draw();};};
  draw();c.hidden=false;
  setTimeout(()=>{const g=$("#c-go");if(g) g.focus();},50);
}
function hideCover(tab){const c=$("#cover");c.hidden=true;c.innerHTML="";try{sessionStorage.setItem("rbx-cover","1");}catch(e){}
  if(tab&&tab!==state.tab) setTab(tab);setTimeout(()=>map.invalidateSize(),30);}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#cover").hidden) hideCover();});

/* ---------- hash routing ---------- */
function fromHash(){
  const h=(location.hash||"").slice(1);
  if(h&&!$("#cover").hidden){const c=$("#cover");c.hidden=true;c.innerHTML="";setTimeout(()=>map.invalidateSize(),30);}
  if(h.startsWith("p-")&&BYID[h.slice(2)]){state.sel=h.slice(2);const p=BYID[state.sel];setTab("lugar",false);map.setView([p.lat,p.lon],14);return;}
  if(h.startsWith("r-")&&DATA.routes.some(r=>r.id===h.slice(2))){state.route=h.slice(2);setTab("rutas",false);drawRoute(DATA.routes.find(r=>r.id===state.route));return;}
  if(["inicio","explorar","rutas","guias","gestion"].includes(h)){setTab(h,false);return;}
  setTab("inicio",false);showCover();
}
window.addEventListener("hashchange",fromHash);
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(state.adding){stopAdding();if(state.tab==="gestion")renderAdmin();return;}const bk=$("#back")||$("#rback");if(bk&&!e.target.closest("input,textarea,select"))bk.click();});
applyLang();
fromHash();
setTimeout(()=>map.invalidateSize(),60);
(function(){const b=$("#tomap"),mw=$("#mapwrap");if(!b||!mw) return;
  b.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
  const upd=()=>{const r=mw.getBoundingClientRect();if(isPhone()&&r.bottom<60) b.removeAttribute("data-off"); else b.setAttribute("data-off","");};
  window.addEventListener("scroll",upd,{passive:true});window.addEventListener("resize",upd);upd();})();
window.addEventListener("resize",()=>map.invalidateSize());
})();
</script>

</body>
</html>
