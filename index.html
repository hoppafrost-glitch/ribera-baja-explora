as fluviais"},"when":{"es":"Barca tradicional del Ebro","en":"Traditional Ebro ferry","fr":"Bac traditionnel de l'Èbre","de":"Traditionelle Ebro-Fähre","pt":"Barca tradicional do Ebro"},"desc":{"es":"Una barca tradicional cruza a las mejanas, las islas que forma el Ebro, donde hay huertas, aves y pequeños mamíferos. Antes de ir, conviene confirmar con el ayuntamiento si está en servicio.","en":"A traditional ferry crosses to the “mejanas”, the islands formed by the Ebro, with market gardens, birds and small mammals. Check with the town hall that it is running before you go.","fr":"Un bac traditionnel traverse vers les « mejanas », les îles formées par l'Èbre, avec potagers, oiseaux et petits mammifères. Avant d'y aller, vérifiez auprès de la mairie qu'il fonctionne.","de":"Eine traditionelle Fähre bringt Besucher zu den „mejanas“, den Inseln im Ebro mit Gärten, Vögeln und kleinen Säugetieren. Ob sie gerade fährt, erfährt man im Rathaus.","pt":"Uma barca tradicional atravessa até às «mejanas», as ilhas que o Ebro forma, com hortas, aves e pequenos mamíferos. Antes de ir, confirme com a câmara municipal se está a funcionar."},"more":{"es":"Es una barca de cable que cruza a la isla de Gelsa, y la guía del Camino Natural del Ebro la cita como una de las pocas que siguen en uso en el tramo aragonés, junto a las de Torres de Berrellén y Sobradiel. No es casualidad: Gelsa tuvo uno de los puertos fluviales del Ebro y muchos de sus vecinos fueron barqueros.","en":"It is a cable ferry crossing to the island of Gelsa, and the Ebro Nature Trail guide lists it as one of the few still in use on the Aragonese stretch of the river, along with those at Torres de Berrellén and Sobradiel. That is no accident: Gelsa had one of the Ebro's river ports, and many of its people worked as boatmen.","fr":"C'est un bac à câble qui traverse vers l'île de Gelsa ; le guide du Chemin naturel de l'Èbre le cite parmi les rares encore en service sur le tronçon aragonais, avec ceux de Torres de Berrellén et de Sobradiel. Ce n'est pas un hasard : Gelsa possédait l'un des ports fluviaux de l'Èbre et beaucoup de ses habitants étaient bateliers.","de":"Es handelt sich um eine Seilfähre zur Insel von Gelsa; der Führer zum Ebro-Naturweg nennt sie als eine der wenigen noch betriebenen im aragonesischen Abschnitt, neben denen von Torres de Berrellén und Sobradiel. Kein Zufall: Gelsa besaß einen der Flusshäfen am Ebro, und viele Bewohner waren Schiffer.","pt":"É uma barca de cabo que atravessa até à ilha de Gelsa, e o guia do Caminho Natural do Ebro aponta-a como uma das poucas ainda em uso no troço aragonês, juntamente com as de Torres de Berrellén e Sobradiel. Não é por acaso: Gelsa teve um dos portos fluviais do Ebro e muitos dos seus moradores foram barqueiros."},"visit":{"es":"Antes de ir, confirma con el Ayuntamiento de Gelsa si la barca está en servicio. La orilla se recorre libremente por el Camino Natural del Ebro.","en":"Before you go, check with Gelsa town hall that the ferry is running. The riverbank can be walked freely along the Ebro Nature Trail.","fr":"Avant d'y aller, vérifiez auprès de la mairie de Gelsa que le bac fonctionne. La berge se parcourt librement par le Chemin naturel de l'Èbre.","de":"Vorher im Rathaus von Gelsa erfragen, ob die Fähre in Betrieb ist. Das Ufer ist über den Ebro-Naturweg frei zugänglich.","pt":"Antes de ir, confirme com a Câmara Municipal de Gelsa se a barca está a funcionar. A margem percorre-se livremente pelo Caminho Natural do Ebro."}},{"id":"celsa","town":"Velilla de Ebro","cat":"arqueologia","lat":41.37234,"lon":-0.43395,"src":"https://pleiades.stoa.org/places/246321","name":{"es":"Colonia Lépida Celsa","en":"Roman colony of Lepida Celsa","fr":"Colonie romaine de Lepida Celsa","de":"Römische Kolonie Lepida Celsa","pt":"Colónia romana de Lepida Celsa"},"when":{"es":"Hacia el 44 a. C. · Bien de Interés Cultural","en":"c. 44 BC · Site of Cultural Interest","fr":"Vers 44 av. J.-C. · Bien d'intérêt culturel","de":"Um 44 v. Chr. · Kulturgut (BIC)","pt":"Cerca de 44 a. C. · Bem de Interesse Cultural"},"desc":{"es":"Primera colonia romana del valle del Ebro, fundada hacia el 44 a. C. por Marco Emilio Lépido sobre la ciudad ibera de Kelse. Tras la caída de Lépido pasó a llamarse Colonia Victrix Iulia Celsa y se abandonó hacia el año 70, cuando creció Caesaraugusta. Se recorren sus calles, el cardo y el decumano, y casas como la de los Delfines. Sus ruinas están protegidas desde 1931.","en":"The first Roman colony in the Ebro valley, founded around 44 BC by Marcus Aemilius Lepidus on the site of the Iberian town of Kelse. After Lepidus fell it was renamed Colonia Victrix Iulia Celsa, and it was abandoned around AD 70 as Caesaraugusta grew. You can walk its streets, the cardo and decumanus, and houses such as the House of the Dolphins. The ruins have been protected since 1931.","fr":"Première colonie romaine de la vallée de l'Èbre, fondée vers 44 av. J.-C. par Lépide (Marcus Aemilius Lepidus) sur le site de la ville ibère de Kelse. Après la chute de Lépide, elle devint Colonia Victrix Iulia Celsa, puis fut abandonnée vers l'an 70, à mesure que Caesaraugusta grandissait. On parcourt ses rues, le cardo et le decumanus, et des maisons comme celle des Dauphins. Les ruines sont protégées depuis 1931.","de":"Die erste römische Kolonie im Ebrotal, um 44 v. Chr. von Marcus Aemilius Lepidus an der Stelle der iberischen Stadt Kelse gegründet. Nach dem Sturz des Lepidus hieß sie Colonia Victrix Iulia Celsa und wurde um 70 n. Chr. aufgegeben, als Caesaraugusta wuchs. Man geht durch ihre Straßen, Cardo und Decumanus, und an Häusern wie dem Haus der Delfine vorbei. Die Ruinen stehen seit 1931 unter Schutz.","pt":"A primeira colónia romana do vale do Ebro, fundada por volta de 44 a. C. por Marco Emílio Lépido sobre a cidade ibera de Kelse. Após a queda de Lépido passou a chamar-se Colonia Victrix Iulia Celsa e foi abandonada por volta do ano 70, quando Caesaraugusta cresceu. Percorrem-se as suas ruas, o cardo e o decúmano, e casas como a dos Golfinhos. As ruínas estão protegidas desde 1931."},"more":{"es":"Además de la casa de los Delfines, llamada así por los delfines de sus mosaicos, se excavó la casa de Hércules, cuya sala principal estaba pintada en segundo estilo pompeyano con escenas de los trabajos del héroe. La colonia llegó a ocupar unas 44 hectáreas y se han identificado tiendas, almacenes, un mercado y una panadería. Antes de Roma, la Kelse ibera ya acuñaba su propia moneda.","en":"Besides the House of the Dolphins, named after the dolphins in its mosaics, excavators uncovered the House of Hercules, whose main room was painted in the Second Pompeian Style with scenes of the hero's labours. At its height the colony covered about 44 hectares, and shops, warehouses, a market and a bakery have been identified. Even before Rome, Iberian Kelse minted its own coins.","fr":"Outre la maison des Dauphins, qui doit son nom aux dauphins de ses mosaïques, on a fouillé la maison d'Hercule, dont la pièce principale était peinte dans le deuxième style pompéien, avec des scènes des travaux du héros. La colonie couvrait environ 44 hectares ; on y a identifié des boutiques, des entrepôts, un marché et une boulangerie. Avant Rome, la Kelse ibère frappait déjà sa propre monnaie.","de":"Neben dem Haus der Delfine, benannt nach den Delfinen seiner Mosaiken, wurde das Haus des Herkules freigelegt, dessen Hauptraum im zweiten pompejanischen Stil mit Szenen aus den Taten des Helden ausgemalt war. Die Kolonie umfasste rund 44 Hektar; nachgewiesen sind Läden, Lagerhäuser, ein Markt und eine Bäckerei. Schon vor den Römern prägte das iberische Kelse eigene Münzen.","pt":"Além da casa dos Golfinhos, assim chamada pelos golfinhos dos seus mosaicos, escavou-se a casa de Hércules, cuja sala principal estava pintada no segundo estilo pompeiano com cenas dos trabalhos do herói. A colónia chegou a ocupar cerca de 44 hectares e identificaram-se lojas, armazéns, um mercado e uma padaria. Antes de Roma, a Kelse ibera já cunhava moeda própria."},"visit":{"es":"El yacimiento y su centro dependen del Museo de Zaragoza: consulta horarios y visitas guiadas en museoza@aragon.es o en el Ayuntamiento de Velilla de Ebro. El terreno es irregular, así que lleva calzado cómodo y calcula al menos hora y media para museo y ruinas.","en":"The site and its museum centre are run by the Museum of Zaragoza: check opening times and guided tours at museoza@aragon.es or with Velilla de Ebro town hall. The ground is uneven, so wear sturdy shoes and allow at least an hour and a half for the museum and ruins.","fr":"Le site et son centre dépendent du musée de Saragosse : renseignez-vous sur les horaires et les visites guidées à museoza@aragon.es ou auprès de la mairie de Velilla de Ebro. Le terrain est irrégulier ; prévoyez de bonnes chaussures et au moins une heure et demie pour le musée et les ruines.","de":"Fundstätte und Museumszentrum gehören zum Museum Zaragoza: Öffnungszeiten und Führungen erfragt man unter museoza@aragon.es oder im Rathaus von Velilla de Ebro. Das Gelände ist uneben – feste Schuhe anziehen und mindestens anderthalb Stunden für Museum und Ruinen einplanen.","pt":"O sítio e o centro dependem do Museu de Saragoça: confirme horários e visitas guiadas através de museoza@aragon.es ou na Câmara Municipal (Ayuntamiento) de Velilla de Ebro. O terreno é irregular; leve calçado confortável e conte com pelo menos hora e meia para museu e ruínas."}},{"id":"celsa-museo","town":"Velilla de Ebro","cat":"museo","lat":41.3733,"lon":-0.4347,"src":"https://www.spain.info/es/lugares-interes/centro-monografico-colonia-celsa/","name":{"es":"Centro Monográfico de Celsa","en":"Celsa Museum Centre","fr":"Centre monographique de Celsa","de":"Museumszentrum Celsa","pt":"Centro Monográfico de Celsa"},"when":{"es":"Abierto en 1997 · Museo de Zaragoza","en":"Opened 1997 · Museum of Zaragoza","fr":"Ouvert en 1997 · musée de Saragosse","de":"Eröffnet 1997 · Museum Zaragoza","pt":"Aberto em 1997 · Museu de Saragoça"},"desc":{"es":"Sección del Museo de Zaragoza abierta en 1997 junto al yacimiento. Expone lo que han sacado a la luz las excavaciones de Celsa y ayuda a imaginar la vida diaria de la colonia antes de salir a recorrer sus calles.","en":"A branch of the Museum of Zaragoza, opened in 1997 next to the site. It shows what the excavations at Celsa have uncovered and helps you picture daily life in the colony before walking its streets.","fr":"Antenne du musée de Saragosse ouverte en 1997 à côté du site. Elle présente les découvertes des fouilles de Celsa et aide à imaginer la vie quotidienne de la colonie avant d'en parcourir les rues.","de":"Eine Außenstelle des Museums Zaragoza, 1997 neben der Ausgrabungsstätte eröffnet. Sie zeigt die Funde aus Celsa und vermittelt ein Bild vom Alltag der Kolonie, bevor man durch ihre Straßen geht.","pt":"Secção do Museu de Saragoça aberta em 1997 junto ao sítio arqueológico. Mostra o que as escavações de Celsa revelaram e ajuda a imaginar a vida quotidiana da colónia antes de percorrer as suas ruas."},"more":{"es":"Lo más abundante es la cerámica de terra sigillata itálica, junto a piezas de vidrio y metal, lucernas, bronces, monedas, joyas y fragmentos de mosaico. La sede arqueológica de Celsa la proyectó en 1983 José Manuel Pérez Latorre: un edificio de ladrillo visto con lucernarios, pensado para guardar los materiales sin romper el paisaje del yacimiento.","en":"Most of what is on show is Italian terra sigillata pottery, along with glass and metalwork, oil lamps, bronzes, coins, jewellery and fragments of mosaic. The archaeological base at Celsa was designed in 1983 by José Manuel Pérez Latorre: an exposed-brick building lit by skylights, meant to protect the finds without intruding on the landscape of the site.","fr":"On y voit surtout de la céramique sigillée italique, ainsi que du verre, du métal, des lampes à huile, des bronzes, des monnaies, des bijoux et des fragments de mosaïque. Le siège archéologique de Celsa a été conçu en 1983 par José Manuel Pérez Latorre : un bâtiment en brique apparente éclairé par des lanterneaux, pensé pour abriter le mobilier sans dénaturer le paysage du site.","de":"Am häufigsten ist italische Terra Sigillata, dazu Glas, Metallarbeiten, Öllampen, Bronzen, Münzen, Schmuck und Mosaikfragmente. Der archäologische Stützpunkt von Celsa wurde 1983 von José Manuel Pérez Latorre entworfen: ein Sichtziegelbau mit Oberlichtern, der die Funde schützen soll, ohne die Landschaft der Fundstätte zu stören.","pt":"O que mais abunda é a cerâmica de terra sigillata itálica, a par de peças de vidro e metal, lucernas, bronzes, moedas, joias e fragmentos de mosaico. A sede arqueológica de Celsa foi projetada em 1983 por José Manuel Pérez Latorre: um edifício de tijolo à vista com claraboias, pensado para guardar os materiais sem ferir a paisagem do sítio."},"visit":{"es":"La visita al centro se combina con el recorrido por el yacimiento. No hay un horario fijo que podamos confirmar: antes de ir, consulta con el Museo de Zaragoza (museoza@aragon.es).","en":"A visit to the centre goes together with a walk round the site. We could not confirm fixed opening hours, so check with the Museum of Zaragoza (museoza@aragon.es) before you go.","fr":"La visite du centre se combine avec le parcours du site. Nous n'avons pas pu confirmer d'horaires fixes : renseignez-vous auprès du musée de Saragosse (museoza@aragon.es) avant de venir.","de":"Der Besuch des Zentrums wird mit einem Rundgang durch die Ausgrabung verbunden. Feste Öffnungszeiten konnten wir nicht bestätigen – vorher beim Museum Zaragoza nachfragen (museoza@aragon.es).","pt":"A visita ao centro combina-se com o percurso pelo sítio arqueológico. Não conseguimos confirmar um horário fixo: antes de ir, contacte o Museu de Saragoça (museoza@aragon.es)."}},{"id":"velilla-sannicolas","town":"Velilla de Ebro","cat":"patrimonio","lat":41.37426,"lon":-0.43658,"src":"https://www.campaners.com/php/torrepdf.php?numer=681","name":{"es":"Ermita de San Nicolás de Bari","en":"Chapel of St Nicholas of Bari","fr":"Chapelle Saint-Nicolas-de-Bari","de":"Kapelle San Nicolás de Bari","pt":"Ermida de São Nicolau de Bari"},"when":{"es":"Siglo XIII · románico y barroco","en":"13th century · Romanesque and Baroque","fr":"XIIIe siècle · roman et baroque","de":"13. Jh. · Romanik und Barock","pt":"Século XIII · românico e barroco"},"desc":{"es":"Conserva el ábside y la cripta de una iglesia románica del siglo XIII; la nave se rehízo en estilo barroco entre 1679 y 1713. Su campana de las horas es gótica, del siglo XV. Desde la ermita se dominan el valle y el yacimiento de Celsa.","en":"It keeps the apse and crypt of a 13th-century Romanesque church; the nave was rebuilt in Baroque style between 1679 and 1713. Its clock bell is Gothic, from the 15th century. From the chapel you look over the valley and the site of Celsa.","fr":"Elle conserve l'abside et la crypte d'une église romane du XIIIe siècle ; la nef a été refaite en style baroque entre 1679 et 1713. Sa cloche des heures est gothique, du XVe siècle. Depuis la chapelle, on domine la vallée et le site de Celsa.","de":"Erhalten sind Apsis und Krypta einer romanischen Kirche des 13. Jahrhunderts; das Schiff wurde 1679 bis 1713 barock neu errichtet. Die Stundenglocke ist gotisch und stammt aus dem 15. Jahrhundert. Von hier überblickt man das Tal und die Ausgrabung von Celsa.","pt":"Conserva a abside e a cripta de uma igreja românica do século XIII; a nave foi refeita em estilo barroco entre 1679 e 1713. O sino das horas é gótico, do século XV. Da ermida avistam-se o vale e o sítio de Celsa."},"more":{"es":"Aquí colgaba la célebre «campana de Velilla», que según la tradición tocaba sola para anunciar muertes y desgracias; el último toque documentado es de 1686, y escribieron sobre ella Quevedo, Lope de Vega y Gracián. La campana figura hoy en el escudo del pueblo, y una de las actuales, fundida en 1971, se llama «la del Milagro». En las capillas laterales quedan restos de pintura barroca.","en":"This was home to the famous “bell of Velilla”, which according to tradition rang by itself to foretell deaths and disasters; the last recorded ringing was in 1686, and Quevedo, Lope de Vega and Gracián all wrote about it. The bell now appears on the town's coat of arms, and one of the present bells, cast in 1971, is called “the Miracle bell”. Traces of Baroque painting survive in the side chapels.","fr":"Ici pendait la célèbre « cloche de Velilla », qui selon la tradition sonnait toute seule pour annoncer morts et malheurs ; la dernière sonnerie attestée date de 1686, et Quevedo, Lope de Vega et Gracián en ont parlé. La cloche figure aujourd'hui sur le blason du village, et l'une des cloches actuelles, fondue en 1971, s'appelle « celle du Miracle ». Les chapelles latérales gardent des restes de peinture baroque.","de":"Hier hing die berühmte „Glocke von Velilla“, die der Überlieferung nach von selbst läutete, um Todesfälle und Unglück anzukündigen; zuletzt belegt ist das 1686, und Quevedo, Lope de Vega und Gracián schrieben darüber. Die Glocke ziert heute das Ortswappen, und eine der heutigen Glocken, 1971 gegossen, heißt „die des Wunders“. In den Seitenkapellen sind Reste barocker Malerei erhalten.","pt":"Aqui esteve o célebre «sino de Velilla», que segundo a tradição tocava sozinho para anunciar mortes e desgraças; o último toque documentado é de 1686, e Quevedo, Lope de Vega e Gracián escreveram sobre ele. O sino figura hoje no brasão da vila, e um dos sinos atuais, fundido em 1971, chama-se «o do Milagre». Nas capelas laterais restam vestígios de pintura barroca."},"visit":{"es":"Se sube a pie desde el pueblo; el exterior y el mirador son de acceso libre. Para ver el interior, consulta en el Ayuntamiento de Velilla de Ebro.","en":"It is a short walk up from the village; the outside and the viewpoint are open at all times. To see inside, ask at Velilla de Ebro town hall.","fr":"On y monte à pied depuis le village ; l'extérieur et le belvédère sont en accès libre. Pour voir l'intérieur, renseignez-vous à la mairie de Velilla de Ebro.","de":"Man steigt zu Fuß vom Ort hinauf; Außenbau und Aussichtspunkt sind frei zugänglich. Wer hinein möchte, fragt im Rathaus von Velilla de Ebro.","pt":"Sobe-se a pé desde a vila; o exterior e o miradouro são de acesso livre. Para ver o interior, informe-se no Ayuntamiento de Velilla de Ebro."}},{"id":"velilla-asuncion","town":"Velilla de Ebro","cat":"patrimonio","lat":41.3737,"lon":-0.43733,"src":"https://campaners.com/php/torrepdf.php?numer=9450","name":{"es":"Iglesia de la Asunción de Velilla","en":"Church of the Assumption, Velilla","fr":"Église de l'Assomption de Velilla","de":"Mariä-Himmelfahrt-Kirche, Velilla","pt":"Igreja da Assunção de Velilla"},"when":{"es":"Siglo XVI · renacentista y mudéjar","en":"16th century · Renaissance and Mudéjar","fr":"XVIe siècle · Renaissance et mudéjar","de":"16. Jh. · Renaissance und Mudéjar","pt":"Século XVI · renascentista e mudéjar"},"desc":{"es":"Templo del siglo XVI de ladrillo sobre zócalo de sillar, que mezcla rasgos renacentistas y mudéjares. Tiene bóvedas estrelladas; el cuerpo octogonal y el chapitel de la torre son de 1679. Está catalogado como Monumento de Interés Local.","en":"A 16th-century brick church on an ashlar base, mixing Renaissance and Mudéjar features. It has star vaults; the octagonal stage and spire of the tower date from 1679. It is listed as a Monument of Local Interest.","fr":"Église du XVIe siècle en brique sur un soubassement en pierre de taille, mêlant traits Renaissance et mudéjars. Elle a des voûtes étoilées ; le corps octogonal et la flèche du clocher datent de 1679. Elle est classée monument d'intérêt local.","de":"Backsteinkirche des 16. Jahrhunderts auf Quadersockel, mit Zügen von Renaissance und Mudéjar. Sie hat Sterngewölbe; das achteckige Geschoss und der Turmhelm stammen von 1679. Sie ist als Denkmal von lokalem Interesse eingetragen.","pt":"Igreja do século XVI em tijolo sobre embasamento de cantaria, que mistura traços renascentistas e mudéjares. Tem abóbadas estreladas; o corpo octogonal e o coruchéu da torre são de 1679. Está classificada como Monumento de Interesse Local."},"more":{"es":"La planta es de tradición mudéjar, una sola nave con capillas entre los contrafuertes, pero las soluciones decorativas son ya renacentistas. En el siglo XVIII se perforaron los contrafuertes y desde dentro la iglesia parece hoy de tres naves. Fíjate en la torre, esbelta y de ladrillo: en lo alto de su primer cuerpo lleva bandas de ladrillo en esquinilla, en dientes de sierra.","en":"The layout follows Mudéjar tradition, a single nave with chapels between the buttresses, but the decorative treatment is already Renaissance. In the 18th century the buttresses were pierced, so from inside the church now looks as if it had three naves. Look at the slender brick tower: the top of its lower stage has bands of angled bricks forming a saw-tooth pattern.","fr":"Le plan suit la tradition mudéjare, une nef unique avec des chapelles entre les contreforts, mais le décor est déjà Renaissance. Au XVIIIe siècle, on a percé les contreforts, si bien que l'intérieur semble aujourd'hui à trois nefs. Observez le clocher, élancé et en brique : le haut de son premier niveau porte des bandes de briques posées en dents de scie.","de":"Der Grundriss folgt der Mudéjar-Tradition – ein Schiff mit Kapellen zwischen den Strebepfeilern –, die Formensprache ist aber schon Renaissance. Im 18. Jahrhundert wurden die Strebepfeiler durchbrochen, sodass der Innenraum heute dreischiffig wirkt. Sehenswert ist der schlanke Backsteinturm: Oben am ersten Geschoss laufen über Eck gestellte Ziegelbänder im Sägezahnmuster.","pt":"A planta é de tradição mudéjar, uma só nave com capelas entre os contrafortes, mas as soluções decorativas já são renascentistas. No século XVIII os contrafortes foram perfurados e por dentro a igreja parece hoje ter três naves. Repare na torre, esguia e de tijolo: no alto do primeiro corpo tem faixas de tijolo em esquadria, em dentes de serra."},"visit":{"es":"Exterior visible en todo momento; para ver el interior, aprovecha el horario de culto o consulta en el Ayuntamiento de Velilla de Ebro.","en":"The exterior can be seen at any time; to see inside, go at service times or ask at Velilla de Ebro town hall.","fr":"Extérieur visible à tout moment ; pour l'intérieur, venez aux heures des offices ou renseignez-vous à la mairie de Velilla de Ebro.","de":"Außen jederzeit zu sehen; innen zu den Gottesdienstzeiten oder nach Anfrage im Rathaus von Velilla de Ebro.","pt":"Exterior visível a qualquer hora; para ver o interior, aproveite o horário das celebrações ou informe-se no Ayuntamiento de Velilla de Ebro."}},{"id":"zaida-sanjose","town":"La Zaida","cat":"patrimonio","lat":41.32878,"lon":-0.42757,"src":"https://campaners.com/php/torrepdf.php?numer=802","name":{"es":"Iglesia de San José","en":"Church of St Joseph","fr":"Église Saint-Joseph","de":"Kirche San José","pt":"Igreja de São José"},"when":{"es":"Siglo XVII · torre reconstruida en 1997–1999","en":"17th century · tower rebuilt 1997–1999","fr":"XVIIe siècle · clocher reconstruit en 1997–1999","de":"17. Jh. · Turm 1997–1999 wiederaufgebaut","pt":"Século XVII · torre reconstruída em 1997–1999"},"desc":{"es":"Iglesia de una nave, probablemente de la segunda mitad del siglo XVII. Junto a la portada luce un escudo atribuido a los duques de Villahermosa. El segundo cuerpo de la torre se perdió en la Guerra Civil y se reconstruyó entre 1997 y 1999.","en":"A single-nave church, probably from the second half of the 17th century. Beside the doorway is a coat of arms attributed to the Dukes of Villahermosa. The tower's upper stage was lost in the Civil War and rebuilt between 1997 and 1999.","fr":"Église à nef unique, probablement de la seconde moitié du XVIIe siècle. À côté du portail, un blason attribué aux ducs de Villahermosa. L'étage supérieur du clocher, détruit pendant la guerre civile, a été reconstruit entre 1997 et 1999.","de":"Einschiffige Kirche, vermutlich aus der zweiten Hälfte des 17. Jahrhunderts. Neben dem Portal ein Wappen, das den Herzögen von Villahermosa zugeschrieben wird. Das obere Turmgeschoss ging im Bürgerkrieg verloren und wurde 1997 bis 1999 wieder aufgebaut.","pt":"Igreja de nave única, provavelmente da segunda metade do século XVII. Junto ao portal tem um brasão atribuído aos duques de Villahermosa. O corpo superior da torre perdeu-se na Guerra Civil e foi reconstruído entre 1997 e 1999."},"more":{"es":"El escudo es de mármol negro y lleva corona ducal; a su lado hay una lápida de 1720 que parece de la misma época. La portada se abre bajo un pórtico con un arco central y dos más pequeños, y sus dovelas alternas forman un dentado decorativo. La base de la torre, de grandes mampuestos, es anterior a la iglesia; arriba remata en un cuerpo octogonal con chapitel bulboso.","en":"The coat of arms is carved in black marble and topped by a ducal crown; beside it is a plaque dated 1720 that seems to be of the same period. The doorway sits under a porch with one central arch and two smaller ones, and its alternating voussoirs form a toothed pattern. The base of the tower, of large rubble stones, is older than the church; at the top it ends in an octagonal stage with a bulbous spire.","fr":"Le blason est en marbre noir, sommé d'une couronne ducale ; à côté, une plaque de 1720 semble de la même époque. Le portail s'ouvre sous un porche à un arc central flanqué de deux plus petits, et ses claveaux alternés dessinent un décor denté. La base du clocher, en gros moellons, est antérieure à l'église ; il se termine par un niveau octogonal coiffé d'un bulbe.","de":"Das Wappen ist aus schwarzem Marmor und trägt eine Herzogskrone; daneben eine Tafel von 1720, die aus derselben Zeit zu stammen scheint. Das Portal liegt unter einer Vorhalle mit einem mittleren und zwei kleineren Bögen, die wechselnden Keilsteine bilden ein Zahnmuster. Der Turmsockel aus großen Bruchsteinen ist älter als die Kirche; oben schließt der Turm mit einem achteckigen Geschoss und Zwiebelhelm.","pt":"O brasão é de mármore negro, com coroa ducal; ao lado há uma lápide de 1720 que parece da mesma época. O portal abre-se sob um alpendre com um arco central e dois mais pequenos, e as aduelas alternadas formam um denteado decorativo. A base da torre, de grandes pedras de alvenaria, é anterior à igreja; no alto remata num corpo octogonal com coruchéu bolboso."},"visit":{"es":"Exterior visible en todo momento; para el interior, acude en horario de culto o consulta en el Ayuntamiento de La Zaida.","en":"The exterior can be seen at any time; for the interior, go at service times or ask at La Zaida town hall.","fr":"Extérieur visible à tout moment ; pour l'intérieur, venez aux heures des offices ou renseignez-vous à la mairie de La Zaida.","de":"Außen jederzeit zu sehen; innen zu den Gottesdienstzeiten oder nach Anfrage im Rathaus von La Zaida.","pt":"Exterior visível a qualquer hora; para o interior, vá no horário das celebrações ou informe-se no Ayuntamiento de La Zaida."}},{"id":"alforque-sanpedro","town":"Alforque","cat":"patrimonio","lat":41.32802,"lon":-0.38583,"src":"https://www.campaners.com/php/torrepdf.php?numer=9526","name":{"es":"Iglesia de San Pedro Apóstol","en":"Church of St Peter the Apostle","fr":"Église Saint-Pierre-Apôtre","de":"Kirche San Pedro Apóstol","pt":"Igreja de São Pedro Apóstolo"},"when":{"es":"Bóvedas estrelladas · inscripciones de 1658, 1694 y 1891","en":"Star vaults · inscriptions of 1658, 1694 and 1891","fr":"Voûtes étoilées · inscriptions de 1658, 1694 et 1891","de":"Sterngewölbe · Inschriften von 1658, 1694 und 1891","pt":"Abóbadas estreladas · inscrições de 1658, 1694 e 1891"},"desc":{"es":"Iglesia de una nave con bóvedas estrelladas y ábside poligonal, hermana de la de Velilla. La curiosidad está en su portada: las dovelas guardan inscripciones que registran los años en que el Ebro se heló, en 1658, 1694 y 1891.","en":"A single-nave church with star vaults and a polygonal apse, a sister to the one in Velilla. The curiosity is its doorway: the voussoirs carry inscriptions recording the years the Ebro froze over, in 1658, 1694 and 1891.","fr":"Église à nef unique avec voûtes étoilées et abside polygonale, sœur de celle de Velilla. Sa curiosité est le portail : les claveaux portent des inscriptions qui rappellent les années où l'Èbre a gelé, en 1658, 1694 et 1891.","de":"Einschiffige Kirche mit Sterngewölben und polygonaler Apsis, eine Schwester der Kirche von Velilla. Besonders ist ihr Portal: Die Keilsteine tragen Inschriften über die Jahre, in denen der Ebro zufror, 1658, 1694 und 1891.","pt":"Igreja de nave única com abóbadas estreladas e abside poligonal, irmã da de Velilla. A curiosidade está no portal: as aduelas guardam inscrições que registam os anos em que o Ebro gelou, em 1658, 1694 e 1891."},"more":{"es":"Las bóvedas estrelladas de la nave y la cabecera tienen terceletes y combados. La capilla más vistosa es la del lado de la epístola, más alta y profunda: su bóveda lleva escudos de yeso, una gruesa clave colgante y medallones en espiral, y su embocadura recuerda modelos del Quattrocento italiano. El Camino Natural del Ebro rodea el pueblo junto al río y pasa al lado de la iglesia.","en":"The star vaults over the nave and apse have tiercerons and curved ribs. The finest chapel is on the south (Epistle) side, taller and deeper than the rest: its vault has plaster coats of arms, a heavy hanging boss and spiral medallions, and its entrance arch recalls Italian Quattrocento designs. The Ebro Nature Trail loops round the village by the river and passes right by the church.","fr":"Les voûtes étoilées de la nef et du chevet ont tiercerons et liernes courbes. La chapelle la plus remarquable est celle du côté de l'épître, plus haute et plus profonde : sa voûte porte des blasons en plâtre, une grosse clé pendante et des médaillons en spirale, et son arc d'entrée rappelle le Quattrocento italien. Le Chemin naturel de l'Èbre contourne le village le long du fleuve et passe à côté de l'église.","de":"Die Sterngewölbe über Schiff und Chor haben Tiercerons und geschwungene Rippen. Am schönsten ist die Kapelle auf der Epistelseite, höher und tiefer als die übrigen: Ihr Gewölbe trägt Gipswappen, einen schweren Hängeschlussstein und Spiralmedaillons, ihr Eingangsbogen erinnert an Vorbilder des italienischen Quattrocento. Der Camino Natural del Ebro umrundet den Ort am Fluss und führt direkt an der Kirche vorbei.","pt":"As abóbadas estreladas da nave e da cabeceira têm terceletes e nervuras curvas. A capela mais vistosa é a do lado da epístola, mais alta e profunda: a abóbada tem brasões em gesso, um grosso fecho pendente e medalhões em espiral, e o arco de entrada lembra modelos do Quattrocento italiano. O Caminho Natural do Ebro contorna a vila junto ao rio e passa ao lado da igreja."},"visit":{"es":"Las inscripciones de la portada se ven desde la calle en cualquier momento; para el interior, acude en horario de culto o consulta en el Ayuntamiento de Alforque.","en":"The doorway inscriptions can be seen from the street at any time; for the interior, go at service times or ask at Alforque town hall.","fr":"Les inscriptions du portail se voient depuis la rue à tout moment ; pour l'intérieur, venez aux heures des offices ou renseignez-vous à la mairie d'Alforque.","de":"Die Inschriften am Portal sind jederzeit von der Straße aus zu sehen; innen zu den Gottesdienstzeiten oder nach Anfrage im Rathaus von Alforque.","pt":"As inscrições do portal veem-se da rua a qualquer hora; para o interior, vá no horário das celebrações ou informe-se no Ayuntamiento de Alforque."}},{"id":"cincoolivas-santiago","town":"Cinco Olivas","cat":"patrimonio","lat":41.34051,"lon":-0.37204,"src":"https://www.campaners.com/php/torrepdf.php?numer=9646","name":{"es":"Iglesia de Santiago","en":"Church of St James","fr":"Église Saint-Jacques","de":"Kirche Santiago","pt":"Igreja de Santiago"},"when":{"es":"Siglo XVII · remate de la torre del XVIII","en":"17th century · 18th-century tower top","fr":"XVIIe siècle · couronnement du clocher du XVIIIe","de":"17. Jh. · Turmabschluss 18. Jh.","pt":"Século XVII · remate da torre do XVIII"},"desc":{"es":"Iglesia de cruz latina con capillas laterales, probablemente de la segunda mitad del siglo XVII. Está hecha de mampostería con verdugadas de ladrillo, y el remate de la torre se añadió hacia mediados del XVIII.","en":"A Latin-cross church with side chapels, probably from the second half of the 17th century. It is built of rubble stone with courses of brick, and the top of the tower was added around the mid-18th century.","fr":"Église en croix latine avec chapelles latérales, probablement de la seconde moitié du XVIIe siècle. Elle est bâtie en moellons avec des assises de brique, et le couronnement du clocher a été ajouté vers le milieu du XVIIIe siècle.","de":"Kirche über lateinischem Kreuz mit Seitenkapellen, vermutlich aus der zweiten Hälfte des 17. Jahrhunderts. Gebaut aus Bruchstein mit Ziegelbändern; der Turmabschluss kam um die Mitte des 18. Jahrhunderts hinzu.","pt":"Igreja em cruz latina com capelas laterais, provavelmente da segunda metade do século XVII. É de alvenaria com fiadas de tijolo, e o remate da torre foi acrescentado por meados do século XVIII."},"more":{"es":"Por fuera destaca la linterna octogonal que asoma sobre la cúpula del crucero. Dentro, la pila bautismal tiene relieves de ángeles y guirnaldas. Las molduras de la nave son más toscas que las del crucero y la cabecera, señal probable de que las obras se pararon y siguieron con menos medios. El último cuerpo de la torre, de ladrillo y con esquinas achaflanadas, recuerda al de la iglesia de Sástago.","en":"From outside, the eye goes to the octagonal lantern rising over the crossing dome. Inside, the font is carved with angels and garlands. The mouldings in the nave are cruder than those of the crossing and apse, a likely sign that building stopped and later resumed on a tighter budget. The brick top stage of the tower, with chamfered corners, recalls the church in Sástago.","fr":"De l'extérieur, on remarque la lanterne octogonale qui surmonte la coupole de la croisée. À l'intérieur, les fonts baptismaux portent des reliefs d'anges et de guirlandes. Les moulures de la nef sont plus frustes que celles de la croisée et du chevet, signe probable d'un arrêt des travaux, repris ensuite avec moins de moyens. Le dernier niveau du clocher, en brique aux angles abattus, rappelle celui de l'église de Sástago.","de":"Außen fällt die achteckige Laterne über der Vierungskuppel auf. Innen zeigt das Taufbecken Reliefs mit Engeln und Girlanden. Die Gesimse im Schiff sind gröber als in Vierung und Chor – vermutlich ruhte der Bau eine Zeit und wurde dann mit weniger Mitteln fortgesetzt. Das oberste Turmgeschoss aus Backstein mit abgeschrägten Ecken erinnert an die Kirche von Sástago.","pt":"Por fora destaca-se a lanterna octogonal que surge sobre a cúpula do cruzeiro. Lá dentro, a pia batismal tem relevos de anjos e grinaldas. As molduras da nave são mais toscas do que as do cruzeiro e da cabeceira, sinal provável de que as obras pararam e prosseguiram com menos meios. O último corpo da torre, de tijolo e com cantos chanfrados, lembra o da igreja de Sástago."},"visit":{"es":"Exterior visible en todo momento; para el interior, acude en horario de culto o consulta en el Ayuntamiento de Cinco Olivas.","en":"The exterior can be seen at any time; for the interior, go at service times or ask at Cinco Olivas town hall.","fr":"Extérieur visible à tout moment ; pour l'intérieur, venez aux heures des offices ou renseignez-vous à la mairie de Cinco Olivas.","de":"Außen jederzeit zu sehen; innen zu den Gottesdienstzeiten oder nach Anfrage im Rathaus von Cinco Olivas.","pt":"Exterior visível a qualquer hora; para o interior, vá no horário das celebrações ou informe-se no Ayuntamiento de Cinco Olivas."}},{"id":"sastago-fortin","town":"Sástago","cat":"patrimonio","lat":41.32626,"lon":-0.37332,"src":"https://www.mapa.gob.es/en/desarrollo-rural/temas/caminos-naturales/caminos-naturales/sector-noreste/ebro/etapa29/default.aspx","name":{"es":"Fortín de Sástago y azud de Cinco Olivas","en":"Sástago fort and Cinco Olivas weir","fr":"Fortin de Sástago et barrage de Cinco Olivas","de":"Fort von Sástago und Wehr von Cinco Olivas","pt":"Fortim de Sástago e açude de Cinco Olivas"},"when":{"es":"Siglo XIX · Tercera Guerra Carlista","en":"19th century · Third Carlist War","fr":"XIXe siècle · troisième guerre carliste","de":"19. Jh. · Dritter Karlistenkrieg","pt":"Século XIX · Terceira Guerra Carlista"},"desc":{"es":"Recinto pentagonal con foso y torre de telegrafía óptica levantado durante la Tercera Guerra Carlista. Formaba parte de la línea de torres de telegrafía óptica que seguía el Ebro aguas abajo de Zaragoza. Se asoma al azud de Cinco Olivas, que hoy alimenta una pequeña central eléctrica.","en":"A pentagonal enclosure with a moat and an optical telegraph tower, built during the Third Carlist War. It was part of the chain of telegraph towers that followed the Ebro downstream from Zaragoza. It overlooks the Cinco Olivas weir, which now feeds a small hydroelectric plant.","fr":"Enceinte pentagonale avec fossé et tour de télégraphe optique, construite pendant la troisième guerre carliste. Elle faisait partie de la ligne de tours télégraphiques qui suivait l'Èbre en aval de Saragosse. Elle surplombe le barrage de Cinco Olivas, qui alimente aujourd'hui une petite centrale électrique.","de":"Fünfeckige Anlage mit Graben und optischem Telegrafenturm, errichtet im Dritten Karlistenkrieg. Sie gehörte zur Kette von Telegrafentürmen, die dem Ebro flussabwärts von Zaragoza folgte. Sie liegt über dem Wehr von Cinco Olivas, das heute ein kleines Wasserkraftwerk speist.","pt":"Recinto pentagonal com fosso e torre de telegrafia ótica, construído durante a Terceira Guerra Carlista. Fazia parte da linha de torres telegráficas que seguia o Ebro a jusante de Saragoça. Debruça-se sobre o açude de Cinco Olivas, que hoje alimenta uma pequena central elétrica."},"more":{"es":"Se levantó en otoño de 1875: un recinto con baluartes y garitas que rodea una torre cuadrada de esquinas achaflanadas, que ha perdido sus tres pisos superiores. Desde él se divisaban los fortines del Mocatero, en Escatrón, y el castillo de la Palma. Bajo el azud, el agua mueve una minicentral que antes fue un molino de rueda horizontal, y parte se desvía por un túnel hacia una central de Sástago.","en":"It was built in the autumn of 1875: an enclosure with bastions and sentry boxes around a square tower with chamfered corners, which has lost its three upper floors. From here the garrison could see the Mocatero forts at Escatrón and the Castillo de la Palma. Below, the weir drives a mini hydro plant that was once a horizontal-wheel mill, and some of the water runs through a tunnel to one of Sástago's power stations.","fr":"Il fut construit à l'automne 1875 : une enceinte à bastions et échauguettes entourant une tour carrée aux angles abattus, qui a perdu ses trois étages supérieurs. De là, on voyait les fortins du Mocatero, à Escatrón, et le château de la Palma. En contrebas, le barrage alimente une mini-centrale qui fut autrefois un moulin à roue horizontale, et une partie de l'eau part par un tunnel vers une centrale de Sástago.","de":"Errichtet wurde es im Herbst 1875: eine Anlage mit Bastionen und Wachhäuschen um einen quadratischen Turm mit abgeschrägten Ecken, dem heute die drei oberen Stockwerke fehlen. Von hier sah man die Forts von Mocatero bei Escatrón und die Burg La Palma. Unten treibt das Wehr ein Kleinkraftwerk an, früher eine Mühle mit horizontalem Rad; ein Teil des Wassers fließt durch einen Tunnel zu einem Kraftwerk in Sástago.","pt":"Foi erguido no outono de 1875: um recinto com baluartes e guaritas em torno de uma torre quadrada de cantos chanfrados, que perdeu os três pisos superiores. Dali avistavam-se os fortins do Mocatero, em Escatrón, e o castelo de la Palma. Em baixo, o açude move uma minicentral que antes foi um moinho de roda horizontal, e parte da água segue por um túnel para uma central de Sástago."},"visit":{"es":"Ruina en lo alto de un cerro, de acceso libre por caminos; visítala por fuera y con precaución. El Camino Natural del Ebro (GR 99) pasa junto al azud.","en":"A ruin on a hilltop, freely reached on foot along tracks; see it from outside and take care. The Ebro Nature Trail (GR 99) passes by the weir.","fr":"Ruine au sommet d'une colline, accessible librement par des chemins ; visitez-la de l'extérieur et avec prudence. Le Chemin naturel de l'Èbre (GR 99) passe près du barrage.","de":"Ruine auf einer Anhöhe, frei über Wege erreichbar; nur von außen und mit Vorsicht besichtigen. Der Camino Natural del Ebro (GR 99) führt am Wehr vorbei.","pt":"Ruína no alto de um cerro, de acesso livre por caminhos; visite-a por fora e com cuidado. O Caminho Natural do Ebro (GR 99) passa junto ao açude."}},{"id":"alborge-sanlorenzo","town":"Alborge","cat":"patrimonio","lat":41.33487,"lon":-0.35858,"src":"https://campaners.com/php/torrepdf.php?numer=9513","name":{"es":"Iglesia de San Lorenzo Mártir","en":"Church of St Lawrence","fr":"Église Saint-Laurent","de":"Kirche San Lorenzo","pt":"Igreja de São Lourenço"},"when":{"es":"Cúpula con yeserías de influencia del XVIII zaragozano","en":"Dome with stucco work in 18th-century Zaragoza style","fr":"Coupole aux stucs d'influence saragossaine du XVIIIe","de":"Kuppel mit Stuck im Zaragozaner Stil des 18. Jh.","pt":"Cúpula com estuques de influência saragoçana do século XVIII"},"desc":{"es":"Iglesia de cruz latina y una sola nave. Lo que más llama la atención está arriba: la cúpula octogonal tiene relieves de yeso de los cuatro evangelistas, con la influencia del barroco zaragozano del siglo XVIII.","en":"A single-nave church on a Latin-cross plan. The thing to look up at is the octagonal dome, with plaster reliefs of the four Evangelists showing the influence of 18th-century Zaragoza Baroque.","fr":"Église à nef unique en croix latine. Il faut lever les yeux vers la coupole octogonale, ornée de reliefs en plâtre des quatre évangélistes, sous l'influence du baroque saragossain du XVIIIe siècle.","de":"Einschiffige Kirche über lateinischem Kreuz. Der Blick geht nach oben zur achteckigen Kuppel mit Gipsreliefs der vier Evangelisten im Stil des Zaragozaner Barocks des 18. Jahrhunderts.","pt":"Igreja de nave única em cruz latina. O que mais chama a atenção está no alto: a cúpula octogonal tem relevos em gesso dos quatro evangelistas, com influência do barroco saragoçano do século XVIII."},"more":{"es":"En la cúpula se abren ocho ventanas de medio punto con mascarones de yeso en las claves, y cada evangelista aparece junto a su símbolo. En dos pilastras de la nave sobreviven esgrafiados con jarrones, roleos de vid, pájaros y figuras humanas. Sobre la puerta, una hornacina guarda la imagen de San Lorenzo, y una de las campanas de la torre se llama Santa María de Montler.","en":"Eight round-arched windows pierce the dome, with plaster masks on their keystones, and each Evangelist is shown with his symbol. On two of the nave pilasters, sgraffito decoration survives with vases, vine scrolls, birds and human figures. Above the door a niche holds a statue of St Lawrence, and one of the tower bells is named Santa María de Montler.","fr":"Huit fenêtres en plein cintre percent la coupole, avec des mascarons en plâtre à la clé, et chaque évangéliste apparaît avec son symbole. Sur deux pilastres de la nef subsistent des sgraffites : vases, rinceaux de vigne, oiseaux et figures humaines. Au-dessus de la porte, une niche abrite la statue de saint Laurent, et l'une des cloches du clocher s'appelle Santa María de Montler.","de":"Acht Rundbogenfenster durchbrechen die Kuppel, mit Gipsmasken als Schlusssteinen; jeder Evangelist erscheint mit seinem Symbol. An zwei Pilastern des Schiffs sind Sgraffiti mit Vasen, Weinranken, Vögeln und menschlichen Figuren erhalten. Über der Tür steht in einer Nische die Figur des heiligen Laurentius, und eine der Turmglocken heißt Santa María de Montler.","pt":"Na cúpula abrem-se oito janelas de volta perfeita com máscaras de gesso nos fechos, e cada evangelista surge junto ao seu símbolo. Em duas pilastras da nave sobrevivem esgrafitos com jarras, enrolamentos de videira, pássaros e figuras humanas. Sobre a porta, um nicho guarda a imagem de São Lourenço, e um dos sinos da torre chama-se Santa María de Montler."},"visit":{"es":"Exterior visible en todo momento; para ver la cúpula, acude en horario de culto o consulta en el Ayuntamiento de Alborge.","en":"The exterior can be seen at any time; to see the dome, go at service times or ask at Alborge town hall.","fr":"Extérieur visible à tout moment ; pour voir la coupole, venez aux heures des offices ou renseignez-vous à la mairie d'Alborge.","de":"Außen jederzeit zu sehen; die Kuppel zu den Gottesdienstzeiten oder nach Anfrage im Rathaus von Alborge.","pt":"Exterior visível a qualquer hora; para ver a cúpula, vá no horário das celebrações ou informe-se no Ayuntamiento de Alborge."}},{"id":"montler","town":"Sástago","cat":"camino","lat":41.3424,"lon":-0.33059,"src":"https://campaners.com/php/torrepdf.php?numer=9733","name":{"es":"Ermita de Nuestra Señora de Montler","en":"Chapel of Our Lady of Montler","fr":"Chapelle Notre-Dame de Montler","de":"Kapelle Nuestra Señora de Montler","pt":"Ermida de Nossa Senhora de Montler"},"when":{"es":"Origen medieval · edificio del siglo XVIII","en":"Medieval origin · 18th-century building","fr":"Origine médiévale · édifice du XVIIIe siècle","de":"Mittelalterlicher Ursprung · Bau des 18. Jh.","pt":"Origem medieval · edifício do século XVIII"},"desc":{"es":"La ermita se donó en 1292 al Monasterio de Rueda, que la tuvo hasta 1836; el edificio actual es del siglo XVIII. Desde su cornisa se ven los meandros del Ebro y por su lado pasa el Camino Jacobeo del Ebro, entre Alborge y Sástago.","en":"In 1292 it was given to the Monastery of Rueda, which held it until 1836; the present building is 18th-century. From its ridge you can see the meanders of the Ebro, and the Ebro Way of St James passes alongside, between Alborge and Sástago.","fr":"Donnée en 1292 au monastère de Rueda, qui la garda jusqu'en 1836 ; l'édifice actuel date du XVIIIe siècle. De sa crête, on voit les méandres de l'Èbre, et le Chemin de Saint-Jacques de l'Èbre passe à côté, entre Alborge et Sástago.","de":"1292 dem Kloster Rueda geschenkt, das sie bis 1836 besaß; das heutige Gebäude stammt aus dem 18. Jahrhundert. Vom Kamm aus sieht man die Ebroschleifen, und der Jakobsweg am Ebro führt hier zwischen Alborge und Sástago vorbei.","pt":"Doada em 1292 ao Mosteiro de Rueda, que a teve até 1836; o edifício atual é do século XVIII. Do alto da escarpa veem-se os meandros do Ebro, e por ali passa o Caminho de Santiago do Ebro, entre Alborge e Sástago."},"more":{"es":"Ante la puerta hay un pórtico de dos alturas rematado por una espadaña, y junto a la fachada se alza una estructura cuadrada de sillería que parece un campanario que nunca se terminó. Una sala lateral, sin paso a la nave, conserva un escudo del Monasterio de Rueda. En la base de la nave podría haber restos de la iglesia medieval; el edificio se restauró por última vez en 2010–2011.","en":"In front of the door is a two-storey porch topped by a bellcote, and beside the façade rises a square block of ashlar that looks like a bell tower that was never finished. A side room, with no way through to the nave, keeps a coat of arms of the Monastery of Rueda. The base of the nave may contain remains of the medieval church; the building was last restored in 2010–2011.","fr":"Devant la porte, un porche à deux niveaux est couronné d'un clocher-mur, et près de la façade s'élève une structure carrée en pierre de taille qui semble un clocher resté inachevé. Une salle latérale, sans accès à la nef, conserve un blason du monastère de Rueda. La base de la nef pourrait garder des restes de l'église médiévale ; l'édifice a été restauré pour la dernière fois en 2010–2011.","de":"Vor der Tür steht eine zweigeschossige Vorhalle mit Glockengiebel, neben der Fassade ein quadratischer Quaderbau, der wie ein nie vollendeter Glockenturm aussieht. Ein Seitenraum ohne Durchgang zum Schiff bewahrt ein Wappen des Klosters Rueda. Im Sockel des Schiffs könnten Reste der mittelalterlichen Kirche stecken; zuletzt restauriert wurde der Bau 2010–2011.","pt":"Diante da porta há um alpendre de dois pisos rematado por uma sineira, e junto à fachada ergue-se uma estrutura quadrada de cantaria que parece um campanário que nunca se acabou. Uma sala lateral, sem passagem para a nave, conserva um brasão do Mosteiro de Rueda. Na base da nave pode haver restos da igreja medieval; o edifício foi restaurado pela última vez em 2010–2011."},"visit":{"es":"Exterior y entorno de acceso libre. La romería es el 25 de abril y las fiestas mayores de agosto honran a la Virgen de Montler; para ver el interior otro día, consulta en el Ayuntamiento de Sástago.","en":"The exterior and surroundings are open at all times. The pilgrimage is on 25 April, and the main August festival honours Our Lady of Montler; to see inside on other days, ask at Sástago town hall.","fr":"Extérieur et abords en accès libre. Le pèlerinage a lieu le 25 avril et les fêtes patronales d'août honorent la Vierge de Montler ; pour voir l'intérieur un autre jour, renseignez-vous à la mairie de Sástago.","de":"Außenbau und Umgebung frei zugänglich. Die Wallfahrt ist am 25. April, das große Augustfest gilt der Virgen de Montler; wer an anderen Tagen hinein möchte, fragt im Rathaus von Sástago.","pt":"Exterior e envolvente de acesso livre. A romaria é a 25 de abril e as festas de agosto honram a Virgem de Montler; para ver o interior noutro dia, informe-se no Ayuntamiento de Sástago."}},{"id":"sastago-meandros","town":"Sástago","cat":"naturaleza","lat":41.3201,"lon":-0.33317,"src":"https://sastago.es/municipio/turismo/","name":{"es":"Mirador de los meandros","en":"Meanders viewpoint","fr":"Belvédère des méandres","de":"Aussichtspunkt über die Ebroschleifen","pt":"Miradouro dos meandros"},"when":{"es":"Paisaje del Ebro y la estepa","en":"Ebro and steppe landscape","fr":"Paysage de l'Èbre et de la steppe","de":"Landschaft aus Ebro und Steppe","pt":"Paisagem do Ebro e da estepe"},"desc":{"es":"Vista de las curvas que dibuja el Ebro junto a Sástago. Es uno de los contrastes más fuertes de la comarca: a pocos metros de la vega verde del río empieza la estepa.","en":"A view of the curves the Ebro draws beside Sástago. It is one of the starkest contrasts in the district: a few metres from the river's green floodplain, the steppe begins.","fr":"Vue sur les courbes que dessine l'Èbre près de Sástago. C'est l'un des contrastes les plus forts de la comarque : à quelques mètres de la plaine verte du fleuve commence la steppe.","de":"Blick auf die Schleifen, die der Ebro bei Sástago zieht. Einer der stärksten Kontraste der Comarca: Wenige Meter hinter der grünen Flussaue beginnt die Steppe.","pt":"Vista das curvas que o Ebro desenha junto a Sástago. É um dos contrastes mais fortes da comarca: a poucos metros da várzea verde do rio começa a estepe."},"more":{"es":"El mirador está a unos 210 metros de altitud y desde él se ve Sástago encajado en uno de los grandes meandros del río. La estepa del otro lado es refugio de una fauna variada, con muchas especies endémicas. Muy cerca, junto a la Torre del Tambor, hay otro punto de vista con un panel que explica el paisaje.","en":"The viewpoint stands at about 210 metres, and from here you see Sástago tucked into one of the river's great meanders. The steppe on the far side shelters varied wildlife, including many endemic species. Close by, next to the Torre del Tambor, there is another lookout with a panel explaining the landscape.","fr":"Le belvédère se trouve à environ 210 mètres d'altitude ; on y voit Sástago niché dans l'un des grands méandres du fleuve. La steppe, sur l'autre rive, abrite une faune variée, avec de nombreuses espèces endémiques. Tout près, à côté de la Torre del Tambor, un autre point de vue dispose d'un panneau qui explique le paysage.","de":"Der Aussichtspunkt liegt auf rund 210 Metern; von hier sieht man Sástago eingebettet in eine der großen Flussschleifen. Die Steppe am anderen Ufer ist Rückzugsort einer vielfältigen Tierwelt mit vielen endemischen Arten. Ganz in der Nähe, am Torre del Tambor, gibt es einen weiteren Aussichtspunkt mit einer Infotafel zur Landschaft.","pt":"O miradouro fica a cerca de 210 metros de altitude e dali vê-se Sástago encaixado num dos grandes meandros do rio. A estepe da outra margem é refúgio de uma fauna variada, com muitas espécies endémicas. Muito perto, junto à Torre del Tambor, há outro ponto de vista com um painel que explica a paisagem."},"visit":{"es":"Acceso libre en todo momento. Calcula unos 15–20 minutos.","en":"Open access at all times. Allow 15–20 minutes.","fr":"Accès libre à tout moment. Comptez 15 à 20 minutes.","de":"Jederzeit frei zugänglich. 15–20 Minuten einplanen.","pt":"Acesso livre a qualquer hora. Conte com 15–20 minutos."}},{"id":"sastago-tambor","town":"Sástago","cat":"patrimonio","lat":41.31861,"lon":-0.34009,"src":"https://sastago.es/municipio/turismo/","name":{"es":"Torre del Tambor","en":"Torre del Tambor watchtower","fr":"Torre del Tambor","de":"Wachturm Torre del Tambor","pt":"Torre del Tambor"},"when":{"es":"Siglo XIX · restaurada en 1998","en":"19th century · restored 1998","fr":"XIXe siècle · restaurée en 1998","de":"19. Jh. · 1998 restauriert","pt":"Século XIX · restaurada em 1998"},"desc":{"es":"Torre vigía circular del siglo XIX, de dos plantas y 18 aspilleras, encaramada a un escarpe rocoso de la orilla derecha junto al puente. Vigilaba el paso del río y se restauró en 1998.","en":"A round 19th-century watchtower with two floors and 18 loopholes, perched on a rocky scarp on the right bank by the bridge. It guarded the river crossing and was restored in 1998.","fr":"Tour de guet circulaire du XIXe siècle, à deux niveaux et 18 meurtrières, perchée sur un escarpement rocheux de la rive droite près du pont. Elle surveillait le passage du fleuve et a été restaurée en 1998.","de":"Runder Wachturm aus dem 19. Jahrhundert mit zwei Geschossen und 18 Schießscharten, auf einem Felsabsatz am rechten Ufer neben der Brücke. Er bewachte den Flussübergang und wurde 1998 restauriert.","pt":"Torre de vigia circular do século XIX, com dois pisos e 18 seteiras, empoleirada numa escarpa rochosa da margem direita junto à ponte. Vigiava a passagem do rio e foi restaurada em 1998."},"more":{"es":"Mide unos 10 metros de diámetro y 6 de altura, y es un fortín de fusileros, un tipo de defensa muy habitual en el siglo XIX. En la restauración se rehízo buena parte de sus muros de mampostería. Junto a la torre hay un mirador con panel informativo desde el que se abarcan los meandros del Ebro y el pueblo.","en":"It is about 10 metres across and 6 metres high, a riflemen's blockhouse of a kind very common in the 19th century. Much of its rubble-stone walling was rebuilt during the restoration. Next to the tower is a viewpoint with an information panel, taking in the Ebro meanders and the town.","fr":"Elle mesure environ 10 mètres de diamètre et 6 de haut : c'est un fortin de fusiliers, type de défense très courant au XIXe siècle. Une bonne partie de ses murs en moellons a été refaite lors de la restauration. À côté de la tour, un belvédère avec panneau d'information embrasse les méandres de l'Èbre et le village.","de":"Der Turm misst etwa 10 Meter im Durchmesser und 6 Meter in der Höhe – ein Füsilierfort, wie es im 19. Jahrhundert sehr verbreitet war. Bei der Restaurierung wurde ein Großteil des Bruchsteinmauerwerks erneuert. Neben dem Turm liegt ein Aussichtspunkt mit Infotafel über die Ebroschleifen und den Ort.","pt":"Mede cerca de 10 metros de diâmetro e 6 de altura e é um fortim de fuzileiros, tipo de defesa muito comum no século XIX. No restauro refez-se boa parte dos muros de alvenaria. Junto à torre há um miradouro com painel informativo de onde se abarcam os meandros do Ebro e a vila."},"visit":{"es":"Exterior de acceso libre en todo momento; se llega a pie desde el puente. Calcula unos 20 minutos.","en":"The exterior is open at all times; it is a short walk from the bridge. Allow about 20 minutes.","fr":"Extérieur en accès libre à tout moment ; on y monte à pied depuis le pont. Comptez une vingtaine de minutes.","de":"Außen jederzeit frei zugänglich; zu Fuß von der Brücke aus erreichbar. Etwa 20 Minuten einplanen.","pt":"Exterior de acesso livre a qualquer hora; chega-se a pé desde a ponte. Conte com uns 20 minutos."}},{"id":"sastago-pilar","town":"Sástago","cat":"patrimonio","lat":41.3234,"lon":-0.3456,"src":"https://sastago.es/municipio/turismo/","name":{"es":"Iglesia de Nuestra Señora del Pilar","en":"Church of Our Lady of the Pillar","fr":"Église Notre-Dame-du-Pilar","de":"Kirche Nuestra Señora del Pilar","pt":"Igreja de Nossa Senhora do Pilar"},"when":{"es":"Barroca · terminada en 1689","en":"Baroque · completed 1689","fr":"Baroque · achevée en 1689","de":"Barock · 1689 vollendet","pt":"Barroca · concluída em 1689"},"desc":{"es":"Iglesia barroca del siglo XVII levantada sobre un templo anterior y terminada en 1689. Tiene una nave de tres tramos y torre de tres cuerpos, y sufrió daños importantes en la Guerra Civil.","en":"A 17th-century Baroque church built over an earlier one and completed in 1689. It has a three-bay nave and a three-stage tower, and was badly damaged in the Civil War.","fr":"Église baroque du XVIIe siècle élevée sur une église antérieure et achevée en 1689. Elle a une nef à trois travées et un clocher à trois niveaux, et a subi d'importants dégâts pendant la guerre civile.","de":"Barockkirche des 17. Jahrhunderts über einem Vorgängerbau, 1689 vollendet. Dreijochiges Schiff und dreigeschossiger Turm; im Bürgerkrieg schwer beschädigt.","pt":"Igreja barroca do século XVII erguida sobre um templo anterior e concluída em 1689. Tem uma nave de três tramos e torre de três corpos, e sofreu danos importantes na Guerra Civil."},"more":{"es":"Está construida en mampostería y ladrillo, con sillares que refuerzan las esquinas y el zócalo. Los tres tramos de la nave se separan con arcos fajones, y la torre combina dos cuerpos cuadrados con uno octogonal. La iglesia de Cinco Olivas se le parece tanto que los inventarios de patrimonio la fechan por comparación con esta.","en":"It is built of rubble stone and brick, with ashlar reinforcing the corners and the base. Transverse arches divide the nave into its three bays, and the tower combines two square stages with an octagonal one. The church at Cinco Olivas is so similar that heritage inventories date it by comparison with this one.","fr":"Elle est bâtie en moellons et en brique, avec de la pierre de taille aux angles et au soubassement. Des arcs doubleaux séparent les trois travées de la nef, et le clocher associe deux niveaux carrés à un niveau octogonal. L'église de Cinco Olivas lui ressemble tant que les inventaires du patrimoine la datent par comparaison avec celle-ci.","de":"Sie ist aus Bruchstein und Backstein gebaut, Ecken und Sockel sind mit Quadern verstärkt. Gurtbögen trennen die drei Joche des Schiffs, der Turm verbindet zwei quadratische Geschosse mit einem achteckigen. Die Kirche von Cinco Olivas ähnelt ihr so sehr, dass Denkmalinventare sie anhand dieser Kirche datieren.","pt":"É construída em alvenaria e tijolo, com cantaria a reforçar os cunhais e o embasamento. Arcos torais separam os três tramos da nave, e a torre combina dois corpos quadrados com um octogonal. A igreja de Cinco Olivas é tão parecida que os inventários de património a datam por comparação com esta."},"visit":{"es":"Exterior visible en todo momento; para el interior, acude en horario de culto o consulta en el Ayuntamiento de Sástago.","en":"The exterior can be seen at any time; for the interior, go at service times or ask at Sástago town hall.","fr":"Extérieur visible à tout moment ; pour l'intérieur, venez aux heures des offices ou renseignez-vous à la mairie de Sástago.","de":"Außen jederzeit zu sehen; innen zu den Gottesdienstzeiten oder nach Anfrage im Rathaus von Sástago.","pt":"Exterior visível a qualquer hora; para o interior, vá no horário das celebrações ou informe-se no Ayuntamiento de Sástago."}},{"id":"rueda","town":"Sástago","cat":"patrimonio","lat":41.29737,"lon":-0.314,"src":"https://www.turismodearagon.com/ficha/real-monasterio-de-nuestra-senora-de-rueda-sastago/","name":{"es":"Real Monasterio de Nuestra Señora de Rueda","en":"Royal Monastery of Our Lady of Rueda","fr":"Monastère royal Notre-Dame de Rueda","de":"Königliches Kloster Nuestra Señora de Rueda","pt":"Real Mosteiro de Nossa Senhora de Rueda"},"when":{"es":"1202–1238 · cisterciense · Monumento Nacional desde 1924","en":"1202–1238 · Cistercian · National Monument since 1924","fr":"1202–1238 · cistercien · monument national depuis 1924","de":"1202–1238 · Zisterzienser · Nationaldenkmal seit 1924","pt":"1202–1238 · cisterciense · Monumento Nacional desde 1924"},"desc":{"es":"En 1182 Alfonso II cedió Escatrón al Císter; la comunidad se instaló aquí en 1202 y la iglesia se consagró en 1238. Es una de las grandes abadías cistercienses de Aragón, con una torre mudéjar del siglo XIV, y es Monumento Nacional desde 1924. El Gobierno de Aragón lo restauró y lo habilitó como hospedería.","en":"In 1182 Alfonso II gave Escatrón to the Cistercians; the monks settled here in 1202 and the church was consecrated in 1238. It is one of the great Cistercian abbeys of Aragón, with a 14th-century Mudéjar tower, and has been a National Monument since 1924. The Government of Aragón restored it and fitted it out as a guesthouse.","fr":"En 1182, Alphonse II céda Escatrón aux cisterciens ; les moines s'y installèrent en 1202 et l'église fut consacrée en 1238. C'est l'une des grandes abbayes cisterciennes d'Aragon, avec une tour mudéjare du XIVe siècle, monument national depuis 1924. Le gouvernement d'Aragon l'a restauré et aménagé en hôtellerie.","de":"1182 überließ Alfons II. Escatrón den Zisterziensern; 1202 ließen sich die Mönche hier nieder, 1238 wurde die Kirche geweiht. Es ist eine der großen Zisterzienserabteien Aragoniens mit einem Mudéjar-Turm aus dem 14. Jahrhundert und seit 1924 Nationaldenkmal. Die Regierung Aragoniens hat es restauriert und als Gästehaus eingerichtet.","pt":"Em 1182 Afonso II cedeu Escatrón à Ordem de Cister; os monges instalaram-se aqui em 1202 e a igreja foi consagrada em 1238. É uma das grandes abadias cistercienses de Aragão, com uma torre mudéjar do século XIV, e é Monumento Nacional desde 1924. O Governo de Aragão restaurou-o e adaptou-o a hospedaria."},"more":{"es":"La iglesia tiene tres naves de cinco tramos sin crucero, y a media altura los muros pasan de piedra a ladrillo, quizá por falta de fondos. La torre mudéjar se alzó sobre la cabecera, algo raro en el Císter, que desaconsejaba los campanarios. En torno al claustro están la sala capitular, de dos naves, el refectorio y, frente a él, el lavatorio octogonal; en el siglo XVI se añadieron el palacio abacial y la plaza de San Pedro.","en":"The church has three naves of five bays and no transept, and halfway up the walls switch from stone to brick, perhaps for lack of funds. The Mudéjar tower was raised over the east end, unusual for the Cistercians, who discouraged bell towers. Around the cloister are the two-aisled chapter house, the refectory and, facing it, the octagonal lavabo; the abbot's palace and the Plaza de San Pedro were added in the 16th century.","fr":"L'église compte trois nefs de cinq travées sans transept, et à mi-hauteur les murs passent de la pierre à la brique, peut-être faute d'argent. La tour mudéjare a été élevée sur le chevet, chose rare chez les cisterciens, qui déconseillaient les clochers. Autour du cloître se trouvent la salle capitulaire à deux nefs, le réfectoire et, en face, le lavabo octogonal ; le palais abbatial et la place Saint-Pierre datent du XVIe siècle.","de":"Die Kirche hat drei Schiffe zu je fünf Jochen ohne Querhaus; auf halber Höhe wechseln die Mauern von Stein zu Backstein, vielleicht aus Geldmangel. Der Mudéjar-Turm wurde über dem Chor errichtet – ungewöhnlich für die Zisterzienser, die Glockentürme ablehnten. Um den Kreuzgang liegen der zweischiffige Kapitelsaal, das Refektorium und gegenüber das achteckige Brunnenhaus; Abtspalast und Plaza de San Pedro kamen im 16. Jahrhundert hinzu.","pt":"A igreja tem três naves de cinco tramos sem transepto, e a meia altura as paredes passam de pedra a tijolo, talvez por falta de dinheiro. A torre mudéjar ergue-se sobre a cabeceira, algo raro em Cister, que desaconselhava campanários. À volta do claustro ficam a sala do capítulo, de duas naves, o refeitório e, em frente, o lavabo octogonal; no século XVI juntaram-se o palácio abacial e a praça de São Pedro."},"visit":{"es":"Visita libre con audioguía (español, inglés y francés) de unos 45 minutos; entradas por internet y en taquilla hasta completar aforo. El horario cambia según la temporada, así que confírmalo antes; el recorrido no está adaptado para sillas de ruedas.","en":"Self-guided visit with an audio guide (Spanish, English and French) lasting about 45 minutes; tickets online and at the ticket office until capacity is reached. Opening hours change with the season, so check before you go; the route is not wheelchair-accessible.","fr":"Visite libre avec audioguide (espagnol, anglais et français) d'environ 45 minutes ; billets en ligne et au guichet dans la limite des places. Les horaires changent selon la saison, vérifiez-les avant de venir ; le parcours n'est pas adapté aux fauteuils roulants.","de":"Individueller Rundgang mit Audioguide (Spanisch, Englisch, Französisch), etwa 45 Minuten; Tickets online und an der Kasse, solange Plätze frei sind. Die Öffnungszeiten wechseln je nach Saison – vorher prüfen; der Rundgang ist nicht rollstuhlgerecht.","pt":"Visita livre com audioguia (espanhol, inglês e francês) de cerca de 45 minutos; bilhetes online e na bilheteira até esgotar a lotação. O horário muda conforme a época, por isso confirme antes; o percurso não está adaptado a cadeiras de rodas."}},{"id":"rueda-noria","town":"Sástago","cat":"hidraulico","lat":41.2969,"lon":-0.3147,"src":"https://www.turismodearagon.com/ficha/real-monasterio-de-nuestra-senora-de-rueda-sastago/","name":{"es":"Noria y azud de Rueda","en":"Rueda waterwheel and weir","fr":"Noria et barrage de Rueda","de":"Wasserrad und Wehr von Rueda","pt":"Nora e açude de Rueda"},"when":{"es":"Ingeniería monástica · noria de 18 m","en":"Monastic engineering · 18 m wheel","fr":"Ingénierie monastique · roue de 18 m","de":"Klosterbaukunst · 18-m-Rad","pt":"Engenharia monástica · nora de 18 m"},"desc":{"es":"Los monjes cerraron el Ebro con un azud y levantaron una noria de 18 metros de diámetro, la «rueda» que da nombre al monasterio. Subía el agua a un acueducto gótico que la repartía por todo el conjunto. Al lado se conserva un molino harinero.","en":"The monks built a weir across the Ebro and raised a waterwheel 18 metres across, the “rueda” that gives the monastery its name. It lifted water to a Gothic aqueduct that carried it through the whole complex. A flour mill survives beside it.","fr":"Les moines barrèrent l'Èbre d'un barrage et élevèrent une noria de 18 mètres de diamètre, la « rueda » qui donne son nom au monastère. Elle montait l'eau jusqu'à un aqueduc gothique qui la distribuait dans tout l'ensemble. Un moulin à farine est conservé à côté.","de":"Die Mönche bauten ein Wehr in den Ebro und ein Wasserrad von 18 Metern Durchmesser, die „rueda“, die dem Kloster den Namen gibt. Es hob das Wasser in einen gotischen Aquädukt, der die ganze Anlage versorgte. Daneben ist eine Getreidemühle erhalten.","pt":"Os monges fecharam o Ebro com um açude e ergueram uma nora de 18 metros de diâmetro, a «rueda» que dá nome ao mosteiro. Elevava a água até um aqueduto gótico que a distribuía por todo o conjunto. Ao lado conserva-se um moinho de farinha."},"more":{"es":"Los cangilones de la rueda vertían el agua en un canal que alimentaba el acueducto, y desde ahí llegaba a las distintas dependencias del monasterio. El mecanismo de la noria se reconstruyó durante la restauración del conjunto, que se completó en 2003.","en":"The wheel's buckets tipped the water into a channel feeding the aqueduct, which carried it on to the different parts of the monastery. The waterwheel's mechanism was rebuilt during the restoration of the complex, completed in 2003.","fr":"Les godets de la roue déversaient l'eau dans un canal qui alimentait l'aqueduc, d'où elle gagnait les différents bâtiments du monastère. Le mécanisme de la noria a été reconstruit lors de la restauration de l'ensemble, achevée en 2003.","de":"Die Schöpfgefäße des Rades gossen das Wasser in eine Rinne, die den Aquädukt speiste; von dort gelangte es in die einzelnen Klostergebäude. Das Räderwerk wurde bei der 2003 abgeschlossenen Restaurierung der Anlage rekonstruiert.","pt":"Os alcatruzes da roda despejavam a água num canal que alimentava o aqueduto, e dali chegava às várias dependências do mosteiro. O mecanismo da nora foi reconstruído durante o restauro do conjunto, concluído em 2003."},"visit":{"es":"Está a orillas del Ebro, junto al monasterio, y se ve desde fuera; para entender bien el sistema hidráulico, combínala con la visita al monasterio.","en":"It stands on the bank of the Ebro beside the monastery and can be seen from outside; to make sense of the whole water system, combine it with a visit to the monastery.","fr":"Elle se dresse au bord de l'Èbre, à côté du monastère, et se voit de l'extérieur ; pour bien comprendre le système hydraulique, combinez-la avec la visite du monastère.","de":"Es steht am Ebroufer neben dem Kloster und ist von außen zu sehen; um das Wassersystem zu verstehen, verbindet man es am besten mit dem Klosterbesuch.","pt":"Fica na margem do Ebro, junto ao mosteiro, e vê-se do exterior; para perceber bem o sistema hidráulico, combine-a com a visita ao mosteiro."}},{"id":"escatron-tozal","town":"Escatrón","cat":"naturaleza","lat":41.29267,"lon":-0.32102,"src":"https://www.komoot.com/highlight/5818612","name":{"es":"Mirador de El Tozal","en":"El Tozal viewpoint","fr":"Belvédère d'El Tozal","de":"Aussichtspunkt El Tozal","pt":"Miradouro de El Tozal"},"when":{"es":"Vista del Ebro y de Rueda","en":"View of the Ebro and Rueda","fr":"Vue sur l'Èbre et Rueda","de":"Blick auf Ebro und Rueda","pt":"Vista do Ebro e de Rueda"},"desc":{"es":"Balcón sobre el Ebro desde el que se ve el Monasterio de Rueda en la orilla de enfrente. Es uno de los mejores puntos para fotografiar juntos el monasterio y el río.","en":"A balcony over the Ebro with the Monastery of Rueda on the opposite bank. It is one of the best spots to photograph the monastery and the river together.","fr":"Un balcon sur l'Èbre avec, en face, le monastère de Rueda. C'est l'un des meilleurs endroits pour photographier ensemble le monastère et le fleuve.","de":"Ein Balkon über dem Ebro mit dem Kloster Rueda am gegenüberliegenden Ufer. Einer der besten Plätze für ein Foto von Kloster und Fluss zusammen.","pt":"Uma varanda sobre o Ebro com o Mosteiro de Rueda na margem oposta. É um dos melhores sítios para fotografar o mosteiro e o rio juntos."},"more":{"es":"Está en lo alto del pueblo, a unos 160 metros, y ofrece una panorámica de 360 grados que va de los cerros de Escatrón a la ribera del Ebro. Tiene un panel que identifica lo que se ve y una zona de barbacoas y juegos infantiles.","en":"It sits at the top of the town, at about 160 metres, with a 360-degree panorama from Escatrón's hills to the banks of the Ebro. There is a panel identifying what you can see, plus a barbecue area and a children's play area.","fr":"Il se trouve en haut du village, à environ 160 mètres, et offre un panorama à 360 degrés des collines d'Escatrón jusqu'aux rives de l'Èbre. Un panneau identifie ce que l'on voit, et il y a une aire de barbecue et des jeux pour enfants.","de":"Er liegt oben im Ort auf etwa 160 Metern und bietet ein 360-Grad-Panorama von den Hügeln um Escatrón bis zum Ebroufer. Eine Tafel erklärt, was man sieht; dazu gibt es einen Grillplatz und einen Kinderspielplatz.","pt":"Fica no alto da vila, a cerca de 160 metros, e oferece uma panorâmica de 360 graus que vai dos cerros de Escatrón à margem do Ebro. Tem um painel que identifica o que se vê e uma zona de churrascos e de jogos infantis."},"visit":{"es":"Acceso libre en todo momento. Calcula unos 15 minutos, o más si vienes con niños.","en":"Open access at all times. Allow about 15 minutes, longer if you have children with you.","fr":"Accès libre à tout moment. Comptez environ 15 minutes, davantage avec des enfants.","de":"Jederzeit frei zugänglich. Etwa 15 Minuten einplanen, mit Kindern mehr.","pt":"Acesso livre a qualquer hora. Conte com uns 15 minutos, ou mais se vier com crianças."}},{"id":"escatron-asuncion","town":"Escatrón","cat":"patrimonio","lat":41.29263,"lon":-0.32493,"src":"https://campaners.com/php/torrepdf.php?numer=9731","name":{"es":"Iglesia de la Asunción de Escatrón","en":"Church of the Assumption, Escatrón","fr":"Église de l'Assomption d'Escatrón","de":"Mariä-Himmelfahrt-Kirche, Escatrón","pt":"Igreja da Assunção de Escatrón"},"when":{"es":"Barroca · retablo de alabastro del siglo XVI","en":"Baroque · 16th-century alabaster altarpiece","fr":"Baroque · retable d'albâtre du XVIe siècle","de":"Barock · Alabasteraltar des 16. Jh.","pt":"Barroca · retábulo de alabastro do século XVI"},"desc":{"es":"Iglesia barroca de planta jesuítica, rehecha en la segunda mitad del siglo XVII; conserva tres capillas renacentistas del templo anterior. En el ábside está un retablo de alabastro del siglo XVI que procede del Monasterio de Rueda.","en":"A Baroque church on a Jesuit-style plan, rebuilt in the second half of the 17th century; it keeps three Renaissance chapels from the earlier church. In the apse stands a 16th-century alabaster altarpiece brought from the Monastery of Rueda.","fr":"Église baroque de plan jésuite, refaite dans la seconde moitié du XVIIe siècle ; elle conserve trois chapelles Renaissance de l'église antérieure. Dans l'abside, un retable d'albâtre du XVIe siècle provenant du monastère de Rueda.","de":"Barockkirche mit jesuitischem Grundriss, in der zweiten Hälfte des 17. Jahrhunderts neu gebaut; drei Renaissancekapellen des Vorgängerbaus sind erhalten. In der Apsis steht ein Alabasteraltar des 16. Jahrhunderts aus dem Kloster Rueda.","pt":"Igreja barroca de planta jesuítica, refeita na segunda metade do século XVII; conserva três capelas renascentistas do templo anterior. Na abside está um retábulo de alabastro do século XVI vindo do Mosteiro de Rueda."},"more":{"es":"Toda la iglesia es de grandes sillares de arenisca, y en los contrafuertes asoman gárgolas con figuras de animales y humanas. Su planta jesuítica se explica por el colegio que la Compañía tuvo en el pueblo: las capillas del lado del evangelio se comunican entre sí y sobre ellas corre una tribuna con arcos pareados. En la tercera capilla del otro lado se ve tapiada la puerta original del templo del siglo XVI.","en":"The whole church is built of large sandstone blocks, and gargoyles with animal and human figures jut from the buttresses. Its Jesuit-style plan reflects the college the Jesuits had in the town: the chapels on the north (Gospel) side connect with one another, with a gallery of paired arches running above them. In the third chapel on the opposite side you can see the walled-up original door of the 16th-century church.","fr":"Toute l'église est bâtie en gros blocs de grès, et des gargouilles à figures animales et humaines saillent des contreforts. Son plan jésuite s'explique par le collège que la Compagnie avait au village : les chapelles du côté de l'évangile communiquent entre elles, surmontées d'une tribune à arcs géminés. Dans la troisième chapelle du côté opposé, on voit murée la porte d'origine de l'église du XVIe siècle.","de":"Die ganze Kirche besteht aus großen Sandsteinquadern; an den Strebepfeilern ragen Wasserspeier mit Tier- und Menschenfiguren hervor. Der jesuitische Grundriss erklärt sich aus dem Kolleg, das der Orden im Ort hatte: Die Kapellen der Evangelienseite sind untereinander verbunden, darüber verläuft eine Empore mit Zwillingsbögen. In der dritten Kapelle der Gegenseite ist die zugemauerte ursprüngliche Tür der Kirche aus dem 16. Jahrhundert zu sehen.","pt":"Toda a igreja é de grandes silhares de arenito, e nos contrafortes surgem gárgulas com figuras de animais e humanas. A planta jesuítica explica-se pelo colégio que a Companhia teve na vila: as capelas do lado do evangelho comunicam entre si e sobre elas corre uma tribuna com arcos geminados. Na terceira capela do lado oposto vê-se emparedada a porta original do templo do século XVI."},"visit":{"es":"Exterior visible en todo momento; para ver el retablo de alabastro, acude en horario de culto o consulta en el Ayuntamiento de Escatrón.","en":"The exterior can be seen at any time; to see the alabaster altarpiece, go at service times or ask at Escatrón town hall.","fr":"Extérieur visible à tout moment ; pour voir le retable d'albâtre, venez aux heures des offices ou renseignez-vous à la mairie d'Escatrón.","de":"Außen jederzeit zu sehen; den Alabasteraltar zu den Gottesdienstzeiten oder nach Anfrage im Rathaus von Escatrón.","pt":"Exterior visível a qualquer hora; para ver o retábulo de alabastro, vá no horário das celebrações ou informe-se no Ayuntamiento de Escatrón."}},{"id":"escatron-sfjavier","town":"Escatrón","cat":"patrimonio","lat":41.28985,"lon":-0.32301,"src":"https://www.campaners.com/php/torrepdf.php?numer=9786","name":{"es":"Ruinas de San Francisco Javier","en":"Ruins of St Francis Xavier","fr":"Ruines de Saint-François-Xavier","de":"Ruine San Francisco Javier","pt":"Ruínas de São Francisco Xavier"},"when":{"es":"Siglos XVII–XVIII · antiguo colegio jesuita","en":"17th–18th centuries · former Jesuit college","fr":"XVIIe–XVIIIe siècles · ancien collège jésuite","de":"17.–18. Jh. · ehemaliges Jesuitenkolleg","pt":"Séculos XVII–XVIII · antigo colégio jesuíta"},"desc":{"es":"Restos de la iglesia del antiguo colegio jesuita, de finales del siglo XVII o comienzos del XVIII. Su fachada de dos torres gemelas con cuerpo octogonal sigue en pie y es una de las siluetas más reconocibles de Escatrón.","en":"The remains of the church of the former Jesuit college, from the late 17th or early 18th century. Its façade with twin octagonal towers still stands and is one of Escatrón's landmarks.","fr":"Vestiges de l'église de l'ancien collège jésuite, de la fin du XVIIe ou du début du XVIIIe siècle. Sa façade à deux tours jumelles octogonales est toujours debout et compte parmi les silhouettes les plus reconnaissables d'Escatrón.","de":"Reste der Kirche des ehemaligen Jesuitenkollegs aus dem späten 17. oder frühen 18. Jahrhundert. Die Fassade mit zwei achteckigen Zwillingstürmen steht noch und ist ein Wahrzeichen von Escatrón.","pt":"Restos da igreja do antigo colégio jesuíta, do final do século XVII ou início do XVIII. A fachada de duas torres gémeas octogonais continua de pé e é uma das silhuetas mais reconhecíveis de Escatrón."},"more":{"es":"Las dos torres repiten el mismo esquema: base integrada en la fachada, un cuerpo cuadrado de ladrillo y otro octogonal rematado por una pequeña cúpula. La portada, de medio punto, tiene dovelas escalonadas a modo de arquivoltas. Según un inventario de 1988, el crucero se cubría con una cúpula ciega sobre pechinas; las dependencias del colegio adosadas se convirtieron en viviendas, hoy también en ruina.","en":"The two towers follow the same scheme: a base built into the façade, a
